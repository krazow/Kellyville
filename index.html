    },
    {
      key: 'chinook', name: 'Chinook Wind Thaw', emoji: '🌬️', kind: 'good', seasons: ['winter'], minLevel: 1, weight: 1, durationSec: 120,
      desc: 'A warm wind melts the snow overnight.',
      mods: { growth: { crops: 'all', mult: 0.88 }, animal: { animals: 'all', mult: 0.88 } },
      onStart() { return { sped: strike({ crops: 'all', fraction: 1, mode: 'delayPct', amount: -0.12 }).length }; },
      text: () => 'A warm Chinook wind swept down from the Cascades and melted the snow overnight. Everything perks up.'
    },
    {
      key: 'crush_season', name: 'Wine Country Crush', emoji: '🍷', kind: 'good', seasons: ['fall'], minLevel: 3, weight: 1, durationSec: 150,
      desc: 'Wine tourists flock to Walla Walla and Red Mountain.',
      mods: { price: { products: ['grapes', 'wine', 'apple_cider'], mult: 1.45 } },
      text: () => 'Harvest crush is on and wine tourists are everywhere. Grapes, wine and cider fetch premium prices.'
    }
  ];

  const DEF = {};
  defs.forEach(d => { DEF[d.key] = d; });

  // ---------- mods ----------
  function specsOf(rec, def, type) {
    const out = [];
    const add = m => { if (m && m[type]) [].concat(m[type]).forEach(s => s && out.push(s)); };
    add(def.mods);
    if (rec.ci != null && def.choices && def.choices[rec.ci]) add(def.choices[rec.ci].mods);
    return out;
  }
  const listOf = (type, s) => (type === 'growth' || type === 'yield') ? s.crops : type === 'animal' ? s.animals : s.products;
  const matches = (list, key) => !list || list === 'all' || [].concat(list).indexOf(key) >= 0;
  function combined(type, key) {
    const now = U.now(); let m = 1;
    (S().activeEvents || []).forEach(rec => {
      if (!rec || rec.pending || !(rec.endAt > now)) return;
      const def = DEF[rec.key]; if (!def) return;
      specsOf(rec, def, type).forEach(s => {
        if (!matches(listOf(type, s), key)) return;
        const v = s.fixed ? s.mult : scaleMult(s.mult, rec.k);
        if (isFinite(v)) m *= v;
      });
    });
    const c = CLAMP[type];
    return isFinite(m) ? U.clamp(m, c[0], c[1]) : 1;
  }

  // ---------- describe ----------
  function lookup(type, k) {
    const D = G.DATA || {};
    return type === 'animal' ? (D.animals || {})[k] : ((D.products || {})[k] || (D.crops || {})[k]);
  }
  function labelFor(type, s) {
    if (s.label) return s.label;
    const list = listOf(type, s);
    if (!list || list === 'all') return type === 'animal' ? '🐾 All animals' : type === 'price' ? '💰 All goods' : '🌱 All crops';
    const arr = [].concat(list);
    const nm = k => { const i = lookup(type, k); return (i && i.emoji ? i.emoji + ' ' : '') + ((i && i.name) || pretty(k)); };
    if (arr.length <= 2) return arr.map(nm).join(' & ');
    return nm(arr[0]) + ' +' + (arr.length - 1) + ' more';
  }
  function describeMods(rec) {
    const out = [];
    try {
      const def = rec && DEF[rec.key]; if (!def || rec.pending) return out;
      ['growth', 'yield', 'animal', 'price'].forEach(type => {
        specsOf(rec, def, type).forEach(s => {
          const m = s.fixed ? s.mult : scaleMult(s.mult, rec.k);
          if (!isFinite(m) || Math.abs(m - 1) < 0.005) return;
          const label = labelFor(type, s);
          if (type === 'growth' || type === 'animal') {
            const p = Math.round((1 - m) * 100), what = type === 'growth' ? 'growth' : 'production';
            out.push(label + ' ' + what + ' ' + Math.abs(p) + '% ' + (p >= 0 ? 'faster' : 'slower'));
          } else {
            const p = Math.round((m - 1) * 100);
            out.push(label + ' ' + type + ' ' + (p >= 0 ? '+' : '') + p + '%');
          }
        });
      });
    } catch (e) { /* ignore */ }
    return out;
  }
  const timeLeft = rec => rec ? Math.max(0, Math.ceil((rec.endAt - U.now()) / 1000)) : 0;

  // ---------- event lifecycle ----------
  function makeCtx(def, rec) {
    const level = S().level || 1, soft = level <= 2;
    const tags = def.mitigatedBy ? [].concat(def.mitigatedBy) : [];
    const mitTag = def.kind === 'bad' ? tags.filter(hasTag)[0] : null;
    const ampTag = def.amplifiedBy ? [].concat(def.amplifiedBy).filter(hasTag)[0] : null;
    let k = 1;
    if (def.kind === 'bad') { if (mitTag) k *= 0.5; if (soft) k *= 0.6; } else if (ampTag) k = 1.5;
    return { def, record: rec, G, level, soft, mitigated: !!mitTag, amplified: !!ampTag, mitTag, ampTag, k, hasTag, strike, result: {} };
  }
  function ctxFor(def, rec) {
    const c = makeCtx(def, rec);
    if (rec.k != null) { c.k = rec.k; c.mitigated = !!rec.mit; c.amplified = !!rec.amp; c.soft = !!rec.soft; }
    return c;
  }
  const costOf = (ch, ctx) => Math.max(0, Math.round(typeof ch.cost === 'function' ? ch.cost(ctx) : (ch.cost || 0)));
  function choicesFor(def, rec) {
    return (def.choices || []).map((c, i) => {
      const cost = (rec.costs && rec.costs[i] != null) ? rec.costs[i] : 0;
      return { index: i, label: c.label, cost, desc: c.desc, affordable: S().coins >= cost };
    });
  }
  function logEntry(def, rec, text) {
    const s = ensure();
    s.eventLog.push({ key: def.key, name: def.name, emoji: def.emoji, kind: def.kind, at: rec.startAt, text });
    while (s.eventLog.length > 30) s.eventLog.shift();
    s.stats.eventsSeen++;
  }
  function removeActive(rec) {
    const a = S().activeEvents, i = a.indexOf(rec);
    if (i >= 0) a.splice(i, 1);
  }

  function startEvent(def) {
    const s = ensure(), now = U.now();
    const rec = { id: U.uid(), key: def.key, startAt: now, endAt: now + (def.durationSec || 0) * 1000 };
    const ctx = makeCtx(def, rec);
    rec.k = Math.round(ctx.k * 1000) / 1000;
    if (ctx.mitigated) rec.mit = 1;
    if (ctx.amplified) rec.amp = 1;
    if (ctx.soft) rec.soft = 1;
    const hasChoices = !!(def.choices && def.choices.length);
    if (hasChoices) {
      rec.pending = true; rec.endAt = now + CHOICE_SEC * 1000;
      rec.costs = def.choices.map(c => costOf(c, ctx));
    }
    try { ctx.result = (def.onStart && def.onStart(ctx)) || {}; } catch (e) { console.error('[events] onStart', def.key, e); ctx.result = {}; }
    let text = '';
    try { text = def.text(ctx); } catch (e) { console.error('[events] text', def.key, e); text = def.desc || def.name; }
    if (ctx.mitigated) text += ' 🛡️ Your ' + (TAG_NAMES[ctx.mitTag] || ctx.mitTag) + ' cut the damage in half.';
    if (ctx.amplified) text += ' ✨ Your ' + (TAG_NAMES[ctx.ampTag] || ctx.ampTag) + ' amplified the benefit!';
    if (hasChoices || (def.durationSec || 0) > 0) s.activeEvents.push(rec);
    logEntry(def, rec, text);
    G.toast(def.emoji + ' ' + def.name + (hasChoices ? ': decide now!' : ': ' + text), def.kind);
    G.bus.emit('event:start', { event: rec, def, text, choices: hasChoices ? choicesFor(def, rec) : undefined, result: ctx.result });
    G.bus.emit('change');
    return rec;
  }

  function resolveChoice(rec, def, idx, auto) {
    const ch = def.choices && def.choices[idx]; if (!ch) return false;
    const ctx = ctxFor(def, rec);
    let res;
    try { res = ch.apply(ctx); } catch (e) { console.error('[events] choice', def.key, e); res = null; }
    let text = (res && typeof res === 'object') ? res.text : res;
    text = text || ch.label;
    if (auto) text = 'No decision in time. ' + text;
    rec.pending = false; rec.ci = idx; delete rec.costs;
    const dur = (ch.durationSec != null ? ch.durationSec : def.durationSec) || 0;
    const keep = dur > 0;
    if (keep) rec.endAt = U.now() + dur * 1000;
    const s = S();
    for (let i = s.eventLog.length - 1; i >= 0; i--) {
      const e = s.eventLog[i];
      if (e.key === def.key && e.at === rec.startAt) { e.text += ' → ' + text; e.choice = ch.label; break; }
    }
    G.toast(def.emoji + ' ' + text, def.kind === 'bad' && /spared|dried|protected|back before|held/.test(text) ? 'good' : def.kind);
    if (!keep) removeActive(rec);
    G.bus.emit('event:choice', { event: rec, def, choice: idx, text, auto: !!auto });
    if (!keep) G.bus.emit('event:end', { event: rec, def });
    G.bus.emit('change');
    return true;
  }

  function choose(id, idx) {
    try {
      ensure();
      const rec = S().activeEvents.find(r => r.id === id);
      if (!rec || !rec.pending) return false;
      const def = DEF[rec.key]; if (!def || !def.choices) return false;
      idx = Number(idx);
      if (!Number.isInteger(idx) || idx < 0 || idx >= def.choices.length) return false;
      const cost = (rec.costs && rec.costs[idx]) || 0;
      if (cost > 0 && !G.spend(cost)) return false;
      return resolveChoice(rec, def, idx, false);
    } catch (e) { console.error('[events] choose', e); return false; }
  }

  // ---------- scheduler ----------
  function season() { try { return G.calendar().season; } catch (e) { return 'spring'; } }
  function eligible(def, seas, level) {
    if (!(def.weight > 0)) return false;
    if (def.seasons && def.seasons.length && def.seasons.indexOf(seas) < 0) return false;
    if ((def.minLevel || 1) > level) return false;
    const s = S();
    if (s.flags['events.lastKey'] === def.key) return false;
    if (s.activeEvents.some(r => r.key === def.key)) return false;
    if (def.requires) { try { if (!def.requires()) return false; } catch (e) { return false; } }
    return true;
  }
  function pickDef() {
    const level = S().level || 1, seas = season(), soft = level <= 2;
    const recent = S().eventLog.slice(-2);
    const twoBad = recent.length === 2 && recent.every(e => e.kind === 'bad');
    const twoGood = recent.length === 2 && recent.every(e => e.kind === 'good');
    const pool = defs.filter(d => eligible(d, seas, level));
    return U.weightedPick(pool, d => {
      let w = d.weight;
      if (d.kind === 'bad') { if (soft) w *= 0.5; if (twoBad) w *= 0.35; }
      else { if (soft) w *= 1.6; if (twoGood) w *= 0.6; }
      return w;
    });
  }
  function expire(now) {
    S().activeEvents.slice().forEach(rec => {
      const def = DEF[rec.key];
      if (!def) { removeActive(rec); return; }
      if (now < rec.endAt) return;
      if (rec.pending) { resolveChoice(rec, def, def.choices.length - 1, true); return; }
      removeActive(rec);
      G.bus.emit('event:end', { event: rec, def });
      G.bus.emit('change');
    });
  }
  function schedule(now) {
    const s = S(), f = s.flags;
    if (!f['events.nextAt']) f['events.nextAt'] = Math.max(s.startedAt + 60000, now) + U.rand(25000, 90000);
    if (now < f['events.nextAt']) return;
    if (now - s.startedAt < 60000) { f['events.nextAt'] = s.startedAt + 60000 + U.rand(5000, 30000); return; }
    if (s.activeEvents.length >= MAX_ACTIVE) { f['events.nextAt'] = now + 20000; return; }
    const def = pickDef();
    if (!def) { f['events.nextAt'] = now + 30000; return; }
    f['events.nextAt'] = now + U.rand(120000, 240000);
    f['events.lastKey'] = def.key;
    startEvent(def);
  }

  G.bus.on('tick', p => {
    try {
      ensure();
      const now = (p && p.now) || U.now();
      expire(now);
      schedule(now);
    } catch (e) { console.error('[events] tick', e); }
  });

  G.bus.on('init', () => {
    try {
      const s = ensure(), now = U.now();
      s.activeEvents = s.activeEvents.filter(r => r && DEF[r.key] && (r.pending || now < r.endAt));
      s.activeEvents.slice().forEach(rec => {
        if (!rec.pending) return;
        const def = DEF[rec.key];
        if (now >= rec.endAt) { resolveChoice(rec, def, def.choices.length - 1, true); return; }
        setTimeout(() => {
          try { if (rec.pending) G.bus.emit('event:start', { event: rec, def, text: def.text(ctxFor(def, rec)), choices: choicesFor(def, rec), resumed: true }); } catch (e) { console.error(e); }
        }, 50);
      });
      const f = s.flags;
      if (!f['events.nextAt'] || f['events.nextAt'] < now) f['events.nextAt'] = Math.max(s.startedAt + 60000, now) + U.rand(25000, 75000);
    } catch (e) { console.error('[events] init', e); }
  });

  // ---------- public API ----------
  G.Events = {
    register(def) {
      if (!def || !def.key || DEF[def.key]) return false;
      def.weight = def.weight == null ? 1 : def.weight; def.seasons = def.seasons || ['spring', 'summer', 'fall', 'winter']; def.minLevel = def.minLevel || 1;
      defs.push(def); DEF[def.key] = def; return true;
    },
    definitions: defs,
    growthMult: key => combined('growth', key),
    yieldMult: key => combined('yield', key),
    animalMult: key => combined('animal', key),
    priceMult: key => combined('price', key),
    active() { ensure(); const now = U.now(); return S().activeEvents.filter(r => r && DEF[r.key] && (r.pending || now < r.endAt)); },
    pending() { return G.Events.active().filter(r => r.pending); },
    def: key => DEF[key] || null,
    trigger(key) {
      const def = DEF[key]; if (!def) return null;
      ensure();
      S().activeEvents.filter(r => r.key === key).forEach(removeActive);
      S().flags['events.lastKey'] = key;
      try { return startEvent(def); } catch (e) { console.error('[events] trigger', key, e); return null; }
    },
    choose,
    describeMods,
    timeLeft
  };
})();

  const G = window.G;
  const U = G.util;

  const SLOTS = 6;
  const FULFILL_COOLDOWN = 20000;
  const DISCARD_COOLDOWN = 30000;
  const EXPRESS_CHANCE = 0.2;
  const MARKET_MIN = 0.8, MARKET_MAX = 1.25;
  const PREV_KEY = 'economy.prevMarket';
  const CHANGE_THROTTLE = 3000;

  const CUSTOMERS = [
    { name: 'Spokane Farmers Market', emoji: '🧺', region: 'spokane' },
    { name: 'Walla Walla Winery', emoji: '🍷', region: 'walla_walla' },
    { name: 'Yakima Brewing Co.', emoji: '🍺', region: 'yakima' },
    { name: 'Moscow Food Co-op', emoji: '🥬', region: 'palouse' },
    { name: 'Ellensburg Rodeo Grounds', emoji: '🤠', region: 'ellensburg' },
    { name: 'Tri-Cities Taqueria', emoji: '🌮', region: 'tri_cities' },
    { name: 'Wenatchee Packing House', emoji: '📦', region: 'wenatchee' },
    { name: 'Grandma June in Colfax', emoji: '👵', region: 'palouse' },
    { name: 'Pullman Cougar Diner', emoji: '🐾', region: 'palouse' },
    { name: 'Moses Lake Fish & Chips', emoji: '🍟', region: 'columbia_basin' },
    { name: 'Ritzville Grain Elevator', emoji: '🏭', region: 'columbia_basin' },
    { name: 'Leavenworth Bavarian Bakery', emoji: '🥨', region: 'wenatchee' },
    { name: 'Prosser Wine Bar', emoji: '🍇', region: 'yakima' },
    { name: 'Cle Elum Trailside Cafe', emoji: '☕', region: 'ellensburg' },
    { name: 'Kennewick Hanford Hotdogs', emoji: '🌭', region: 'tri_cities' },
    { name: 'Spokane Gonzaga Boosters', emoji: '🏀', region: 'spokane' },
    { name: 'Dayton Depot Deli', emoji: '🥪', region: 'walla_walla' },
    { name: 'Chelan Lakeside Lodge', emoji: '🏞️', region: 'wenatchee' }
  ];

  const D = () => (G.DATA || {});
  const dict = k => (D()[k] && typeof D()[k] === 'object') ? D()[k] : {};
  const now = () => U.now();
  const st = () => G.state;

  // ---------- helpers ----------
  function baseValue(key) {
    const info = (G.itemInfo ? G.itemInfo(key) : null) || {};
    return Math.max(1, Number(info.sellPrice) || 1);
  }
  function itemLabel(key) {
    const i = (G.itemInfo ? G.itemInfo(key) : null) || {};
    return ((i.emoji || '') + ' ' + (i.name || key)).trim();
  }

  // Everything the player could currently produce (key -> true).
  function producibleKeys() {
    const s = st(), lvl = s.level || 1, out = new Set();
    const crops = dict('crops'), animals = dict('animals'), buildings = dict('buildings');
    Object.keys(crops).forEach(k => { if (lvl >= (crops[k].level || 1)) out.add(k); });
    (s.animals || []).forEach(an => {
      const a = animals[an && an.type];
      if (a && a.product && lvl >= (a.level || 1)) out.add(a.product);
    });
    (s.buildings || []).forEach(b => {
      const def = buildings[b && b.type];
      if (!def || !Array.isArray(def.recipes)) return;
      def.recipes.forEach(r => { if (r && r.output && lvl >= (r.level || 1)) out.add(r.output); });
    });
    return Array.from(out);
  }
  function signature() { return producibleKeys().sort().join('|'); }

  // ---------- orders ----------
  function emptySlot(id, cooldownUntil) {
    return {
      id: id || U.uid(), customer: '', customerEmoji: '', region: '', items: {},
      coins: 0, xp: 0, createdAt: now(), expiresAt: null, cooldownUntil: cooldownUntil == null ? null : cooldownUntil
    };
  }
  function isEmptySlot(o) { return !o || !o.items || Object.keys(o.items).length === 0; }

  function pickCustomer(items) {
    const crops = dict('crops');
    const regions = {};
    Object.keys(items).forEach(k => { const r = crops[k] && crops[k].region; if (r) regions[r] = true; });
    const taken = new Set((st().orders || []).map(o => o && o.customer));
    const c = U.weightedPick(CUSTOMERS, cu => (regions[cu.region] ? 4 : 1) * (taken.has(cu.name) ? 0.25 : 1));
    return c || CUSTOMERS[0];
  }

  function buildOrder(existing) {
    const pool = producibleKeys();
    if (!pool.length) return null;
    const lvl = st().level || 1;
    // keys already requested by other open orders -> de-emphasise to add variety
    const used = {};
    (existing || []).forEach(o => { if (o && o.items) Object.keys(o.items).forEach(k => { used[k] = (used[k] || 0) + 1; }); });

    const want = Math.min(pool.length, U.weightedPick([1, 2, 3], n => (n === 1 ? 3 : n === 2 ? 3 : (lvl >= 3 ? 2 : 0.5))) || 1);
    const chosen = [];
    const left = pool.slice();
    while (chosen.length < want && left.length) {
      const k = U.weightedPick(left, key => 1 / (1 + (used[key] || 0) * 1.5));
      if (!k) break;
      chosen.push(k); left.splice(left.indexOf(k), 1);
    }
    if (!chosen.length) return null;

    const cap = U.clamp(2 + Math.floor(lvl / 2), 2, 10) * (chosen.length > 1 ? 0.75 : 1);
    const items = {};
    let sum = 0;
    chosen.forEach(k => {
      const price = baseValue(k);
      const f = U.clamp(25 / price, 0.3, 1.5);
      const maxQ = Math.max(1, Math.round(cap * f));
      const q = U.randInt(1, maxQ);
      items[k] = q; sum += price * q;
    });

    const express = Math.random() < EXPRESS_CHANCE;
    const mult = U.rand(1.25, 1.6) * (express ? 1.4 : 1);
    const coins = Math.max(1, Math.round(sum * mult));
    const xp = Math.max(1, Math.round(sum * mult * 0.2));
    const cust = pickCustomer(items);
    const t = now();
    return {
      id: U.uid(), customer: cust.name, customerEmoji: cust.emoji, region: cust.region,
      items, coins, xp, createdAt: t,
      expiresAt: express ? t + Math.round(U.rand(180, 300)) * 1000 : null,
      cooldownUntil: null, express
    };
  }

  function ensureOrdersArray() {
    const s = st();
    if (!Array.isArray(s.orders)) s.orders = [];
    s.orders = s.orders.filter(o => o && typeof o === 'object');
    while (s.orders.length < SLOTS) s.orders.push(emptySlot(null, now()));
    if (s.orders.length > SLOTS) s.orders.length = SLOTS;
  }

  // Fill slots that are empty and not cooling down. Returns number generated.
  function fillSlots() {
    ensureOrdersArray();
    const s = st(), t = now();
    let n = 0;
    s.orders.forEach((o, i) => {
      if (!isEmptySlot(o)) return;
      if (o.cooldownUntil && o.cooldownUntil > t) return;
      const neu = buildOrder(s.orders.filter((x, j) => j !== i && !isEmptySlot(x)));
      if (!neu) { o.cooldownUntil = t + 5000; return; } // nothing producible yet; retry shortly
      s.orders[i] = neu; n++;
      G.bus.emit('order:new', { order: neu, slot: i });
    });
    if (n) G.bus.emit('change');
    return n;
  }

  function findIdx(id) { return (st().orders || []).findIndex(o => o && o.id === id); }
  function isExpired(o) { return !!(o && o.expiresAt && now() >= o.expiresAt); }

  function canFulfill(id) {
    const o = (st().orders || []).find(x => x && x.id === id);
    if (!o || isEmptySlot(o) || o.cooldownUntil || isExpired(o)) return false;
    return G.hasItems(o.items);
  }

  function toCooldown(i, ms) {
    const o = st().orders[i];
    st().orders[i] = emptySlot(o && o.id, now() + ms);
  }

  function fulfill(id) {
    const i = findIdx(id);
    if (i < 0 || !canFulfill(id)) return false;
    const o = st().orders[i];
    if (!G.removeItems(o.items)) return false;
    const { coins, xp, customer } = o;
    st().stats.ordersDone = (st().stats.ordersDone || 0) + 1;
    toCooldown(i, FULFILL_COOLDOWN);           // before paying, so levelup refills see correct state
    G.addCoins(coins, 'order');
    G.bus.emit('order:done', { order: o, coins, xp, customer, slot: i });
    G.addXP(xp);
    G.bus.emit('change');
    return true;
  }

  function discard(id) {
    const i = findIdx(id);
    if (i < 0) return false;
    const o = st().orders[i];
    if (isEmptySlot(o) || o.cooldownUntil) return false;
    toCooldown(i, DISCARD_COOLDOWN);
    G.bus.emit('change');
    return true;
  }

  function ordersTick() {
    ensureOrdersArray();
    const t = now(); let changed = false;
    st().orders.forEach((o, i) => {
      if (o.cooldownUntil && t >= o.cooldownUntil) {
        st().orders[i] = emptySlot(o.id, null); changed = true; // ready for refill
      } else if (!o.cooldownUntil && o.expiresAt && t >= o.expiresAt) {
        if (G.toast) G.toast('The ' + (o.customer || 'express') + ' order expired.', 'info');
        st().orders[i] = emptySlot(o.id, null); changed = true;
      }
    });
    if (fillSlots() || changed) G.bus.emit('change');
  }

  // ---------- market ----------
  function marketKeys() { return Object.keys(dict('crops')).concat(Object.keys(dict('products'))); }
  function r3(v) { return Math.round(v * 1000) / 1000; }

  function ensureMarket() {
    const s = st();
    if (!s.market || typeof s.market !== 'object') s.market = {};
    marketKeys().forEach(k => {
      if (typeof s.market[k] !== 'number' || !isFinite(s.market[k])) s.market[k] = r3(U.rand(0.95, 1.05));
    });
    if (!s.flags) s.flags = {};
    if (!s.flags[PREV_KEY]) s.flags[PREV_KEY] = Object.assign({}, s.market);
  }

  function refreshMarket() {
    ensureMarket();
    const s = st();
    s.flags[PREV_KEY] = Object.assign({}, s.market);
    marketKeys().forEach(k => {
      const m = s.market[k];
      const next = m + (1 - m) * 0.2 + U.rand(-0.09, 0.09); // mean-reverting random walk
      s.market[k] = r3(U.clamp(next, MARKET_MIN, MARKET_MAX));
    });
    G.bus.emit('market:update', { market: s.market });
    G.bus.emit('change');
  }

  function trend(key) {
    const s = st();
    const prev = s.flags && s.flags[PREV_KEY];
    const cur = s.market && s.market[key];
    if (!prev || typeof prev[key] !== 'number' || typeof cur !== 'number') return 'flat';
    const d = cur - prev[key];
    return d > 0.015 ? 'up' : d < -0.015 ? 'down' : 'flat';
  }

  // ---------- shop ----------
  function shopCatalog() {
    const s = st(), lvl = s.level || 1, coins = s.coins || 0;
    const byLvl = (a, b) => (a.def.level || 1) - (b.def.level || 1) || (a.def.cost || 0) - (b.def.cost || 0);

    const animals = Object.keys(dict('animals')).map(key => {
      const def = dict('animals')[key];
      const count = (s.animals || []).filter(a => a && a.type === key).length;
      const max = def.max || 6;
      const locked = lvl < (def.level || 1);
      const maxed = count >= max;
      return { key, def, level: def.level || 1, locked, count, max, maxed, affordable: !locked && !maxed && coins >= (def.cost || 0) };
    }).sort(byLvl);

    const buildings = Object.keys(dict('buildings')).map(key => {
      const def = dict('buildings')[key];
      const owned = (s.buildings || []).some(b => b && b.type === key);
      const locked = lvl < (def.level || 1);
      return { key, def, level: def.level || 1, locked, owned, affordable: !locked && !owned && coins >= (def.cost || 0) };
    }).sort(byLvl);

    const owns = k => (s.ownedExpansions || []).includes(k);
    const expansions = Object.keys(dict('expansions')).map(key => {
      const def = dict('expansions')[key];
      const owned = owns(key);
      const reqMissing = !!(def.requires && !owns(def.requires));
      const locked = !owned && (lvl < (def.level || 1) || reqMissing);
      return {
        key, def, level: def.level || 1, locked, owned, requires: def.requires || null, reqMissing,
        affordable: !owned && !locked && coins >= (def.cost || 0)
      };
    }).sort(byLvl);

    const cost = G.plotCost ? G.plotCost() : 0;
    const available = (s.plots || []).length < (s.maxPlots || 0);
    return { animals, buildings, expansions, plot: { cost, available, affordable: available && coins >= cost } };
  }

  // ---------- level rewards ----------
  function unlocksAt(level) {
    const out = { crops: [], animals: [], buildings: [], expansions: [] };
    ['crops', 'animals', 'buildings', 'expansions'].forEach(cat => {
      const d = dict(cat);
      Object.keys(d).forEach(k => { if ((d[k].level || 1) === level) out[cat].push(k); });
    });
    return out;
  }

  function onLevelUp(p) {
    const level = (p && p.level) || st().level;
    const reward = 50 * level;
    G.addCoins(reward, 'levelup');
    const u = unlocksAt(level);
    const names = [];
    const add = (cat, list) => list.forEach(k => { const d = dict(cat)[k]; names.push(((d.emoji || '') + ' ' + (d.name || k)).trim()); });
    add('crops', u.crops); add('animals', u.animals); add('buildings', u.buildings); add('expansions', u.expansions);
    let msg = 'Level ' + level + '! +' + reward + ' coins';
    if (names.length) msg += '. Unlocked: ' + names.join(', ');
    G.toast(msg, 'good');
    fillSlots();
  }

  // ---------- daily ----------
  function onNewDay(cal) {
    refreshMarket();
    const day = (cal && cal.day) || G.calendar().day;
    if (day % 3 === 0) {
      const gift = 15 + 5 * (st().level || 1);
      G.addCoins(gift, 'dividend');
      G.toast('The co-op dividend arrived: +' + gift + ' coins', 'good');
    }
  }

  // ---------- wiring ----------
  let lastChange = 0, lastSig = null;
  function setup() {
    ensureMarket();
    ensureOrdersArray();
    lastSig = signature();
    fillSlots();
  }
  const safe = fn => function (p) { try { fn(p); } catch (e) { console.error('[economy]', e); } };

  G.bus.on('init', safe(setup));
  G.bus.on('state:reset', safe(setup));
  G.bus.on('tick', safe(ordersTick));
  G.bus.on('newday', safe(onNewDay));
  G.bus.on('levelup', safe(onLevelUp));
  G.bus.on('change', safe(() => {
    const t = now();
    if (t - lastChange < CHANGE_THROTTLE) return;
    lastChange = t;
    const sig = signature();
    if (sig !== lastSig) { lastSig = sig; fillSlots(); }
  }));

  G.Economy = {
    orders: () => { try { ensureOrdersArray(); } catch (e) { } return st().orders; },
    fulfill: safe2(fulfill), discard: safe2(discard), canFulfill: safe2(canFulfill),
    refreshMarket: safe2(refreshMarket), shopCatalog,
    trend, unlocksAt, producibleKeys,
    constants: { SLOTS, FULFILL_COOLDOWN, DISCARD_COOLDOWN }
  };
  function safe2(fn) { return function () { try { return fn.apply(null, arguments); } catch (e) { console.error('[economy]', e); return false; } }; }
})();

</script>
<script>/* ---- machines.js ---- */
/* machines.js — Kellyville tractor shed (G.Machines). Buy, equip, fuel and repair tractors that boost yield.
   State: G.state.machines = { owned:[], equipped:null, driving:false, fuel:0..100, condition:{key:0..100}, discount, spike } */
(function () {
  'use strict';
  const G = window.G; if (!G) return;
  const U = G.util || {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const now = () => (U.now ? U.now() : Date.now());
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

  const DEFS = [
    { key: 'rusty72', name: "Rusty '72 Utility Tractor", emoji: '🚜', cost: 300, level: 3, yieldBonus: 0.05, speed: 1.4, radius: 0, seeder: false, fuelPerMin: 3, color: '#b5651d',
      desc: 'Runs on diesel, duct tape and stubbornness.' },
    { key: 'pacer90', name: 'Palouse Pacer 90', emoji: '🚜', cost: 1200, level: 5, yieldBonus: 0.10, speed: 1.6, radius: 0, seeder: false, fuelPerMin: 4, color: '#3f8f4a',
      desc: 'Smooth as a wheat field in a light breeze.' },
    { key: 'rowcrop160', name: 'Columbia Basin Row-Crop 160', emoji: '🚜', cost: 3500, level: 8, yieldBonus: 0.16, speed: 1.8, radius: 1, seeder: false, fuelPerMin: 5, color: '#c0392b',
      desc: 'Straight rows from here to the Columbia, no GPS needed.' },
    { key: 'bigyellow', name: 'Big Yellow Articulated 4WD', emoji: '🚜', cost: 8000, level: 11, yieldBonus: 0.24, speed: 2.0, radius: 1, seeder: true, fuelPerMin: 6, color: '#f2b631',
      desc: 'Bends in the middle so your back does not have to.' },
    { key: 'harvestqueen', name: 'Combine: The Harvest Queen', emoji: '🌾', cost: 15000, level: 14, yieldBonus: 0.32, speed: 2.2, radius: 2, seeder: true, fuelPerMin: 8, color: '#d9533b',
      desc: 'Reigns over every field. Please curtsy when she passes.' },
    { key: 'supercar', name: 'Italian-Inspired Supercar Tractor', emoji: '🏎️', cost: 25000, level: 18, yieldBonus: 0.40, speed: 2.6, radius: 2, seeder: true, fuelPerMin: 9, color: '#e0242b',
      desc: 'Zero to plowed in 2.9 seconds. The cows file complaints.' }
  ];
  const DEF = {}; DEFS.forEach(d => { DEF[d.key] = d; });

  const BASE_FUEL_PRICE = 0.6;   // coins per fuel unit
  const COND_PER_MIN = 1.2;      // condition lost per minute driving
  const LOW_COND = 25;
  let lastT = 0, warnedLow = false;

  // ---------- state ----------
  function ensure() {
    const s = G.state; if (!s) return null;
    let m = s.machines;
    if (!m || typeof m !== 'object') m = s.machines = {};
    if (!Array.isArray(m.owned)) m.owned = [];
    m.owned = m.owned.filter((k, i) => DEF[k] && m.owned.indexOf(k) === i);
    if (!m.condition || typeof m.condition !== 'object') m.condition = {};
    m.owned.forEach(k => { m.condition[k] = clamp(num(m.condition[k], 100), 0, 100); });
    if (typeof m.fuel !== 'number' || !isFinite(m.fuel)) m.fuel = 50;
    m.fuel = clamp(m.fuel, 0, 100);
    if (m.equipped && (!DEF[m.equipped] || m.owned.indexOf(m.equipped) < 0)) m.equipped = null;
    if (!m.equipped) m.equipped = null;
    m.driving = !!m.driving && !!m.equipped;
    if (m.discount && (typeof m.discount !== 'object' || !(m.discount.pct > 0))) m.discount = null;
    if (!m.discount) m.discount = null;
    if (m.spike && (typeof m.spike !== 'object' || !(m.spike.until > 0))) m.spike = null;
    if (!m.spike) m.spike = null;
    return m;
  }
  const M = () => ensure() || { owned: [], equipped: null, driving: false, fuel: 0, condition: {}, discount: null, spike: null };
  const toast = (msg, kind) => { try { G.toast && G.toast(msg, kind); } catch (e) { /* ignore */ } };
  const emit = (n, p) => { try { G.bus.emit(n, p); } catch (e) { /* ignore */ } };
  const fmt = n => { try { return (G.uikit && G.uikit.fmt) ? G.uikit.fmt(n) : String(Math.round(n)); } catch (e) { return String(Math.round(n)); } };
  const esc = s => { try { if (G.uikit && G.uikit.esc) return G.uikit.esc(s); } catch (e) { /* ignore */ } return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); };

  // ---------- derived ----------
  function curDef() { const m = M(); return m.equipped ? DEF[m.equipped] || null : null; }
  function cond(key) { const m = M(); return num(m.condition[key], 0); }
  function isBroken(key) { return cond(key) <= 0; }
  function isWorn(key) { return cond(key) < LOW_COND; }
  function effBonus(def) { if (!def) return 0; return def.yieldBonus * (isWorn(def.key) ? 0.5 : 1); }
  function fuelMult() { const m = M(); return (m.spike && m.spike.until > now()) ? num(m.spike.mult, 1) : 1; }
  function dayFactor() {
    let day = 1; try { day = G.calendar().day; } catch (e) { /* ignore */ }
    const x = Math.sin(day * 12.9898) * 43758.5453;
    return 0.85 + 0.35 * (x - Math.floor(x));
  }
  const fuelUnitPrice = () => BASE_FUEL_PRICE * dayFactor() * fuelMult();
  const refuelCost = () => { const m = M(); return Math.ceil((100 - m.fuel) * fuelUnitPrice() - 1e-9); };
  const repairRate = def => 1 + def.cost * 0.0006;
  const repairCost = key => { const d = DEF[key]; if (!d) return 0; return Math.ceil((100 - cond(key)) * repairRate(d)); };
  function price(key) {
    const d = DEF[key]; if (!d) return 0;
    const m = M(); let c = d.cost;
    if (m.discount && m.discount.pct > 0 && (!m.discount.until || m.discount.until > now())) c = Math.round(c * (1 - m.discount.pct));
    return c;
  }
  function discountActive() { const m = M(); return !!(m.discount && m.discount.pct > 0 && (!m.discount.until || m.discount.until > now())); }

  // ---------- celebration ----------
  function modal(def, title, text) {
    try {
      if (G.showModal) G.showModal({ emoji: def.emoji, title, text, kind: 'good', confetti: true, buttons: [{ label: 'Vroom!', cls: 'btn-gold' }] });
      else toast(title, 'good');
    } catch (e) { /* ignore */ }
  }

  // ---------- actions ----------
  function equip(key, quiet) {
    const m = ensure(); const d = DEF[key]; if (!m || !d) return false;
    if (m.owned.indexOf(key) < 0) { toast('You do not own the ' + d.name, 'bad'); return false; }
    if (m.equipped === key) return true;
    if (m.driving) setDriving(false);
    m.equipped = key; warnedLow = false;
    emit('machine:equip', { key, def: d });
    emit('change');
    if (!quiet) modal(d, d.name + ' equipped!', 'Now +' + Math.round(d.yieldBonus * 100) + '% harvest yield. ' + d.desc);
    return true;
  }
  function buy(key) {
    const m = ensure(); const d = DEF[key]; if (!m || !d) return false;
    if (m.owned.indexOf(key) >= 0) { toast('You already own the ' + d.name, 'bad'); return false; }
    if ((G.state.level || 1) < d.level) { toast(d.name + ' unlocks at level ' + d.level, 'bad'); return false; }
    const c = price(key);
    if (!G.spend(c)) return false;
    if (m.discount) m.discount = null;
    m.owned.push(key); m.condition[key] = key === 'rusty72' ? 70 : 100;
    const first = !m.equipped;
    emit('machine:bought', { key, def: d, cost: c });
    try { G.addXP(Math.max(10, Math.round(d.cost / 60))); } catch (e) { /* ignore */ }
    if (first) { equip(key, true); }
    modal(d, 'New ride: ' + d.name + '!', d.desc + ' +' + Math.round(d.yieldBonus * 100) + '% yield' + (first ? ' and it is already parked at your barn.' : '. Equip it from the shed.'));
    emit('change');
    return true;
  }
  function setDriving(on) {
    const m = ensure(); if (!m) return false;
    on = !!on;
    if (!on) {
      if (m.driving) { m.driving = false; const k = m.equipped; emit('drive:stop', { key: k }); emit('change'); }
      return true;
    }
    const d = curDef();
    if (!d) { toast('Buy and equip a tractor first', 'bad'); return false; }
    if (m.fuel <= 0.01) { toast('The tank is bone dry. Refuel at the shed!', 'bad'); return false; }
    if (isBroken(d.key)) { toast('The ' + d.name + ' is broken down. Repair it first!', 'bad'); return false; }
    if (m.driving) return true;
    m.driving = true; lastT = now();
    emit('drive:start', { key: d.key, def: d });
    emit('change');
    return true;
  }
  function refuel() {
    const m = ensure(); if (!m) return false;
    if (m.fuel >= 99.5) { toast('Tank is already full', 'info'); return false; }
    const c = refuelCost();
    if (c > 0 && !G.spend(c)) return false;
    m.fuel = 100; toast('⛽ Tank topped off for ' + c + ' coins', 'good'); emit('change');
    return true;
  }
  function repair() {
    const m = ensure(); const d = curDef(); if (!m || !d) { toast('No tractor equipped', 'bad'); return false; }
    if (cond(d.key) >= 99.5) { toast('Already in mint shape', 'info'); return false; }
    const c = repairCost(d.key);
    if (c > 0 && !G.spend(c)) return false;
    m.condition[d.key] = 100; warnedLow = false; toast('🔧 ' + d.name + ' is good as new (' + c + ' coins)', 'good'); emit('change');
    return true;
  }

  // ---------- tick: fuel + wear ----------
  function onTick(p) {
    const m = ensure(); if (!m) return;
    const t = (p && p.now) || now();
    const dt = lastT ? clamp(t - lastT, 0, 5000) : 0; lastT = t;
    if (m.discount && m.discount.until && m.discount.until <= t) { m.discount = null; }
    if (m.spike && m.spike.until <= t) { m.spike = null; }
    if (!m.driving) return;
    const d = curDef();
    if (!d) { m.driving = false; emit('drive:stop', {}); return; }
    const min = dt / 60000;
    m.fuel = clamp(m.fuel - num(d.fuelPerMin, 5) * min, 0, 100);
    m.condition[d.key] = clamp(cond(d.key) - COND_PER_MIN * min, 0, 100);
    if (!warnedLow && isWorn(d.key) && !isBroken(d.key)) { warnedLow = true; toast('🔧 ' + d.name + ' is worn out: yield bonus halved. Time for repairs.', 'bad'); }
    if (m.fuel <= 0) { m.driving = false; toast('⛽ Out of diesel! The tractor coughs to a stop.', 'bad'); emit('drive:stop', { key: d.key, reason: 'fuel' }); }
    else if (isBroken(d.key)) { m.driving = false; toast('💥 The ' + d.name + ' broke down!', 'bad'); emit('drive:stop', { key: d.key, reason: 'broken' }); }
    emit('change');
  }

  // ---------- public API ----------
  G.Machines = {
    list: () => DEFS,
    owned: () => M().owned.slice(),
    equipped: () => curDef(),
    equip: k => { try { return equip(k); } catch (e) { console.error('[machines] equip', e); return false; } },
    buy: k => { try { return buy(k); } catch (e) { console.error('[machines] buy', e); return false; } },
    isDriving: () => !!M().driving,
    setDriving: on => { try { return setDriving(on); } catch (e) { console.error('[machines] drive', e); return false; } },
    yieldBonus: () => { try { return effBonus(curDef()); } catch (e) { return 0; } },
    refuel: () => { try { return refuel(); } catch (e) { console.error(e); return false; } },
    repair: () => { try { return repair(); } catch (e) { console.error(e); return false; } },
    fuel: () => M().fuel,
    condition: k => cond(k || M().equipped),
    fuelPrice: fuelUnitPrice,
    refuelCost, repairCost, price, ensure
  };

  G.addModHook('yield', () => { try { return 1 + effBonus(curDef()); } catch (e) { return 1; } });
  G.bus.on('init', () => { try { ensure(); lastT = now(); } catch (e) { console.error(e); } });
  G.bus.on('state:reset', () => { try { ensure(); lastT = now(); warnedLow = false; } catch (e) { console.error(e); } });
  G.bus.on('tick', p => { try { onTick(p); } catch (e) { console.error('[machines] tick', e); } });

  // ---------- panel ----------
  const bar = (pct, cls) => `<div class="mc-bar ${cls || ''}"><i style="width:${clamp(pct, 0, 100).toFixed(1)}%"></i></div>`;
  function stat(label, val, pct, cls) {
    return `<div class="mc-stat"><span class="mc-sl">${label}</span>${bar(pct, cls)}<b class="mc-sv">${val}</b></div>`;
  }
  function hero() {
    const m = M(), d = curDef();
    if (!d) {
      return `<div class="mc-hero mc-empty"><div class="mc-big">🚜</div><h4>Your barn is tractor-less</h4>
        <p>Pick a ride from the showroom below. Even a rusty one boosts every harvest.</p></div>`;
    }
    const worn = isWorn(d.key), broken = isBroken(d.key), c = cond(d.key), eb = effBonus(d);
    const fuelCls = m.fuel < 15 ? 'low' : m.fuel < 35 ? 'mid' : '';
    const condCls = broken || c < LOW_COND ? 'low' : c < 55 ? 'mid' : '';
    const full = m.fuel >= 99.5, rc = refuelCost(), pc = repairCost(d.key), perfect = c >= 99.5;
    const rcb = full ? `<button class="btn btn-gray sm off" data-act="pact" data-pa="refuel" aria-disabled="true" data-why="Tank is already full">⛽ Full</button>`
      : `<button class="btn btn-gold sm ${G.state.coins < rc ? 'off' : ''}" data-act="pact" data-pa="refuel" ${G.state.coins < rc ? `aria-disabled="true" data-why="Need ${rc} coins for diesel"` : ''}>⛽ Refuel 🪙${rc}</button>`;
    const rpb = perfect ? `<button class="btn btn-gray sm off" data-act="pact" data-pa="repair" aria-disabled="true" data-why="Already in mint shape">🔧 Mint</button>`
      : `<button class="btn btn-blue sm ${G.state.coins < pc ? 'off' : ''}" data-act="pact" data-pa="repair" ${G.state.coins < pc ? `aria-disabled="true" data-why="Need ${pc} coins for repairs"` : ''}>🔧 Repair 🪙${pc}</button>`;
    const blocked = (m.fuel <= 0.01 || broken) && !m.driving;
    const why = broken ? 'Repair the tractor first' : 'Refuel the tractor first';
    const drive = m.driving
      ? `<button class="btn btn-red mc-drive" data-act="pact" data-pa="walk">🚶 Park it: walk</button>`
      : `<button class="btn btn-green mc-drive ${blocked ? 'off' : ''}" data-act="pact" data-pa="drive" ${blocked ? `aria-disabled="true" data-why="${why}"` : ''}>🚜 Drive!</button>`;
    return `<div class="mc-hero ${m.driving ? 'driving' : ''}" style="--mc:${esc(d.color)}">
      <div class="mc-badge">${m.driving ? '🟢 DRIVING' : 'PARKED'}</div>
      <div class="mc-big ${m.driving ? 'rumble' : ''}">${d.emoji}</div>
      <h4>${esc(d.name)}</h4><p class="mc-desc">${esc(d.desc)}</p>
      <div class="mc-stats">
        ${stat('🌾 Yield', '+' + Math.round(eb * 100) + '%' + (worn ? ' ⚠' : ''), eb / 0.4 * 100)}
        ${stat('💨 Speed', '×' + d.speed.toFixed(1), (d.speed - 1) / 1.6 * 100)}
        ${stat('⭕ Reach', d.radius ? d.radius + ' tile' + (d.radius > 1 ? 's' : '') : 'Solo', d.radius / 2 * 100)}
        <div class="mc-stat"><span class="mc-sl">🌱 Seeder</span><span class="mc-chip ${d.seeder ? 'yes' : ''}">${d.seeder ? 'Auto-plants!' : 'None'}</span></div>
      </div>
      <div class="mc-gauges">
        <div class="mc-g"><span>⛽ Fuel <b>${Math.round(m.fuel)}%</b></span>${bar(m.fuel, 'fuel ' + fuelCls)}<small>${d.fuelPerMin}/min when driving</small></div>
        <div class="mc-g"><span>🔧 Condition <b>${Math.round(c)}%</b></span>${bar(c, 'cond ' + condCls)}<small>${broken ? 'BROKEN DOWN' : worn ? 'Worn: bonus halved' : 'Running sweet'}</small></div>
      </div>
      <div class="mc-btns">${rcb}${rpb}</div>${drive}</div>`;
  }
  function showroom() {
    const m = M(), lvl = G.state.level || 1;
    return DEFS.map(d => {
      const own = m.owned.indexOf(d.key) >= 0, eq = m.equipped === d.key, locked = !own && lvl < d.level;
      const c = price(d.key), disc = discountActive() && !own;
      let act;
      if (eq) act = `<div class="mc-state eq">✅ Equipped</div>`;
      else if (own) act = `<button class="btn btn-green sm" data-act="pact" data-pa="equip" data-key="${d.key}">Equip</button>`;
      else if (locked) act = `<div class="lockpill">🔒 Level ${d.level}</div>`;
      else { const poor = G.state.coins < c; act = `<button class="btn btn-gold sm ${poor ? 'off' : ''}" data-act="pact" data-pa="buy" data-key="${d.key}" ${poor ? `aria-disabled="true" data-why="Need ${fmt(c)} coins"` : ''}>Buy ${disc ? `<s>${fmt(d.cost)}</s> ` : ''}🪙${fmt(c)}</button>`; }
      return `<div class="mc-car ${own ? 'own' : ''} ${eq ? 'eq' : ''} ${locked ? 'locked' : ''}" style="--mc:${esc(d.color)}">
        ${disc ? '<div class="mc-sale">SALE</div>' : ''}<div class="mc-ce">${d.emoji}</div><h5>${esc(d.name)}</h5>
        <div class="mc-cs"><span>🌾 +${Math.round(d.yieldBonus * 100)}%</span><span>💨 ×${d.speed.toFixed(1)}</span><span>⭕ ${d.radius || '–'}</span><span>${d.seeder ? '🌱 Seeder' : '·'}</span></div>
        <p>${esc(d.desc)}</p>${act}</div>`;
    }).join('');
  }
  G.panels = G.panels || {};
  G.panels.machines = {
    live: true,
    title: () => '🚜 Tractor Shed',
    sub: () => { const sp = fuelMult() > 1; return 'Diesel today 🪙' + fuelUnitPrice().toFixed(2) + '/unit' + (sp ? ' 📈 price spike!' : ''); },
    render() {
      ensure();
      return `<div class="mc-wrap">${hero()}<div class="sub">🏪 Dealership showroom</div>
        <div class="hscroll mc-show">${showroom()}</div></div>`;
    },
    onAction(a, el) {
      try {
        const k = el && el.dataset && el.dataset.key;
        if (a === 'buy') buy(k); else if (a === 'equip') equip(k);
        else if (a === 'refuel') refuel(); else if (a === 'repair') repair();
        else if (a === 'drive') setDriving(true); else if (a === 'walk') setDriving(false);
      } catch (e) { console.error('[machines] action', e); }
    }
  };

  G.injectCSS('machines', `
.mc-hero{position:relative;border-radius:22px;padding:14px 14px 14px;text-align:center;background:linear-gradient(180deg,#fffdf5,#ffeec2);border:3px solid var(--mc,#e0bd72);box-shadow:var(--card-sh);overflow:hidden}
.mc-hero:before{content:"";position:absolute;inset:0 0 auto 0;height:70px;background:linear-gradient(var(--mc,#e0bd72),transparent);opacity:.28;pointer-events:none}
.mc-hero.driving{box-shadow:var(--card-sh),0 0 0 3px rgba(111,174,58,.45)}
.mc-badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;letter-spacing:.6px;padding:3px 8px;border-radius:99px;background:#f1e6c8;color:var(--ink2)}
.mc-hero.driving .mc-badge{background:#d6f2b8;color:#2e5a14}
.mc-big{font-size:64px;line-height:1.1;filter:drop-shadow(0 5px 3px rgba(60,35,5,.3))}
.mc-big.rumble{animation:mcrum .35s infinite}
@keyframes mcrum{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-2px)}75%{transform:translate(-1px,1px)}}
.mc-hero h4{margin:2px 0 0;font-size:17px;font-weight:900}
.mc-desc{margin:2px 0 8px;font-size:12px;color:var(--ink2);font-style:italic}
.mc-hero.mc-empty p{font-size:13px;color:var(--ink2);margin:4px 0 0}
.mc-stats{display:flex;flex-direction:column;gap:5px;text-align:left}
.mc-stat{display:grid;grid-template-columns:78px 1fr 70px;align-items:center;gap:8px;font-size:12px}
.mc-sl{font-weight:900;color:var(--ink2)}.mc-sv{text-align:right;font-size:12px}
.mc-bar{height:10px;border-radius:6px;background:rgba(90,60,20,.22);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.mc-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(#ffd45e,#f2a91c);transition:width .4s}
.mc-bar.fuel i{background:linear-gradient(#6cbcf0,#3b8fd0)}.mc-bar.cond i{background:linear-gradient(#9be86b,#56b02f)}
.mc-bar.mid i{background:linear-gradient(#ffd45e,#f2a91c)}.mc-bar.low i{background:linear-gradient(#f2705f,#d2402f)}
.mc-chip{grid-column:2/4;justify-self:start;font-size:11px;font-weight:900;padding:3px 9px;border-radius:99px;background:#eadfc4;color:var(--ink2)}
.mc-chip.yes{background:#d6f2b8;color:#2e5a14}
.mc-gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;text-align:left}
.mc-g span{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:3px}
.mc-g .mc-bar{height:14px}.mc-g small{display:block;font-size:10.5px;color:var(--ink2);margin-top:3px}
.mc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mc-btns .btn{padding:0 6px;font-size:13px}
.mc-drive{width:100%;margin-top:9px}
.mc-show{padding-top:6px}
.mc-car{position:relative;flex:none;width:158px;scroll-snap-align:start;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:center;background:linear-gradient(180deg,#fffdf5,#ffeec2);border:3px solid #e0bd72;box-shadow:var(--card-sh)}
.mc-car.own{border-color:var(--mc,#6fae3a)}.mc-car.eq{box-shadow:var(--card-sh),0 0 0 3px rgba(111,174,58,.45)}
.mc-car.locked{filter:grayscale(.7);opacity:.8}
.mc-ce{font-size:42px;line-height:1.1}.mc-car h5{margin:0;font-size:12.5px;font-weight:900;min-height:32px;display:flex;align-items:center;justify-content:center}
.mc-cs{display:grid;grid-template-columns:1fr 1fr;gap:2px 4px;font-size:10.5px;font-weight:900;color:var(--ink2)}
.mc-car p{margin:0;font-size:10.5px;color:var(--ink2);font-style:italic;flex:1;font-weight:700}
.mc-car .btn,.mc-car .lockpill,.mc-state{width:100%;padding:0 4px}
.mc-state{min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#2e5a14;background:#d6f2b8;border-radius:14px}
.mc-sale{position:absolute;top:-6px;right:-6px;background:var(--red,#d9533b);color:#fff;font-size:10px;font-weight:900;padding:3px 8px;border-radius:99px;transform:rotate(8deg);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mc-car s{opacity:.6;font-size:11px;margin-right:2px}
`);

  // ---------- events ----------
  function regEvents() {
    if (!G.Events || !G.Events.register) return;
    const owns = () => { const m = ensure(); return !!(m && m.equipped && m.owned.length); };
    G.Events.register({
      key: 'tractor_breakdown', name: 'Tractor Breakdown', emoji: '💥', kind: 'bad', seasons: ['summer', 'fall'], minLevel: 3, weight: 0.9, durationSec: 0,
      desc: 'Mid-harvest, your tractor sputters and dies.',
      requires: owns,
      onStart: () => {
        const m = ensure(), d = curDef(); if (!m || !d) return {};
        m.preBreak = { key: d.key, cond: cond(d.key) };
        m.condition[d.key] = 0;
        if (m.driving) setDriving(false);
        return {};
      },
      text: () => { const d = curDef(); return 'Right in the middle of harvest, your ' + (d ? d.name : 'tractor') + ' coughs black smoke and dies. Call the mobile mechanic, or grab a wrench and wing it?'; },
      choices: [
        {
          label: 'Call the mobile mechanic', cost: c => Math.round(U.clamp ? U.clamp(40 + (c.level || 1) * 12, 50, 260) : 100),
          desc: 'Pricey but guaranteed. Back to 60+% condition.',
          apply: c => {
            const m = ensure(), pb = m && m.preBreak, d = curDef(); if (!m || !d) return 'The mechanic shrugs and leaves.';
            m.condition[d.key] = Math.max(60, pb && pb.key === d.key ? pb.cond : 0); m.preBreak = null;
            try { G.addXP(4); } catch (e) { /* ignore */ }
            return 'The mechanic had it humming in ten minutes. Harvest rolls on.';
          }
        },
        {
          label: 'DIY with duct tape', cost: 0,
          desc: '50% chance you fix it for free, but it will be rougher. A flop delays your crops.',
          apply: c => {
            const m = ensure(), pb = m && m.preBreak, d = curDef(); if (!m || !d) return 'You fiddle with nothing.';
            const prev = pb && pb.key === d.key ? pb.cond : 50; m.preBreak = null;
            if (Math.random() < 0.5) { m.condition[d.key] = Math.max(25, prev - 15); try { G.addXP(8); } catch (e) { /* ignore */ } return 'Duct tape and prayer worked! It runs, but it is rattier than before.'; }
            try { G.affectPlots({ crops: 'all', fraction: 0.5, mode: 'delay', amount: 20 }); } catch (e) { /* ignore */ }
            return 'Wrong wrench, wrong bolt. The tractor stays dead and the harvest slips. Use Repair in the shed.';
          }
        }
      ]
    });
    G.Events.register({
      key: 'tractor_auction', name: "Neighbor's Farm Auction", emoji: '🔨', kind: 'good', seasons: ['spring', 'summer', 'fall', 'winter'], minLevel: 3, weight: 0.8, durationSec: 0,
      desc: 'A retiring neighbor is selling equipment cheap.',
      requires: () => { const m = ensure(); return !!m && !discountActive() && DEFS.some(d => m.owned.indexOf(d.key) < 0); },
      text: () => 'Old Gus down the road is retiring and auctioning his equipment. Bidders are thin. Show up and you could land a tractor at a bargain.',
      choices: [
        {
          label: 'Go bid on a tractor', cost: 40,
          desc: 'Pay a 40 coin bidder fee for 35% off your next tractor (10 minutes).',
          apply: c => { const m = ensure(); if (m) m.discount = { pct: 0.35, until: now() + 600000 }; return 'Paddle up! You won a 35% off voucher on your next tractor for 10 minutes.'; }
        },
        { label: 'Stay home', cost: 0, desc: 'Skip the auction.', apply: c => 'You stayed home. Gus sold the lot to a guy from Spokane.' }
      ]
    });
    G.Events.register({
      key: 'diesel_spike', name: 'Diesel Price Spike', emoji: '⛽', kind: 'bad', seasons: ['spring', 'summer', 'fall', 'winter'], minLevel: 3, weight: 0.8, durationSec: 180,
      desc: 'Pump prices jump across the Basin.',
      requires: () => { const m = ensure(); return !!m && m.owned.length > 0; },
      mods: {},
      onStart: c => {
        const m = ensure(); if (!m) return {};
        m.spike = { mult: Math.round((1.5 + Math.random() * 0.7) * 100) / 100, until: now() + 180000 };
        return {};
      },
      text: () => { const m = ensure(); return 'Diesel jumped to ' + (m && m.spike ? 'x' + m.spike.mult : 'sky-high') + ' normal at the Tri-Cities pumps. Refuel costs more for the next three minutes.'; }
    });
  }
  try { regEvents(); } catch (e) { console.error('[machines] events', e); }
  try { ensure(); } catch (e) { /* ignore */ }
})();

</script>
<script>/* ---- ranch.js ---- */
/* ranch.js — Kellyville beef-cattle ranch (G.Ranch + panel 'ranch').
   Buy calves at the Ellensburg Livestock Auction, feed them, grow calf -> yearling -> steer,
   breed with a bull, and sell at the auction or the butcher. State lives in G.state.ranch. */
(function () {
  'use strict';
  const G = window.G;
  if (!G) return;
  const U = G.util;

  // ---------- tuning ----------
  const UNLOCK_LEVEL = 4, BULL_LEVEL = 8, BASE_CAP = 4, MAX_BULLS = 2;
  const CALF_MS = 6 * 60000, YEARLING_MS = 10 * 60000;   // fed-time needed per stage
  const FEED_MS = 3 * 60000, BREED_MS = 12 * 60000;
  const BASE_PRICE = 0.22;                                 // coins per lb at market mult 1.0
  const BUTCHER_FEE = 40, BULL_COST = 650;
  const BUTCHER_YIELD = { ground_beef: 6, ribeye: 2, brisket: 2, leather: 1 };
  const MAX_DT = 6 * 3600 * 1000;

  const BREEDS = {
    angus:     { name: 'Angus',      cost: 110, level: 4, growth: 1.0,  price: 1.06, hardy: 1.0, wt: 1.0,  tag: 'Marbled, mellow, +6% auction price' },
    hereford:  { name: 'Hereford',   cost: 100, level: 4, growth: 1.0,  price: 1.0,  hardy: 0.6, wt: 1.0,  tag: 'Tough as sagebrush, hardy health' },
    red_angus: { name: 'Red Angus',  cost: 125, level: 5, growth: 1.12, price: 1.0,  hardy: 1.0, wt: 1.0,  tag: 'Fast grower, matures 12% quicker' },
    simmental: { name: 'Simmental',  cost: 150, level: 6, growth: 0.95, price: 1.0,  hardy: 1.0, wt: 1.12, tag: 'Big framed, +12% heavier' }
  };
  const BREED_ORDER = ['angus', 'hereford', 'red_angus', 'simmental'];

  const UPGRADES = [
    { key: 'fence', name: 'Cross-Fencing', emoji: '🚧', cost: 300, level: 4, cap: 8, happy: 6, desc: 'Rotate pastures. Room for 8 head, calmer cattle.' },
    { key: 'tank', name: 'Stock-Water Tank', emoji: '🪣', cost: 800, level: 7, cap: 12, happy: 6, desc: 'Fresh water in every paddock. Room for 12 head.' },
    { key: 'shed', name: 'Winter Hay Shed', emoji: '🏚️', cost: 1500, level: 10, cap: 16, happy: 8, desc: 'Dry hay all winter: no double feed. Room for 16 head.' }
  ];

  const NAMES = ['Big Red', 'Clover', 'Duke', 'Daisy', 'Biscuit', 'Maple', 'Tank', 'Pepper', 'Ruby', 'Waylon', 'Buttercup', 'Bandit',
    'Peaches', 'Hank', 'Honey', 'Moose', 'Willow', 'Gus', 'Dolly', 'Bruno', 'Sunny', 'Rusty', 'Pickles', 'Mabel', 'Tater', 'Huckleberry',
    'Lucky', 'Nugget', 'Patsy', 'Ranger', 'Bluebell', 'Cinnamon', 'Dusty', 'Marigold', 'Tex', 'Juniper', 'Barley', 'Rosie', 'Sarge', 'Penny'];

  // ---------- products ----------
  function addProducts() {
    if (!G.DATA || !G.DATA.products) return;
    const add = (k, v) => { if (!G.DATA.products[k]) G.DATA.products[k] = v; };
    add('ground_beef', { name: 'Ground Beef', emoji: '🍔', sellPrice: 24, desc: 'Lean grass-and-alfalfa finished grind.' });
    add('ribeye', { name: 'Ribeye Steak', emoji: '🥩', sellPrice: 70, desc: 'Thick, marbled, and made for the cast-iron skillet.' });
    add('brisket', { name: 'Smoked Brisket', emoji: '🍖', sellPrice: 60, desc: 'Low and slow over apple wood.' });
    add('leather', { name: 'Leather', emoji: '👢', sellPrice: 45, desc: 'Tanned hide for boots and saddles.' });
  }
  addProducts();

  // ---------- state ----------
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  function ensure() {
    const s = G.state;
    if (!s) return null;
    if (!s.ranch || typeof s.ranch !== 'object') s.ranch = {};
    const r = s.ranch;
    if (!Array.isArray(r.animals)) r.animals = [];
    r.animals = r.animals.filter(a => a && typeof a === 'object' && a.id);
    r.animals.forEach(a => {
      if (!BREEDS[a.breed]) a.breed = 'angus';
      if (['calf', 'yearling', 'steer', 'cow', 'bull'].indexOf(a.stage) < 0) a.stage = 'calf';
      a.sex = a.sex === 'f' ? 'f' : 'm';
      a.name = a.name || 'Buddy';
      a.prog = num(a.prog, 0); a.weight = num(a.weight, 200);
      a.health = U.clamp(num(a.health, 100), 0, 100);
      a.happy = U.clamp(num(a.happy, 60), 0, 100);
      a.fedUntil = num(a.fedUntil, 0); a.breedProg = num(a.breedProg, 0);
    });
    if (!r.up || typeof r.up !== 'object') r.up = {};
    if (!r.mkt || typeof r.mkt !== 'object') r.mkt = {};
    r.mkt.mult = U.clamp(num(r.mkt.mult, 1), 0.7, 1.4);
    r.mkt.pct = num(r.mkt.pct, 0);
    r.mkt.day = num(r.mkt.day, 0);
    r.lastT = num(r.lastT, 0);
    r.sold = num(r.sold, 0); r.born = num(r.born, 0);
    return r;
  }
  const R = () => ensure() || { animals: [], up: {}, mkt: { mult: 1, pct: 0, day: 0 }, lastT: 0 };
  const now = () => U.now();
  const esc = s => (G.uikit && G.uikit.esc) ? G.uikit.esc(s) : String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => Math.round(n || 0).toLocaleString('en-US');
  const unlocked = () => ((G.state && G.state.level) || 1) >= UNLOCK_LEVEL;
  const cap = () => BASE_CAP + 4 * UPGRADES.filter(u => R().up[u.key]).length;
  const season = () => { try { return G.calendar().season; } catch (e) { return 'spring'; } };
  const winterDouble = () => season() === 'winter' && !R().up.shed;
  const bullCount = () => R().animals.filter(a => a.stage === 'bull').length;
  const isAdult = a => a.stage === 'steer' || a.stage === 'cow' || a.stage === 'bull';

  function pickName(r) {
    const used = {}; r.animals.forEach(a => { used[a.name] = 1; });
    const free = NAMES.filter(n => !used[n]);
    if (free.length) return U.pick(free);
    const base = U.pick(NAMES); let i = 2;
    while (used[base + ' ' + i]) i++;
    return base + ' ' + i;
  }
  function mkAnimal(breed, stage, sex) {
    const r = R(), b = BREEDS[breed] || BREEDS.angus;
    const a = { id: U.uid(), name: pickName(r), breed: BREEDS[breed] ? breed : 'angus', sex: sex || (Math.random() < 0.5 ? 'f' : 'm'),
      stage: stage || 'calf', prog: 0, weight: 150 * b.wt, health: 100, happy: 65, fedUntil: 0, breedProg: 0, born: now() };
    if (a.stage === 'bull') { a.sex = 'm'; a.weight = 1300 * b.wt; }
    return a;
  }

  // ---------- simulation ----------
  function stageNeed(a) { return a.stage === 'calf' ? CALF_MS : a.stage === 'yearling' ? YEARLING_MS : 0; }
  function happyTarget(a, fed, herdN, c) {
    const ups = UPGRADES.filter(u => R().up[u.key]).reduce((s, u) => s + u.happy, 0);
    const crowd = herdN >= c ? 12 : herdN >= c - 1 ? 5 : 0;
    return U.clamp(58 + ups + (fed ? 12 : -22) - crowd - (winterDouble() ? 6 : 0), 5, 100);
  }
  function setWeight(a, b, fed) {
    if (a.stage === 'calf') a.weight = (150 + 300 * (a.prog / CALF_MS)) * b.wt;
    else if (a.stage === 'yearling') a.weight = (450 + 350 * (a.prog / YEARLING_MS)) * b.wt;
    else a.weight = Math.min(1300 * b.wt, Math.max(a.weight, 1000 * b.wt) + fed * 0.0005);
  }
  let lastRun = 0;
  function step(t, force) {
    const r = ensure(); if (!r) return;
    if (!force && t - lastRun < 1000) return;
    lastRun = t;
    if (!r.lastT || r.lastT > t) r.lastT = t;
    let dt = Math.min(t - r.lastT, MAX_DT);
    r.lastT = t;
    marketStep();
    if (dt <= 0 || !r.animals.length) return;
    const from = t - dt, n = r.animals.length, c = cap();
    const hasBull = r.animals.some(a => a.stage === 'bull');
    const births = [];
    r.animals.forEach(a => {
      const b = BREEDS[a.breed] || BREEDS.angus;
      const fed = U.clamp(Math.min(t, a.fedUntil) - from, 0, dt), hungry = dt - fed;
      a.health = U.clamp(a.health - hungry * 0.0001 * b.hardy + fed * 0.0002, 0, 100);
      const gm = b.growth * (0.92 + a.happy / 1250) * (a.health < 30 ? 0.8 : 1);
      a.prog += fed * gm;
      let guard = 0;
      while ((a.stage === 'calf' || a.stage === 'yearling') && a.prog >= stageNeed(a) && guard++ < 4) {
        a.prog -= stageNeed(a);
        if (a.stage === 'calf') a.stage = 'yearling';
        else { a.stage = a.sex === 'f' ? 'cow' : 'steer'; a.prog = 0; G.toast && G.toast('🐄 ' + a.name + ' grew into a ' + (a.sex === 'f' ? 'cow' : 'steer') + '!', 'good'); }
        G.bus.emit('ranch:grew', { animal: a });
      }
      setWeight(a, b, fed);
      const isFed = a.fedUntil > t;
      a.happy += (happyTarget(a, isFed, n, c) - a.happy) * Math.min(1, dt / 60000);
      a.happy = U.clamp(a.happy, 0, 100);
      if (a.stage === 'cow' && hasBull) a.breedProg = Math.min(BREED_MS, a.breedProg + fed);
      if (a.stage === 'cow' && a.breedProg >= BREED_MS) births.push(a);
    });
    births.forEach(mom => {
      if (r.animals.length >= cap()) return;           // pasture full: wait for room
      mom.breedProg = 0;
      const sire = r.animals.filter(a => a.stage === 'bull');
      const breed = Math.random() < 0.5 || !sire.length ? mom.breed : U.pick(sire).breed;
      const calf = mkAnimal(breed, 'calf');
      calf.fedUntil = t + 60000;
      r.animals.push(calf); r.born++;
      G.toast && G.toast('🐮 A new calf! Meet ' + calf.name + ' (' + BREEDS[calf.breed].name + ')', 'good');
      G.bus.emit('ranch:born', { animal: calf, mother: mom.id });
      G.bus.emit('change');
    });
  }

  function marketStep() {
    const r = ensure(); if (!r) return;
    let day = 0; try { day = G.calendar().day; } catch (e) { return; }
    if (!r.mkt.day) { r.mkt.day = day; return; }
    if (day === r.mkt.day) return;
    const steps = Math.min(6, Math.abs(day - r.mkt.day));
    for (let i = 0; i < steps; i++) {
      const delta = (Math.random() - 0.5) * 0.16 - 0.12 * (r.mkt.mult - 1);
      let pct = Math.round(delta * 100);
      pct = U.clamp(pct, -9, 9);
      r.mkt.mult = U.clamp(r.mkt.mult * (1 + pct / 100), 0.7, 1.4);
      r.mkt.pct = pct;
    }
    r.mkt.day = day;
    G.bus.emit('change');
  }
  const marketLine = () => {
    const p = R().mkt.pct;
    return p > 0 ? 'Cattle market is UP ' + p + '% today' : p < 0 ? 'Cattle market is DOWN ' + Math.abs(p) + '% today' : 'Cattle market is steady today';
  };
  const unitPrice = () => BASE_PRICE * R().mkt.mult;
  function auctionPrice(a) {
    const b = BREEDS[a.breed] || BREEDS.angus;
    const kind = a.stage === 'cow' ? 0.7 : a.stage === 'bull' ? 0.8 : 1;
    return Math.max(1, Math.round(a.weight * unitPrice() * b.price * kind * (0.75 + 0.25 * a.health / 100)));
  }

  // ---------- feeding ----------
  function feedPlan() {
    const m = winterDouble() ? 2 : 1;
    if (G.qty('cow_feed') >= m) return { key: 'cow_feed', qty: m };
    if (G.qty('alfalfa') >= 2 * m) return { key: 'alfalfa', qty: 2 * m };
    return { key: null, qty: m };
  }
  function feedOne(a, quiet) {
    const t = now();
    if (a.fedUntil - t > 60000) { if (!quiet) G.toast && G.toast(a.name + ' is full for now', 'info'); return false; }
    const p = feedPlan();
    if (!p.key) { if (!quiet) G.toast && G.toast('Need ' + (winterDouble() ? 'double ' : '') + 'cow feed (or 2 alfalfa per feeding)', 'bad'); return false; }
    if (!G.removeItems({ [p.key]: p.qty })) return false;
    a.fedUntil = Math.max(t, a.fedUntil) + FEED_MS;
    return true;
  }
  function feed(id) {
    const r = ensure(); if (!r) return false;
    step(now(), true);
    const a = r.animals.find(x => x.id === id); if (!a) return false;
    const ok = feedOne(a);
    if (ok) G.bus.emit('change');
    return ok;
  }
  function feedAll() {
    const r = ensure(); if (!r) return 0;
    step(now(), true);
    let n = 0;
    for (const a of r.animals) { if (a.fedUntil - now() > 60000) continue; if (!feedOne(a, true)) break; n++; }
    if (!n) G.toast && G.toast(r.animals.length ? (feedPlan().key ? 'Everyone is already fed' : 'Out of feed! Mill some cow feed or grow alfalfa') : 'No cattle yet', 'info');
    else G.toast && G.toast('Fed ' + n + ' head', 'good');
    G.bus.emit('change');
    return n;
  }

  // ---------- buying ----------
  function buyCalf(breed) {
    const r = ensure(), b = BREEDS[breed];
    if (!r || !b) return false;
    if (!unlocked()) { G.toast && G.toast('Ranching unlocks at level ' + UNLOCK_LEVEL, 'bad'); return false; }
    if (G.state.level < b.level) { G.toast && G.toast(b.name + ' calves unlock at level ' + b.level, 'bad'); return false; }
    if (r.animals.length >= cap()) { G.toast && G.toast('Pasture full (' + cap() + ' head). Upgrade or sell!', 'bad'); return false; }
    if (!G.spend(b.cost)) return false;
    const a = mkAnimal(breed, 'calf'); a.fedUntil = now() + 30000;
    r.animals.push(a);
    G.toast && G.toast('🐮 ' + a.name + ' the ' + b.name + ' calf joined the herd!', 'good');
    G.bus.emit('ranch:bought', { animal: a }); G.bus.emit('change');
    return a;
  }
  function buyBull() {
    const r = ensure(); if (!r) return false;
    if (G.state.level < BULL_LEVEL) { G.toast && G.toast('Bulls unlock at level ' + BULL_LEVEL, 'bad'); return false; }
    if (bullCount() >= MAX_BULLS) { G.toast && G.toast('One or two bulls is plenty', 'bad'); return false; }
    if (r.animals.length >= cap()) { G.toast && G.toast('Pasture full (' + cap() + ' head)', 'bad'); return false; }
    if (!G.spend(BULL_COST)) return false;
    const a = mkAnimal(U.pick(BREED_ORDER), 'bull'); a.fedUntil = now() + 30000;
    r.animals.push(a);
    G.toast && G.toast('🐂 ' + a.name + ' the bull arrived. Breeding can begin!', 'good');
    G.bus.emit('ranch:bought', { animal: a }); G.bus.emit('change');
    return a;
  }
  function buyUpgrade(key) {
    const r = ensure(); if (!r) return false;
    const i = UPGRADES.findIndex(u => u.key === key), u = UPGRADES[i];
    if (!u || r.up[key]) return false;
    if (G.state.level < u.level) { G.toast && G.toast(u.name + ' unlocks at level ' + u.level, 'bad'); return false; }
    if (i > 0 && !r.up[UPGRADES[i - 1].key]) { G.toast && G.toast('Build ' + UPGRADES[i - 1].name + ' first', 'bad'); return false; }
    if (!G.spend(u.cost)) return false;
    r.up[key] = true;
    G.toast && G.toast(u.emoji + ' ' + u.name + ' built! Pasture holds ' + cap() + ' head', 'good');
    G.bus.emit('ranch:upgrade', { key }); G.bus.emit('change');
    return true;
  }

  // ---------- selling ----------
  function remove(a) { const r = R(); const i = r.animals.indexOf(a); if (i >= 0) r.animals.splice(i, 1); }
  function sell(id) {
    const r = ensure(); if (!r) return 0;
    step(now(), true);
    const a = r.animals.find(x => x.id === id);
    if (!a || !isAdult(a)) { G.toast && G.toast('Not grown enough to sell yet', 'bad'); return 0; }
    const coins = auctionPrice(a);
    remove(a); r.sold++;
    G.addCoins(coins, 'ranch');
    G.addXP(a.stage === 'steer' ? 18 + Math.round(a.weight / 60) : 10);
    G.toast && G.toast('🔨 Sold ' + a.name + ' at auction for 🪙' + fmt(coins), 'good');
    G.bus.emit('ranch:sold', { animal: a, via: 'auction', coins }); G.bus.emit('change');
    return coins;
  }
  function butcher(id) {
    const r = ensure(); if (!r) return false;
    step(now(), true);
    const a = r.animals.find(x => x.id === id);
    if (!a || a.stage !== 'steer') { G.toast && G.toast('Only grown steers go to the butcher', 'bad'); return false; }
    const items = Object.values(BUTCHER_YIELD).reduce((x, y) => x + y, 0);
    if (G.barnFree() < items) { G.toast && G.toast('Barn needs ' + items + ' free slots for the beef', 'bad'); return false; }
    if (G.state.coins < BUTCHER_FEE) { G.toast && G.toast('Processing fee is 🪙' + BUTCHER_FEE, 'bad'); return false; }
    if (!G.spend(BUTCHER_FEE)) return false;
    remove(a); r.sold++;
    Object.keys(BUTCHER_YIELD).forEach(k => G.addItem(k, BUTCHER_YIELD[k]));
    G.addXP(35 + Math.round(a.weight / 40));
    G.toast && G.toast('🥩 ' + a.name + ' processed: 6 ground beef, 2 ribeye, 2 brisket, 1 leather', 'good');
    G.bus.emit('ranch:sold', { animal: a, via: 'butcher', coins: 0, items: BUTCHER_YIELD }); G.bus.emit('change');
    return true;
  }

  // ---------- public API ----------
  const EMOJI = { calf: '🐮', yearling: '🐮', steer: '🐂', cow: '🐄', bull: '🐂' };
  const SCALE = { calf: 0.6, yearling: 0.85, steer: 1.15, cow: 1.05, bull: 1.3 };
  G.Ranch = {
    ensure,
    unlocked,
    herd() {
      try {
        const r = ensure(), t = now(); if (!r) return [];
        return r.animals.map(a => ({
          id: a.id, stage: a.stage, emoji: EMOJI[a.stage] || '🐮', name: a.name, breed: a.breed,
          scale: Math.round(U.clamp(SCALE[a.stage] * (a.stage === 'steer' || a.stage === 'cow' ? 0.93 + a.weight / 9000 : 1), 0.6, 1.3) * 100) / 100,
          hungry: a.fedUntil <= t
        }));
      } catch (e) { return []; }
    },
    pastureCap: cap,
    breeds: BREEDS,
    upgrades: UPGRADES,
    buyCalf, buyBull, buyUpgrade, feed, feedAll, sell, butcher,
    price: auctionPrice,
    marketText: marketLine,
    marketMult: () => R().mkt.mult,
    step: t => step(t == null ? now() : t, true),
    animals: () => R().animals,
    add: (breed, stage, sex) => { const r = ensure(); const a = mkAnimal(breed, stage, sex); r.animals.push(a); return a; },
    consts: { CALF_MS, YEARLING_MS, FEED_MS, BREED_MS, BUTCHER_FEE, BULL_COST, BASE_PRICE }
  };

  // ---------- bus ----------
  G.bus.on('init', () => { try { ensure(); const r = R(); r.lastT = now(); lastRun = 0; marketStep(); } catch (e) { console.error('[ranch] init', e); } });
  G.bus.on('state:reset', () => { try { ensure(); lastRun = 0; } catch (e) { console.error('[ranch] reset', e); } });
  G.bus.on('tick', p => { try { step((p && p.now) || now(), false); } catch (e) { console.error('[ranch] tick', e); } });

  // ---------- events ----------
  const herdN = () => { try { return R().animals.length; } catch (e) { return 0; } };
  const evs = [
    {
      key: 'cattle_out', name: 'Cattle Got Out!', emoji: '🚧', kind: 'bad', minLevel: UNLOCK_LEVEL, weight: 1, durationSec: 0,
      desc: 'A gate was left open and the herd is wandering down the county road.',
      requires: () => herdN() > 0,
      text: () => 'Somebody left the gate open! Your cattle are strolling toward the neighbor\'s alfalfa and the highway.',
      choices: [
        {
          label: 'Hire the cattle dog crew', cost: c => Math.round(U.clamp(30 + herdN() * 12, 40, 220)),
          desc: 'The neighbor\'s border collies round everyone up in minutes.',
          apply: c => { c.G.addXP(4); return 'The dog crew had every head back inside before supper. Good dogs!'; }
        },
        {
          label: 'Round them up yourself', cost: 0,
          desc: 'Free, but a long afternoon on foot leaves the herd rattled (happiness drops).',
          apply: c => {
            const r = R(); r.animals.forEach(a => { a.happy = Math.max(0, a.happy - 25); a.health = Math.max(0, a.health - 3); });
            c.G.bus.emit('change');
            return 'You chased cattle through sagebrush until dark. Everyone is home, but they are quite stressed.';
          }
        }
      ]
    },
    {
      key: 'pinkeye', name: 'Pinkeye Outbreak', emoji: '👁️', kind: 'bad', seasons: ['spring', 'summer', 'fall'], minLevel: UNLOCK_LEVEL, weight: 0.8, durationSec: 0,
      desc: 'Flies are spreading pinkeye through the pasture.',
      requires: () => herdN() > 0,
      text: () => 'Pinkeye is spreading through the herd: weepy eyes and grumpy cattle. Time to call the vet.',
      choices: [
        {
          label: 'Call the vet', cost: c => Math.round(U.clamp(40 + herdN() * 15, 55, 260)),
          desc: 'Proper treatment. The whole herd is healed up.',
          apply: c => { R().animals.forEach(a => { a.health = Math.min(100, a.health + 15); }); c.G.addXP(6); c.G.bus.emit('change'); return 'The vet treated every head. Clear eyes and happy cattle.'; }
        },
        {
          label: 'Home remedy', cost: 15,
          desc: 'Eye patches and fly spray. Cheap, partly effective.',
          apply: c => { R().animals.forEach(a => { a.health = Math.max(0, a.health - 12); }); c.G.bus.emit('change'); return 'Your patches helped some. Health took a small hit.'; }
        },
        {
          label: 'Wait it out', cost: 0,
          desc: 'Save the money. The herd suffers.',
          apply: c => { R().animals.forEach(a => { a.health = Math.max(0, a.health - 30); a.happy = Math.max(0, a.happy - 10); }); c.G.bus.emit('change'); return 'Pinkeye ran its course. The herd lost a lot of condition.'; }
        }
      ]
    },
    {
      key: 'hay_prices', name: 'Hay Prices Soar', emoji: '📈', kind: 'good', minLevel: 3, weight: 0.9, durationSec: 150,
      desc: 'A dry summer upriver has hay and feed selling at a premium.',
      mods: { price: { products: ['alfalfa', 'cow_feed'], mult: 1.6, label: '🌿 Alfalfa & cow feed' } },
      text: () => 'Hay prices soar! Alfalfa and cow feed sell for far more. Feed note: if you feed cattle, stock up before the hay is gone.'
    },
    {
      key: 'county_fair', name: 'County Fair Grand Champion', emoji: '🏆', kind: 'good', seasons: ['summer', 'fall'], minLevel: UNLOCK_LEVEL, weight: 0.9, durationSec: 0,
      desc: 'Your steer wins the blue ribbon at the Kittitas County Fair.',
      requires: () => R().animals.some(a => a.stage === 'steer'),
      onStart(c) {
        const steers = R().animals.filter(a => a.stage === 'steer').sort((x, y) => y.weight - x.weight);
        const s = steers[0]; if (!s) return {};
        const prize = Math.round(120 + s.weight / 5 + (s.health / 100) * 40);
        s.happy = Math.min(100, s.happy + 15);
        c.G.addCoins(prize, 'ranch'); c.G.addXP(25);
        return { name: s.name, prize };
      },
      text: c => c.result && c.result.name ? c.result.name + ' took Grand Champion Steer at the county fair! The judges handed you 🪙' + c.result.prize + ' and a very large ribbon.' : 'The county fair judges came by, but you had no steer to show.'
    }
  ];
  evs.forEach(d => { try { if (G.Events && G.Events.register) G.Events.register(d); } catch (e) { console.error('[ranch] event', d.key, e); } });
  G.Ranch.eventKeys = evs.map(d => d.key);

  // ---------- panel ----------
  const CSS = `
.rn-head{background:linear-gradient(180deg,#fff8e7,#ffe9b3);border:3px solid #e0bd72;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(110,70,20,.25)}

.rn-note.cold{background:#e3f1fb;color:#2c5f86;border-color:#9cc9e8}
.rn-bar{display:flex;gap:6px;margin:10px 0 2px}.rn-bar .btn{flex:1}
.rn-card{margin-top:10px;background:linear-gradient(180deg,#fffaf0,#fff0cc);border:3px solid #e0bd72;border-radius:18px;padding:10px;box-shadow:0 4px 0 rgba(110,70,20,.22)}
.rn-card.hungry{border-color:#e8a24a}.rn-card.ready{border-color:#6cbc43;box-shadow:0 4px 0 rgba(62,130,35,.35)}
.rn-top{display:flex;gap:10px;align-items:center}
.rn-em{flex:none;width:62px;height:62px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#fffdf2,#f3dca0);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(110,70,20,.18);line-height:1}
.rn-em span{display:block;font-size:40px}
.rn-info{min-width:0;flex:1}
