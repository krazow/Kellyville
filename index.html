    } else return false;
    bump(); return true;
  }
  function startReno() {
    const r = R_(); if (!r || r.stage !== 'permit' || r.permit.step !== 'approved') return false;
    if (!G.spend(BUILD_COST)) return false;
    const t = nowMs();
    r.stage = 'building'; r.permit.step = 'built'; r.permit.buildStart = t; r.permit.buildEnd = t + BUILD_MS;
    modal({ emoji: '🔨', title: 'Barn conversion underway',
      html: bubble('darlene', 'Inspection passed. Barely. The septic guy said "huh" twice, which is the best review he has ever given.') +
        bubble('you', 'Time to swap the lambing pens for a pass, a stove, and a very small chalkboard.'),
      buttons: [{ label: 'Grab a hammer', cls: 'btn-gold' }] });
    bump(); return true;
  }
  function grandOpening() {
    const r = R_(); if (!r) return;
    r.stage = 'open'; r.permit.step = 'built'; r.tab = tab = 'menu';
    modal({ emoji: '🎉', title: 'Grand Opening!', kind: 'good', confetti: true,
      html: bubble('darlene', 'By the power vested in me by Whitman County, I declare this barn... a restaurant. Please validate my parking.') +
        bubble('clip', 'I will be reviewing the lentil burger. Strictly for... compliance.'),
      buttons: [{ label: 'Open the barn doors', cls: 'btn-gold', onClick: () => { try { G.openPanel('restaurant'); } catch (e) { /* ignore */ } } }] });
    say('🍽️ The Lambing Barn is open for business!', 'good');
    bump();
  }

  // ---------- kitchen ----------
  function missing(d) { return Object.entries(d.inputs).filter(([k, q]) => !known(k) || G.qty(k) < q).map(([k]) => k); }
  function cookBlock(d) {
    const r = R_();
    if (!r || r.stage !== 'open') return 'The restaurant is not open yet';
    if ((G.state.level || 1) < d.level) return d.name + ' unlocks at level ' + d.level;
    if (r.queue.length >= stoves()) return 'All stoves are busy';
    const pend = r.queue.filter(j => j.id === d.id).length;
    if ((r.pass[d.id] || 0) + pend * PORTIONS >= passCap()) return 'The pass is full of ' + d.name;
    if (missing(d).length) return 'Need ingredients: ' + missing(d).map(k => itemInfo(k).name).join(', ');
    return '';
  }
  function cook(id) {
    const r = R_(), d = dishOf(id); if (!r || !d) return false;
    const why = cookBlock(d); if (why) { say(why, 'bad'); return false; }
    if (!G.removeItems(d.inputs)) return false;
    const t = nowMs(), sec = d.cookSec * (r.staff.cook ? 0.7 : 1);
    r.queue.push({ id, startAt: t, readyAt: t + sec * 1000 });
    bump(); return true;
  }
  function cancelCook(i) {
    const r = R_(); const j = r && r.queue[i]; if (!j) return false;
    const d = dishOf(j.id); r.queue.splice(i, 1);
    if (d) Object.entries(d.inputs).forEach(([k, q]) => { try { G.addItem(k, q); } catch (e) { /* ignore */ } });
    bump(); return true;
  }
  function collectCooked(t) {
    const r = R_(); if (!r || !r.queue.length) return;
    let changed = false;
    for (let i = r.queue.length - 1; i >= 0; i--) {
      const j = r.queue[i]; if (j.readyAt > t) continue;
      r.queue.splice(i, 1); const d = dishOf(j.id); if (!d) continue;
      r.pass[d.id] = Math.min(passCap(), (r.pass[d.id] || 0) + PORTIONS);
      try { G.addXP(d.xp); } catch (e) { /* ignore */ }
      say(d.emoji + ' ' + d.name + ' is ready on the pass (×' + PORTIONS + ')', 'good');
      changed = true;
    }
    if (changed) bump();
  }

  // ---------- menu ----------
  function toggleMenu(id) {
    const r = R_(), d = dishOf(id); if (!r || !d) return false;
    const i = r.menu.indexOf(id);
    if (i >= 0) {
      if (r.service) { say('Menu is locked while service is running', 'bad'); return false; }
      r.menu.splice(i, 1); bump(); return true;
    }
    if (r.service) { say('Menu is locked while service is running', 'bad'); return false; }
    if ((G.state.level || 1) < d.level) { say(d.name + ' unlocks at level ' + d.level, 'bad'); return false; }
    if (r.farmOnly && farmCount(d) < 1) { say('Farm rule: every dish needs one of your own products', 'bad'); return false; }
    if (r.menu.length >= menuCap()) { say('Menu is full (' + menuCap() + '). Upgrade the chalkboard for more.', 'bad'); return false; }
    r.menu.push(id); bump(); return true;
  }

  // ---------- upgrades & staff ----------
  function buyUpgrade(k) {
    const r = R_(), u = UPGRADES[k]; if (!r || !u || r.stage !== 'open') return false;
    const n = r.up[k];
    if (n >= u.max) { say('Already maxed out', 'bad'); return false; }
    if ((G.state.level || 1) < u.level) { say(u.name + ' unlocks at level ' + u.level, 'bad'); return false; }
    if (!G.spend(u.cost(n))) return false;
    r.up[k] = n + 1; say(u.emoji + ' ' + u.name + ' installed!', 'good'); bump(); return true;
  }
  function toggleStaff(k) {
    const r = R_(); if (!r || !STAFF[k] || r.stage !== 'open') return false;
    if (r.service) { say('Staff changes after service', 'bad'); return false; }
    r.staff[k] = !r.staff[k]; say(STAFF[k].emoji + ' ' + STAFF[k].name + (r.staff[k] ? ' hired' : ' let go'), 'info'); bump(); return true;
  }
  const wageTotal = () => { const r = R_(); return r ? Object.keys(STAFF).reduce((s, k) => s + (r.staff[k] ? WAGES[k] : 0), 0) : 0; };

  // ---------- service ----------
  const GUESTS = ['🧑', '👩', '👨', '🧓', '👵', '👴', '🧔', '👱‍♀️', '👩‍🦰', '🧑‍🦱', '👩‍🦳', '🤠'];
  const mult = () => {
    const r = R_();
    let m = (0.7 + 0.18 * r.rating) * (1 + 0.25 * (r.staff.host ? 1 : 0)) * (1 + 0.12 * r.up.parking) * (1 + 0.1 * r.up.lights);
    if (featureActive()) m *= 1.4;
    if (r.noiseUntil > nowMs()) m *= 0.85;
    return m;
  };
  const gap = () => 9500 / Math.max(0.3, mult()) * rnd(0.6, 1.4);
  function startService() {
    const r = R_();
    if (!r || r.stage !== 'open') return false;
    if (r.service) return false;
    const t = nowMs();
    if (r.cooldownUntil > t) { say('The kitchen is resting for ' + fmtT((r.cooldownUntil - t) / 1000), 'bad'); return false; }
    if (!r.menu.length) { say('Put a dish on tonight\'s menu first', 'bad'); return false; }
    if (!r.menu.some(id => (r.pass[id] || 0) > 0)) { say('Prep some dishes onto the pass first', 'bad'); return false; }
    r.service = { startAt: t, endAt: t + SERVICE_MS, nextArrival: t + 1500, guests: [], nextId: 1, covers: 0, revenue: 0, tips: 0, unhappy: 0, away: 0, orders: {}, ratingStart: r.rating };
    say('🔔 Dinner service is open!', 'good'); bump(); return true;
  }
  function pickDish(r) {
    const stocked = r.menu.filter(id => (r.pass[id] || 0) > 0);
    if (stocked.length && Math.random() < 0.75) return U.pick ? U.pick(stocked) : stocked[0];
    return r.menu[Math.floor(Math.random() * r.menu.length)];
  }
  function occupied(sv) {
    const o = {}; sv.guests.forEach(g => { if (g.phase !== 'leaving' && g.table != null) o[g.table] = true; }); return o;
  }
  function spawn(r, sv, at) {
    const occ = occupied(sv), n = tablesCount(); let table = -1;
    const free = []; for (let i = 0; i < n; i++) if (!occ[i]) free.push(i);
    if (!free.length) { sv.away++; return; }
    table = free[Math.floor(Math.random() * free.length)];
    sv.guests.push({ id: sv.nextId++, emoji: GUESTS[Math.floor(Math.random() * GUESTS.length)], phase: 'arriving', pStart: at, pEnd: at + 3000, table, dish: null, serve: false, mood: 'meh' });
  }
  function advance(r, sv, g) {
    const srv = r.staff.server;
    if (g.phase === 'arriving') {
      g.phase = 'seated'; g.pStart = g.pEnd; g.pEnd = g.pStart + rnd(4000, 7000) * (srv ? 0.6 : 1);
      g.dish = pickDish(r);
      if (g.dish && (r.pass[g.dish] || 0) > 0) { r.pass[g.dish]--; if (r.pass[g.dish] <= 0) delete r.pass[g.dish]; g.serve = true; }
    } else if (g.phase === 'seated') {
      g.pStart = g.pEnd;
      if (g.serve) { g.phase = 'eating'; g.pEnd = g.pStart + rnd(10000, 16000) * (srv ? 0.85 : 1); g.mood = 'happy'; }
      else {
        g.phase = 'leaving'; g.pEnd = g.pStart + 2500; g.mood = 'sad'; sv.unhappy++; g.sad = true;
        const dn = dishOf(g.dish);
        addRating(-0.07); say('😞 A guest left: no ' + (dn ? dn.name : 'dinner') + ' on the pass!', 'bad');
      }
    } else if (g.phase === 'eating') {
      g.phase = 'leaving'; g.pStart = g.pEnd; g.pEnd = g.pStart + 2500;
      const d = dishOf(g.dish); if (d) {
        const price = dishPrice(d);
        const tip = Math.round(price * rnd(0.05, 0.2) * (srv ? 1.5 : 1) * (1 + 0.1 * r.up.lights) * (0.8 + 0.1 * r.rating));
        const total = price + tip;
        try { G.addCoins(total, 'restaurant'); } catch (e) { /* ignore */ }
        try { G.addXP(Math.max(1, Math.round(price / 60))); } catch (e) { /* ignore */ }
        sv.covers++; sv.revenue += price; sv.tips += tip; sv.orders[d.id] = (sv.orders[d.id] || 0) + 1;
        r.stats.covers++; r.stats.revenue += price; r.stats.tips += tip;
        addRating(r.farmOnly ? 0.015 : 0.01); g.paid = total;
        try { G.bus.emit('restaurant:served', { dish: d.id, coins: price, tip, total }); } catch (e) { /* ignore */ }
      }
    } else if (g.phase === 'leaving') { g.done = true; }
  }
  function step(t) {
    const r = R_(); if (!r) return;
    t = t == null ? nowMs() : t;
    try {
      if (r.stage === 'permit' && r.permit.step === 'inspection' && t >= r.permit.inspectEnd) {
        r.permit.step = 'approved'; say('⚖️ Darlene: "You passed. The septic guy is crying. Happy tears."', 'good'); bump();
      }
      if (r.stage === 'building' && t >= r.permit.buildEnd) grandOpening();
      if (r.stage !== 'open') return;
      if (r.queue.length) collectCooked(t);
      const sv = r.service; if (!sv) return;
      let guard = 0;
      while (sv.nextArrival <= t && sv.nextArrival < sv.endAt - 12000 && guard++ < 40) { spawn(r, sv, sv.nextArrival); sv.nextArrival += gap(); }
      sv.guests.forEach(g => { let n = 0; while (!g.done && g.pEnd <= t && n++ < 6) advance(r, sv, g); });
      sv.guests = sv.guests.filter(g => !g.done);
      if (t >= sv.endAt && (!sv.guests.length || t > sv.endAt + 60000)) finishService(t);
    } catch (e) { console.error('[restaurant] step', e); }
  }
  const QUOTES = {
    great: [
      ['The {dish} alone is worth the drive from Spokane. I wept into my napkin.', 'Spokane food critic'],
      ['A barn that cooks like a cathedral. Order everything, then apologize to your diet.', 'Spokane food critic'],
      ['Best meal I have had in Whitman County, and I have eaten at every church potluck.', 'Earl from Rosalia'],
      ['The {dish} was so good I forgot to complain about the parking.', 'Marlene, neighbor with a clipboard']
    ],
    ok: [
      ['Honest food from honest dirt. The {dish} showed promise; the service showed up.', 'Spokane food critic'],
      ['Solid. I would eat here again, perhaps after a nap.', 'Bev from Colfax'],
      ['Charming barn, decent {dish}. Bring a sweater; the lambs left a draft.', 'Dale from Pullman']
    ],
    bad: [
      ['They ran out of things. In a restaurant. I am still processing it.', 'Spokane food critic'],
      ['The barn smells great but my stomach is still waiting.', 'Earl from Rosalia'],
      ['Two stars for effort, one for the goat that greeted us.', 'Bev from Colfax']
    ]
  };
  function finishService(t) {
    const r = R_(), sv = r && r.service; if (!sv) return null;
    const wages = Math.min(wageTotal(), (G.state.coins || 0));
    if (wages > 0) { try { G.addCoins(-wages, 'wages'); } catch (e) { /* ignore */ } }
    if (sv.covers >= 8 && sv.unhappy === 0) addRating(0.05);
    const top = Object.keys(sv.orders).sort((a, b) => sv.orders[b] - sv.orders[a])[0];
    const dn = (top && dishOf(top)) ? dishOf(top).name : 'lentil burger';
    const sat = sv.covers / Math.max(1, sv.covers + sv.unhappy);
    const tone = (sv.covers === 0 || sat < 0.6) ? 'bad' : (sat > 0.9 && r.rating >= 3.6) ? 'great' : 'ok';
    const pool = QUOTES[tone], q = pool[Math.floor(Math.random() * pool.length)];
    const sum = { covers: sv.covers, revenue: sv.revenue, tips: sv.tips, wages, net: sv.revenue + sv.tips - wages, unhappy: sv.unhappy, away: sv.away,
      ratingBefore: sv.ratingStart, ratingAfter: r.rating, ratingChange: r.rating - sv.ratingStart, quote: q[0].replace('{dish}', dn), who: q[1], tone, at: t };
    r.lastSummary = sum; r.service = null; r.cooldownUntil = t + COOLDOWN_MS; r.stats.services++;
    try { G.bus.emit('restaurant:review', { rating: r.rating, change: sum.ratingChange, quote: sum.quote, who: sum.who, summary: sum }); } catch (e) { /* ignore */ }
    showSummary(sum); bump();
    return sum;
  }
  function showSummary(sum) {
    sum = sum || (R_() && R_().lastSummary); if (!sum) return;
    const ch = sum.ratingChange, arrow = ch > 0.004 ? '▲' : ch < -0.004 ? '▼' : '•';
    const html = `<div class="rs-sum"><div><b>🍽️ ${fmt(sum.covers)}</b><small>Covers</small></div><div><b>🪙 ${fmt(sum.revenue)}</b><small>Revenue</small></div><div><b>💵 ${fmt(sum.tips)}</b><small>Tips</small></div><div><b>🧾 −${fmt(sum.wages)}</b><small>Wages</small></div></div>
      <div class="rs-net ${sum.net >= 0 ? 'up' : 'dn'}">Net tonight <b>${sum.net >= 0 ? '+' : '−'}🪙 ${fmt(Math.abs(sum.net))}</b></div>
      <div class="rs-ratechg ${ch >= 0 ? 'up' : 'dn'}">${stars(sum.ratingAfter)} <b>${sum.ratingAfter.toFixed(1)}</b> <span>${arrow} ${Math.abs(ch).toFixed(2)}</span></div>
      ${sum.unhappy ? `<div class="rs-fine">😞 ${sum.unhappy} guest${sum.unhappy === 1 ? '' : 's'} left hungry</div>` : ''}
      <blockquote class="rs-quote">“${esc(sum.quote)}”<cite>— ${esc(sum.who)}</cite></blockquote>`;
    modal({ emoji: sum.tone === 'bad' ? '😬' : sum.tone === 'great' ? '🌟' : '🍽️', title: 'Dinner service complete', html, buttons: [{ label: 'Wipe down the tables', cls: 'btn-gold' }] });
  }

  function customers() {
    const r = R_(), sv = r && r.service; if (!sv) return [];
    const t = nowMs();
    return sv.guests.map(g => ({ id: 'rg' + g.id, emoji: g.emoji, phase: g.phase, t: clamp((t - g.pStart) / Math.max(1, g.pEnd - g.pStart), 0, 1), table: g.table, mood: g.mood, dish: g.dish }));
  }

  // ---------- panel ----------
  let tab = 'service';
  const stars = v => {
    const f = Math.round(clamp(v, 0, 5) * 2) / 2; let s = '';
    for (let i = 1; i <= 5; i++) s += `<i class="${f >= i ? 'on' : f >= i - 0.5 ? 'half' : ''}">★</i>`;
    return `<span class="rs-stars">${s}</span>`;
  };
  function chips(req) {
    return Object.entries(req).map(([k, q]) => {
      const it = itemInfo(k), have = G.qty(k);
      return `<span class="need ${known(k) && have >= q ? 'ok' : 'no'}">${esc(it.emoji)} ${known(k) ? `<b>${have}</b>/${q}` : esc(it.name) + ' ×' + q}</span>`;
    }).join('');
  }
  const btn = (act, label, cls, attrs, why) => `<button class="btn ${cls || 'btn-gold'} ${why ? 'off' : ''}" data-act="pact" data-pa="${act}" ${attrs || ''} ${why ? `aria-disabled="true" data-why="${esc(why)}"` : ''}>${label}</button>`;

  function renderQuest(r) {
    const p = r.permit, t = nowMs();
    const lvlOk = unlocked();
    const idx = r.stage === 'none' ? 0 : r.stage === 'building' ? 3 : p.step === 'hearing' ? 1 : p.step === 'inspection' ? 2 : 3;
    const steps = [
      { e: '📝', t: 'Apply for a conditional-use permit', s: 'Whitman County Planning & Zoning · fee 🪙 ' + PERMIT_FEE },
      { e: '🏛️', t: 'Survive the public hearing', s: p.choice === 'gravel' ? 'You promised a gravel lot.' : p.choice === 'farm' ? 'You pledged: only food grown on this farm.' : 'The neighbors have concerns about traffic.' },
      { e: '🧪', t: 'Septic & fire inspection', s: 'Takes about 3 minutes. The septic guy brought a long stick.' },
      { e: '🔨', t: 'Convert the old lambing barn', s: 'Cost 🪙 ' + BUILD_COST + ' · about 4 minutes of hammering.' },
      { e: '🎉', t: 'Grand opening', s: 'Ribbon, scissors, and one nervous commissioner.' }
    ];
    let quote = '', action = '';
    if (r.stage === 'none') {
      quote = bubble('darlene', 'You want to open a restaurant in a lambing barn? Fill out Form 27-B. In triplicate. The lambs may sign as witnesses.');
      action = lvlOk ? btn('apply', '📝 Apply for permit · 🪙 ' + PERMIT_FEE, 'btn-gold', '', G.state.coins < PERMIT_FEE ? 'You need 🪙 ' + PERMIT_FEE + ' for the fee' : '')
        : `<span class="lockpill">🔒 Level ${UNLOCK_LEVEL}</span>`;
    } else if (r.stage === 'building') {
      quote = bubble('you', 'Lambs out, stove in. The chalkboard says "Today: Whatever Is Good".');
      action = `<div class="mini rs-bar"><i ${tmA('bar', p.buildStart, p.buildEnd)}></i></div><small class="rs-time" ${tmA('txt', 0, p.buildEnd, ' data-pre="🔨 Grand opening in "')}></small>`;
    } else if (p.step === 'hearing') {
      const wait = p.delayUntil > t;
      quote = wait ? bubble('darlene', 'We are adjourned. Take a walk. Maybe a deep breath.') : bubble('clip', 'I would like it noted that I brought a chart. The chart has a LOT of arrows.');
      action = wait ? `<div class="mini rs-bar"><i ${tmA('bar', p.delayUntil - HEARING_DELAY_MS, p.delayUntil)}></i></div><small class="rs-time" ${tmA('txt', 0, p.delayUntil, ' data-pre="⏳ Hearing resumes in "')}></small>`
        : btn('hearing', '🏛️ Attend public hearing', 'btn-gold');
    } else if (p.step === 'inspection') {
      quote = bubble('darlene', 'The inspector is crawling under your barn with a flashlight. Please do not ask what he is looking for.');
      action = `<div class="mini rs-bar"><i ${tmA('bar', p.inspectStart, p.inspectEnd)}></i></div><small class="rs-time" ${tmA('txt', 0, p.inspectEnd, ' data-pre="🧪 Inspection done in "')}></small>`;
    } else {
      quote = bubble('darlene', 'Inspection passed. The septic guy said "huh" twice. That is a rave. Go convert your barn.');
      action = btn('reno', '🔨 Convert the lambing barn · 🪙 ' + BUILD_COST, 'btn-green', '', G.state.coins < BUILD_COST ? 'You need 🪙 ' + BUILD_COST : '');
    }
    const list = steps.map((s, i) => {
      const st = i < idx ? 'done' : i === idx ? 'cur' : 'todo';
      return `<div class="rs-step ${st}"><span class="rs-sd">${st === 'done' ? '✅' : s.e}</span><div><b>${esc(s.t)}</b>${st === 'cur' ? `<small>${esc(s.s)}</small>` : ''}</div></div>`;
    }).join('');
    return `<div class="rs-hero"><div class="rs-hero-e">🏛️</div><div><h4>Whitman County Planning &amp; Zoning</h4><small>Permit #27-B · farm-to-table barn restaurant</small></div></div>
      ${quote}<div class="rs-act">${action}</div><div class="sub">The paperwork trail</div><div class="rs-quest">${list}</div>`;
  }

  function stockStrip(r) {
    const ids = r.menu; if (!ids.length) return '<div class="empty-note">No dishes on tonight\'s menu yet. Open the <b>Menu</b> tab.</div>';
    return `<div class="rs-stock">${ids.map(id => { const d = dishOf(id), n = r.pass[id] || 0; return `<span class="rs-sk ${n ? '' : 'out'}">${esc(d.emoji)} <b>${n}</b></span>`; }).join('')}</div>`;
  }
  function renderService(r) {
    const t = nowMs(), sv = r.service;
    let head;
    if (sv) {
      const closing = t >= sv.endAt;
      head = `<div class="rs-status live"><div class="rs-st-t"><b>${closing ? '🌙 Last orders in!' : '🔔 Dinner service'}</b><small ${closing ? '' : tmA('txt', 0, sv.endAt, ' data-pre="Closes in "')}>${closing ? 'Wrapping up the last tables' : ''}</small></div>
        <div class="mini rs-bar"><i ${tmA('bar', sv.startAt, sv.endAt)}></i></div></div>`;
    } else if (r.cooldownUntil > t) {
      head = `<div class="rs-status"><div class="rs-st-t"><b>😮‍💨 Kitchen resting</b><small ${tmA('txt', 0, r.cooldownUntil, ' data-pre="Ready to open in "')}></small></div>
        <div class="mini rs-bar"><i ${tmA('bar', r.cooldownUntil - COOLDOWN_MS, r.cooldownUntil)}></i></div></div>`;
    } else head = '<div class="rs-status"><div class="rs-st-t"><b>🍽️ Ready for dinner</b><small>About 2½ minutes of service</small></div></div>';
    let openWhy = '';
    if (!r.menu.length) openWhy = 'Put a dish on tonight\'s menu first';
    else if (!r.menu.some(id => (r.pass[id] || 0) > 0)) openWhy = 'Prep some dishes onto the pass first';
    else if (r.cooldownUntil > t) openWhy = 'The kitchen is still resting';
    const openBtn = sv ? '' : btn('open', '🔔 Open for dinner service', 'btn-green', 'style="width:100%"', openWhy);
    const n = tablesCount();
    const byTable = {}; (sv ? sv.guests : []).forEach(g => { if (g.table != null) byTable[g.table] = g; });
    let grid = '';
    for (let i = 0; i < n; i++) {
      const g = byTable[i];
      if (!g) { grid += `<div class="rs-tbl"><div class="rs-seat">🪑</div><small>Table ${i + 1}</small></div>`; continue; }
      const d = dishOf(g.dish);
      const lab = g.phase === 'arriving' ? 'Walking in' : g.phase === 'seated' ? (g.serve || !g.dish ? 'Ordering' : 'Ordering') : g.phase === 'eating' ? 'Eating' : g.sad ? 'Left hungry' : 'Paying';
      grid += `<div class="rs-tbl ${g.phase} ${g.sad ? 'sad' : ''}"><div class="rs-guest">${g.sad ? '😞' : esc(g.emoji)}</div>${d && g.phase !== 'arriving' ? `<span class="rs-dish ${g.serve ? '' : 'no'}">${esc(d.emoji)}</span>` : ''}<small>${esc(lab)}</small></div>`;
    }
    const tonight = sv ? sv : { covers: 0, revenue: 0, tips: 0, unhappy: 0 };
    const earn = `<div class="rs-earn"><div><b>🍽️ ${fmt(tonight.covers)}</b><small>Covers</small></div><div><b>🪙 ${fmt(tonight.revenue)}</b><small>Revenue</small></div><div><b>💵 ${fmt(tonight.tips)}</b><small>Tips</small></div><div><b>😞 ${fmt(tonight.unhappy)}</b><small>Unhappy</small></div></div>`;
    const lastBtn = r.lastSummary && !sv ? btn('review', '📰 Last night\'s review', 'btn-gray sm', 'style="width:100%;margin-top:8px"') : '';
    return head + openBtn + `<div class="sub">Tonight's pass</div>` + stockStrip(r) + `<div class="sub">Tables</div><div class="rs-tables">${grid}</div><div class="sub">${sv ? 'Earnings tonight' : 'Earnings'}</div>${earn}${lastBtn}`;
  }

  function renderKitchen(r) {
    const t = nowMs(), n = stoves();
    let st = '';
    for (let i = 0; i < n; i++) {
      const j = r.queue[i], d = j && dishOf(j.id);
      st += j && d ? `<div class="rs-stove on"><span class="rs-se">${esc(d.emoji)}</span><div class="mini rs-bar"><i ${tmA('bar', j.startAt, j.readyAt)}></i></div><small ${tmA('txt', 0, j.readyAt)}></small><button class="rs-x" data-act="pact" data-pa="cancel" data-i="${i}" aria-label="Cancel and refund">✕</button></div>`
        : `<div class="rs-stove"><span class="rs-se">🔥</span><small>Free stove</small></div>`;
    }
    const passItems = Object.keys(r.pass).map(id => { const d = dishOf(id); return d ? `<span class="rs-sk">${esc(d.emoji)} ${esc(d.name)} <b>${r.pass[id]}</b></span>` : ''; }).join('');
    const rows = dishList().map(d => {
      const locked = (G.state.level || 1) < d.level, why = locked ? '' : cookBlock(d), miss = missing(d);
      const right = locked ? `<span class="lockpill">🔒 Lv ${d.level}</span>` : btn('cook', 'Cook', 'btn-green sm', `data-id="${esc(d.id)}"`, why);
      return `<div class="rs-row ${locked ? 'locked' : ''}"><span class="rs-re">${esc(d.emoji)}</span><div class="rs-rm"><b>${esc(d.name)}</b><div class="needs">${chips(d.inputs)}</div><small>⏱ ${fmtT(d.cookSec * (r.staff.cook ? 0.7 : 1))} · ×${PORTIONS} portions${!locked && miss.length && miss.some(k => !known(k)) ? ' · needs the ranch' : ''}</small></div>${right}</div>`;
    }).join('');
    return `<div class="sub">Stoves ${r.queue.length}/${n}</div><div class="rs-stoves">${st}</div>
      <div class="sub">The pass <small>(max ${passCap()} per dish)</small></div>${passItems ? `<div class="rs-stock wrap">${passItems}</div>` : '<div class="empty-note">The pass is empty. Cook something below!</div>'}
      <div class="sub">Cook a dish</div>${rows}`;
  }

  function renderMenu(r) {
    const locked = !!r.service;
    const rows = dishList().map(d => {
      const on = r.menu.indexOf(d.id) >= 0, lv = (G.state.level || 1) < d.level;
      const parts = priceParts(d), price = dishPrice(d), miss = missing(d);
      const right = lv ? `<span class="lockpill">🔒 Lv ${d.level}</span>` : btn('menu', on ? '✓ On' : 'Add', on ? 'btn-green sm' : 'btn-gray sm', `data-id="${esc(d.id)}"`, locked ? 'Menu is locked while service is running' : '');
      return `<div class="rs-row ${lv ? 'locked' : ''} ${on ? 'on' : ''}"><span class="rs-re">${esc(d.emoji)}</span><div class="rs-rm"><b>${esc(d.name)}</b><div class="rs-pr">🪙 <b>${price}</b>${parts.map(p => `<em>${p[0]} +${Math.round(p[1] * 100)}%</em>`).join('')}</div>
        <div class="needs">${!lv && miss.length ? `<span class="need no">Need ingredients</span>` : ''}${chips(d.inputs)}</div><small>In pass: <b>${r.pass[d.id] || 0}</b></small></div>${right}</div>`;
    }).join('');
    return `<div class="rs-menuhead"><b>Tonight's menu</b><span>${r.menu.length}/${menuCap()}</span></div>${r.farmOnly ? '<div class="rs-rule">🌾 Farm rule: every dish uses your own produce, and sells for +10%.</div>' : ''}${rows}`;
  }

  function renderStaff(r) {
    const staff = Object.keys(STAFF).map(k => {
      const s = STAFF[k], on = r.staff[k];
      return `<div class="rs-row ${on ? 'on' : ''}"><span class="rs-re">${s.emoji}</span><div class="rs-rm"><b>${esc(s.name)}</b><small>${esc(s.desc)}</small><small>Wage 🪙 ${WAGES[k]} per service</small></div>${btn('hire', on ? 'Hired' : 'Hire', on ? 'btn-green sm' : 'btn-gold sm', `data-k="${k}"`, r.service ? 'Staff changes after service' : '')}</div>`;
    }).join('');
    const ups = Object.keys(UPGRADES).map(k => {
      const u = UPGRADES[k], n = r.up[k], maxed = n >= u.max, lv = (G.state.level || 1) < u.level, cost = u.cost(n);
      let right;
      if (maxed) right = '<span class="lockpill">✓ Done</span>';
      else if (lv) right = `<span class="lockpill">🔒 Lv ${u.level}</span>`;
      else right = btn('up', '🪙 ' + fmt(cost), 'btn-gold sm', `data-k="${k}"`, G.state.coins < cost ? 'You need 🪙 ' + fmt(cost) : '');
      return `<div class="rs-row"><span class="rs-re">${u.emoji}</span><div class="rs-rm"><b>${esc(u.name)}${u.max > 1 ? ` <em>${n}/${u.max}</em>` : ''}</b><small>${esc(u.desc(n))}</small></div>${right}</div>`;
    }).join('');
    return `<div class="sub">Staff <small>(wages: 🪙 ${wageTotal()} per service)</small></div>${staff}<div class="sub">Upgrades</div>${ups}`;
  }

  function renderOpen(r) {
    const tabs = [['service', '🔔', 'Service'], ['kitchen', '🍳', 'Kitchen'], ['menu', '📋', 'Menu'], ['staff', '⭐', 'Staff']];
    const seg = `<div class="rs-seg" role="tablist">${tabs.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-act="pact" data-pa="tab" data-tab="${x[0]}" role="tab">${x[1]}<span>${x[2]}</span></button>`).join('')}</div>`;
    const top = `<div class="rs-top"><div class="rs-top-r">${stars(r.rating)}<b>${r.rating.toFixed(1)}</b></div><small>${fmt(r.stats.covers)} guests served${r.up.parking||r.up.lights||r.up.grill||r.up.winelist ? ' · ' : ''}${r.up.parking ? '🅿️' : ''}${r.up.lights ? '✨' : ''}${r.up.grill ? '🔥' : ''}${r.up.winelist ? '🍷' : ''}${featureActive() ? ' 📰 Featured!' : ''}</small></div>`;
    const body = tab === 'kitchen' ? renderKitchen(r) : tab === 'menu' ? renderMenu(r) : tab === 'staff' ? renderStaff(r) : renderService(r);
    return top + seg + body;
  }

  G.panels = G.panels || {};
  G.panels.restaurant = {
    live: true,
    title() { const r = R_(); return r && r.stage === 'open' ? '🍽️ The Lambing Barn' : '🍽️ Barn Restaurant'; },
    sub() { const r = R_(); if (!r) return ''; return r.stage === 'open' ? 'Farm-to-table · Whitman County' : r.stage === 'building' ? 'Barn conversion in progress' : r.stage === 'permit' ? 'Permit paperwork' : 'Coming soon'; },
    render() {
      const r = R_(); if (!r) return '<div class="empty-note">Restaurant unavailable</div>';
      step();
      if (r.stage === 'open') return renderOpen(r);
      return renderQuest(r);
    },
    onAction(action, el) {
      try {
        const ds = (el && el.dataset) || {};
        switch (action) {
          case 'tab': tab = ds.tab || 'service'; { const r = R_(); if (r) r.tab = tab; } break;
          case 'apply': applyPermit(); break;
          case 'hearing': openHearing(); break;
          case 'reno': startReno(); break;
          case 'cook': cook(ds.id); break;
          case 'cancel': cancelCook(+ds.i); break;
          case 'menu': toggleMenu(ds.id); break;
          case 'open': startService(); break;
          case 'review': showSummary(); break;
          case 'hire': toggleStaff(ds.k); break;
          case 'up': buyUpgrade(ds.k); break;
          default: break;
        }
      } catch (e) { console.error('[restaurant] action', e); }
    }
  };

  }

.rs-row.on{border-color:#5fb53c;background:#f1fbe6}.rs-row.locked{opacity:.65}
.rs-re{font-size:30px;width:40px;text-align:center;flex:none}.rs-rm{flex:1;min-width:0}.rs-rm>b{display:block;font-size:14px;line-height:1.15}
.rs-rm small{display:block;font-size:11px;color:var(--ink2,#7a5a38);font-weight:800;margin-top:2px}.rs-rm em{font-style:normal;font-size:11px;color:var(--ink2,#7a5a38)}
.rs-row .btn{flex:none;min-width:70px}.rs-pr{font-size:13px;margin-top:2px}.rs-pr em{background:#fff1c9;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:900;color:#8a5a06}
.rs-menuhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:2px 2px 8px}.rs-menuhead span{background:#fff1c9;border-radius:12px;padding:2px 10px;font-weight:900}
.rs-rule{background:#e3f3cf;border:2px solid #8fcb62;border-radius:14px;padding:6px 10px;font-size:12px;margin-bottom:8px}
.rs-net{margin:8px 0;padding:8px;border-radius:14px;font-size:15px}.rs-net.up{background:#d6f2b8;color:#2e5a14}.rs-net.dn{background:#ffd5cc;color:#a42d23}
.rs-ratechg{font-size:18px;margin:4px 0}.rs-ratechg span{font-size:14px}.rs-ratechg.up span{color:#3e8223}.rs-ratechg.dn span{color:#a42d23}
.rs-fine{font-size:12px;color:#a42d23;margin:2px 0}
.rs-quote{margin:10px 0 4px;padding:10px 12px;background:#fff;border-left:5px solid #f2b631;border-radius:12px;font-size:14px;font-weight:800;text-align:left;line-height:1.35}
.mcard .rs-say,.mcard .rs-sum>div,.mcard .rs-net,.mcard .rs-quote,.mcard .rs-ratechg,.mcard .rs-fine{text-shadow:none!important;color:var(--ink,#4a2f14)}
.mcard .rs-say p{color:var(--ink,#4a2f14)!important}.mcard .rs-ratechg{background:#fff;border-radius:12px;padding:4px}
.rs-quote cite{display:block;margin-top:4px;font-size:12px;font-style:normal;color:var(--ink2,#7a5a38)}
`);

  // ---------- lifecycle ----------
  G.bus.on('init', () => { try { ensure(); tab = R_().tab || 'service'; } catch (e) { console.error('[restaurant] init', e); } });
  G.bus.on('state:reset', () => { try { tab = 'service'; ensure(); } catch (e) { console.error('[restaurant] reset', e); } });
  G.bus.on('levelup', p => { try { if (p && p.level === UNLOCK_LEVEL && stage() === 'none') say('🍽️ The county planning board has a form with your name on it. A barn restaurant awaits!', 'good'); } catch (e) { /* ignore */ } });
  G.bus.on('tick', p => {
    try {
      const r = G.state && G.state.restaurant;
      if (r && r.stage === 'none') return;     // cheap exit when nothing is going on
      if (!r) return;
      step(p && p.now ? p.now : nowMs());
    } catch (e) { console.error('[restaurant] tick', e); }
  });

  G.Restaurant = {
    stage, isServing, customers, tables: tablesCount, ensure,
    rating: () => R_().rating, stars: () => R_().rating,
    // actions (also used by tests)
    apply: applyPermit, hearing: openHearing, resolveHearing, reno: startReno, cook, cancelCook, toggleMenu, startService, step,
    buyUpgrade, toggleStaff, addRating, showSummary, dishPrice, dishes: dishList,
    summary: () => R_().lastSummary, cooldownLeft: () => Math.max(0, R_().cooldownUntil - nowMs()),
    constants: { UNLOCK_LEVEL, PERMIT_FEE, GRAVEL_COST, BUILD_COST, INSPECT_MS, BUILD_MS, SERVICE_MS, COOLDOWN_MS, HEARING_DELAY_MS, PORTIONS }
  };
  ensure();
})();

<script>/* ---- antiques.js ---- */
/* antiques.js — Kellyville antique store: buy low, restore, sell high (G.Antiques, panel 'antiques').
   Roadside strip across County Rd 9. Costs real coins to build and run; smart play is clearly profitable. */
(function () {
  'use strict';
  const G = window.G;
  const U = G.util;

  const UNLOCK_LEVEL = 6, BUILD_COST = 1500, CAP = 4, OFFER_SEC = 75;
  const COND = ['poor', 'fair', 'good', 'mint'];
  const COND_MULT = [0.5, 1, 1.6, 2.5];
  const COND_EMOJI = ['🩹', '🔧', '✨', '💎'];
  const RESTORE_FEE = [0.10, 0.18, 0.30];     // fraction of baseValue to lift condition one step
  const RESTORE_SEC = [60, 120, 240];
  const TIERS = [
    { key: 'bargain', name: 'Bargain', emoji: '🏷️', mult: 0.9 },
    { key: 'fair', name: 'Fair', emoji: '⚖️', mult: 1.2 },
    { key: 'collector', name: 'Collector', emoji: '💎', mult: 1.6 }
  ];
  const PICKER_RATE = 0.6;
  const RARITY_W = { common: 1, uncommon: 2, rare: 3, legendary: 4 };
  const SEASON_TRAFFIC = { summer: 1.35, fall: 1.1, spring: 1.0, winter: 0.65 };

  // ---------- data ----------
  const A = (name, emoji, category, era, baseValue, rarity, desc, find) => ({ name, emoji, category, era, baseValue, rarity, desc, find: !!find });
  const ITEMS = {
    old_horseshoe: A('Old Iron Horseshoe', '🐴', 'farm', '1900s', 18, 'common', 'Turned up in a Palouse wheat field. Lucky side up.', 1),
    glass_bottle: A('Aqua Glass Bottle', '🍾', 'kitchen', '1890s', 22, 'common', 'Hand-blown, with bubbles in the glass and a lip from a Spokane bottling works.', 1),
    hand_plane: A('Carpenter\'s Hand Plane', '🛠️', 'farm', '1920s', 30, 'common', 'Beech body, iron blade. Built a thousand barn doors.', 1),
    mason_jars: A('Blue Mason Jar Collection', '🥫', 'kitchen', '1910s', 45, 'common', 'A dozen sky-blue canning jars from a Walla Walla pantry.', 1),
    washboard: A('Wooden Washboard', '🧺', 'farm', '1920s', 38, 'common', 'Scrubbed many a harvest shirt.'),
    skillet: A('Cast-Iron Skillet', '🍳', 'kitchen', '1930s', 55, 'common', 'Seasoned by three generations of Ritzville cooks.'),
    brass_cowbell: A('Brass Cowbell', '🔔', 'farm', '1930s', 60, 'common', 'Still rings clear across the pasture.'),
    milk_cans: A('Galvanized Milk Cans', '🥛', 'farm', '1940s', 70, 'common', 'A pair of dairy cans, dented in all the right places.'),
    apple_labels: A('Apple-Crate Label Set', '🍎', 'decor', '1940s', 55, 'common', 'Colorful Wenatchee orchard crate labels, never used.'),
    candy_dish: A('Depression-Glass Candy Dish', '🍬', 'kitchen', '1930s', 65, 'common', 'Pink glass that catches the afternoon sun.'),
    kerosene_lamp: A('Kerosene Lamp', '🪔', 'light', '1900s', 75, 'common', 'Hurricane glass, brass burner. Lit the farmhouse before the power lines came.'),
    tin_sign: A('Grain-Elevator Tin Sign', '🪧', 'decor', '1940s', 90, 'uncommon', 'Embossed tin from a Palouse grain elevator.'),
    tractor_seat: A('Cast-Iron Tractor Seat', '🚜', 'farm', '1930s', 95, 'uncommon', 'Perforated seat, perfectly pitted. Makes a fine bar stool.'),
    expo_souvenir: A('Expo \'74 World\'s Fair Souvenir', '🎡', 'souvenir', '1974', 100, 'uncommon', 'A Spokane World\'s Fair keepsake from the riverfront fair.'),
    butter_churn: A('Hand-Crank Butter Churn', '🧈', 'farm', '1910s', 110, 'uncommon', 'Glass jar, wooden paddles, a story in every turn.'),
    feed_sack_dress: A('Feed-Sack Dress', '👗', 'textile', '1940s', 120, 'uncommon', 'Sewn from printed flour sacking by a thrifty rancher\'s wife.'),
    railroad_lantern: A('Railroad Lantern', '🏮', 'light', '1920s', 130, 'uncommon', 'Swung from the caboose on the old Palouse line.'),
    wagon_wheel: A('Palouse Barn-Find Wagon Wheel', '⚙️', 'western', '1890s', 140, 'uncommon', 'Iron-rimmed oak, found leaning in a barn loft.'),
    camp_blanket: A('Wool Camp Blanket', '🧣', 'textile', '1930s', 140, 'uncommon', 'Heavy striped wool that has outlasted six winters on the Palouse.'),
    rotary_phone: A('Rotary Telephone', '☎️', 'tech', '1950s', 150, 'uncommon', 'Heavy black bakelite. Still has the party-line sticker.'),
    quilt: A('Hand-Stitched Quilt', '🛏️', 'textile', '1930s', 160, 'uncommon', 'Wedding-ring pattern, a thousand tiny stitches.'),
    typewriter: A('Manual Typewriter', '⌨️', 'tech', '1940s', 170, 'uncommon', 'Round glass keys, satisfying clack.'),
    film_camera: A('Folding Film Camera', '📷', 'tech', '1930s', 210, 'rare', 'Bellows camera with a leather case, from a small-town portrait studio.'),
    pocket_watch: A('Railroad Pocket Watch', '⏱️', 'tech', '1910s', 240, 'rare', 'Gold-filled case, runs a minute a week fast.'),
    cream_separator: A('Hand-Crank Cream Separator', '⚗️', 'farm', '1920s', 260, 'rare', 'Spinning discs and a bright red crank. A true dairy-farm relic.'),
    steamer_trunk: A('Steamer Trunk', '🧳', 'furniture', '1900s', 280, 'rare', 'Brass corners and a Seattle shipping label.'),
    oak_icebox: A('Oak Icebox', '🧊', 'furniture', '1910s', 320, 'rare', 'Quarter-sawn oak with zinc lining and original hardware.'),
    gramophone: A('Crank Gramophone', '📯', 'music', '1910s', 350, 'rare', 'Brass horn, hand crank, a stack of shellac records.'),
    cowboy_saddle: A('Cowboy Saddle', '🤠', 'western', '1920s', 420, 'rare', 'Hand-tooled leather, worn smooth by an Okanogan wrangler.'),
    rodeo_buckle: A('Silver Rodeo Buckle', '🏆', 'western', '1950s', 700, 'legendary', 'Engraved with the winner\'s name at the Ellensburg rodeo.'),
    carousel_horse: A('Painted Carousel Horse', '🎠', 'decor', '1920s', 800, 'legendary', 'Carved from basswood, rescued from a Spokane park carousel.'),
    strongbox: A('Gold-Rush Strongbox', '🔐', 'western', '1880s', 900, 'legendary', 'Riveted iron, a stagecoach company stencil, and the key still works.'),
    reed_organ: A('Parlor Reed Organ', '🎹', 'music', '1890s', 1100, 'legendary', 'Pump pedals, carved walnut, and still plays hymns.')
  };
  G.DATA = G.DATA || {};
  G.DATA.antiques = ITEMS;
  const KEYS = Object.keys(ITEMS);

  // category fondness by shopper type
  const TYPES = [
    { id: 'collector', emoji: '🧐', name: 'Collector', w: 2, max: [1.5, 1.95], aff: { _: 0.7 }, rar: { common: 0.4, uncommon: 1, rare: 2.2, legendary: 3 },
      lines: ['Now THAT is a provenance.', 'I have been hunting one of these for years.', 'Condition is everything.'] },
    { id: 'picker', emoji: '🚐', name: 'Picker', w: 2, max: [0.85, 1.15], aff: { _: 1 }, cheap: true,
      lines: ['I can flip this in Seattle.', 'Cash, no haggling games.', 'Margins are thin, friend.'] },
    { id: 'designer', emoji: '🎨', name: 'Interior designer', w: 1.5, max: [1.4, 1.9], aff: { decor: 2, furniture: 2, light: 1.6, textile: 1.5, music: 1.2, _: 0.4 },
      lines: ['This will anchor the whole room.', 'My client in Medina will adore it.', 'Rustic is very in right now.'] },
    { id: 'tourist', emoji: '📸', name: 'Seattle tourist', w: 2, max: [1.3, 1.8], aff: { souvenir: 2, decor: 1.5, kitchen: 1.4, western: 1.4, textile: 1.1, _: 0.6 },
      lines: ['We do NOT have this in Seattle.', 'Wine country gets better and better.', 'Will it fit in the Subaru?'] },
    { id: 'rancher', emoji: '🤠', name: 'Local rancher', w: 1.8, max: [1.1, 1.5], aff: { farm: 2, western: 2, light: 1.4, kitchen: 1.2, _: 0.4 },
      lines: ['My granddad had one just like it.', 'Fair price for a fair piece.', 'This belongs on a working farm.'] }
  ];
  const TYPE_BY = {}; TYPES.forEach(t => { TYPE_BY[t.id] = t; });

  const SOURCES = [
    { id: 'estate', emoji: '🏡', name: 'Walla Walla estate sale', n: [3, 4], disc: [0.72, 1.2], cond: [0.1, 0.35, 0.4, 0.15], rar: { common: 1, uncommon: 2, rare: 2.5, legendary: 0.3 }, cats: { furniture: 2, decor: 2, textile: 1.6, music: 2, kitchen: 1 }, blurb: 'Fine furniture and tidy estates' },
    { id: 'auction', emoji: '🔨', name: 'Ritzville farm auction', n: [3, 4], disc: [0.55, 1.25], cond: [0.35, 0.4, 0.2, 0.05], rar: { common: 1.5, uncommon: 2, rare: 1.2, legendary: 0.1 }, cats: { farm: 2.5, western: 2, light: 1.5 }, blurb: 'Wild prices on farm iron' },
    { id: 'flea', emoji: '🛍️', name: 'Spokane flea market', n: [4, 5], disc: [0.75, 1.25], cond: [0.2, 0.4, 0.3, 0.1], rar: { common: 2, uncommon: 2, rare: 1, legendary: 0.12 }, cats: {}, blurb: 'A bit of everything' },
    { id: 'yard', emoji: '🏷️', name: 'Moscow-Pullman yard sale', n: [3, 4], disc: [0.4, 0.95], cond: [0.5, 0.35, 0.13, 0.02], rar: { common: 3, uncommon: 1, rare: 0.15, legendary: 0 }, cats: {}, blurb: 'Cheap finds, rough shape' }
  ];
  const BARN = { id: 'barn', emoji: '🏚️', name: 'Barn find tip', disc: [0.2, 0.5], cond: [0.55, 0.45, 0, 0], rar: { common: 0, uncommon: 2, rare: 2, legendary: 0.35 }, blurb: 'A neighbor\'s tip, one day only' };
  const SRC_BY = {}; SOURCES.concat([BARN]).forEach(s => { SRC_BY[s.id] = s; });

  const UPGRADES = {
    shelves: { name: 'Window shelving', emoji: '🪟', cost: 350, desc: '+2 display slots and 6 more storage spots.' },
    workshop: { name: 'Restoration workshop', emoji: '🔧', cost: 600, desc: 'Restore items one condition step at a time. Doubles an item\'s value over two steps.' },
    appraiser: { name: 'Appraiser\'s loupe', emoji: '🔍', cost: 750, desc: 'Reveals true value ranges, spots deals and overpriced junk, and reads buyers\' budgets.' },
    porch: { name: 'Front porch', emoji: '🪑', cost: 500, desc: '+1 display slot and +25% foot traffic.' },
    neonSign: { name: 'Neon OPEN sign', emoji: '💡', cost: 450, desc: 'Evening shoppers keep coming after sunset.' },
    secondFloor: { name: 'Second floor gallery', emoji: '🏛️', cost: 2200, requires: ['shelves', 'porch'], desc: '+1 display slot, a second workbench, +10 storage and more serious buyers.' }
  };
  const UP_ORDER = ['shelves', 'workshop', 'appraiser', 'porch', 'neonSign', 'secondFloor'];

  // ---------- state ----------
  let customers = [], feed = [], lastT = 0;
  let ui = { tab: 'floor', editName: false, armed: null, pickSlot: false, filter: 'all' };
  const feedPush = (emoji, text, kind) => { feed.unshift({ id: U.uid(), emoji, text, kind: kind || '', t: U.now() }); if (feed.length > 8) feed.length = 8; };
  const clean = n => String(n == null ? '' : n).replace(/[<>&"`\\\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 28);
  const defaultName = () => (G.playerName ? G.playerName() : 'Farmer') + "'s Antiques";
  const calOf = () => { try { return G.calendar(); } catch (e) { return { day: 1, season: 'spring', dayProgress: 0.3 }; } };
  const isDay = cal => cal.dayProgress >= 0.05 && cal.dayProgress <= 0.8;
  const isEve = cal => cal.dayProgress > 0.8 && cal.dayProgress <= 0.95;

  function ensure() {
    const gs = G.state; if (!gs) return null;
    let s = gs.antiques;
    if (!s || typeof s !== 'object') s = gs.antiques = {};
    if (typeof s.built !== 'boolean') s.built = false;
    s.name = clean(s.name);
    if (!s.up || typeof s.up !== 'object') s.up = {};
    UP_ORDER.forEach(k => { s.up[k] = !!s.up[k]; });
    if (!Array.isArray(s.inv)) s.inv = [];
    s.inv = s.inv.filter(x => x && ITEMS[x.key]);
    s.inv.forEach(x => {
      x.id = x.id || U.uid(); x.cond = U.clamp(Math.floor(+x.cond) || 0, 0, 3); x.paid = Math.max(0, +x.paid || 0);
      x.invested = Math.max(0, +x.invested || x.paid || 0); x.disp = !!x.disp;
      if (x.rest && !(+x.rest.endAt > 0)) x.rest = null;
    });
    if (!Array.isArray(s.offers)) s.offers = [];
    if (!s.listings || typeof s.listings !== 'object') s.listings = { day: 0, list: [] };
    if (!Array.isArray(s.listings.list)) s.listings.list = [];
    s.tier = U.clamp(Math.floor(s.tier == null ? 1 : s.tier) || 0, 0, 2);
    s.rep = isFinite(+s.rep) && +s.rep > 0 ? U.clamp(+s.rep, 1, 5) : 2.5;
    if (!s.stats || typeof s.stats !== 'object') s.stats = {};
    ['spent', 'restoreSpent', 'upgradeSpent', 'revenue', 'sales', 'profit', 'finds', 'picker'].forEach(k => { s.stats[k] = +s.stats[k] || 0; });
    if (!s.daily || typeof s.daily !== 'object') s.daily = { day: 0, coins: 0, sales: 0 };
    ['day', 'coins', 'sales'].forEach(k => { s.daily[k] = +s.daily[k] || 0; });
    ['boostUntil', 'slumpUntil', 'buzzUntil'].forEach(k => { s[k] = +s[k] || 0; });
    return s;
  }
  const S = () => ensure() || { built: false, up: {}, inv: [], offers: [], listings: { day: 0, list: [] }, tier: 1, rep: 2.5, stats: {}, daily: {} };
  const isBuilt = () => !!S().built;
  const nameOf = s => s.name || defaultName();

  const slotCount = () => { const u = S().up; return U.clamp(2 + (u.shelves ? 2 : 0) + (u.porch ? 1 : 0) + (u.secondFloor ? 1 : 0), 2, 6); };
  const storeLevel = () => { const u = S().up; return u.secondFloor ? 3 : (u.shelves || u.porch ? 2 : 1); };
  const invCap = () => { const u = S().up; return 14 + (u.shelves ? 6 : 0) + (u.secondFloor ? 10 : 0); };
  const benches = () => 1 + (S().up.secondFloor ? 1 : 0);

  function emitStructural() {
    try { G.bus.emit('antiques:change'); G.bus.emit('change'); G.save(); } catch (e) { console.error('[antiques] emit', e); }
  }

  // ---------- values ----------
  function hash01(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10007) / 10007; }
  function drift(key) { return 1 + 0.09 * Math.sin(calOf().day * 0.8 + hash01(key) * 6.28); }
  function boost() { const s = S(); return U.now() < s.boostUntil ? 1.2 : 1; }
  const baseOf = key => (ITEMS[key] || {}).baseValue || 1;
  function valueAt(key, cond) { return Math.max(1, Math.round(baseOf(key) * COND_MULT[U.clamp(cond, 0, 3)] * drift(key))); }
  function valueOf(it) { return Math.max(1, Math.round(valueAt(it.key, it.cond) * boost())); }
  const askOf = it => Math.max(1, Math.round(valueOf(it) * TIERS[S().tier].mult));
  function estimate(it, noise) {
    const v = valueOf(it), appr = S().up.appraiser;
    const c = appr ? 1 : 1 + (noise || 0), w = appr ? 0.07 : 0.3;
    return [Math.max(1, Math.round(v * c * (1 - w))), Math.max(1, Math.round(v * c * (1 + w)))];
  }
  const noiseOf = id => (hash01(String(id)) - 0.5) * 0.4;
  const restoreFee = it => Math.round(baseOf(it.key) * RESTORE_FEE[it.cond]);
  const restoreTime = it => RESTORE_SEC[it.cond];

  // ---------- listings ----------
  function wpick(obj) { const ks = Object.keys(obj); return U.weightedPick(ks, k => obj[k]); }
  function genListings(day) {
    const s = S(), list = [];
    const mk = (src, cond) => {
      const pool = KEYS.filter(k => (src.rar[ITEMS[k].rarity] || 0) > 0);
      const key = U.weightedPick(pool, k => (src.rar[ITEMS[k].rarity] || 0) * ((src.cats && src.cats[ITEMS[k].category]) || (src.cats && Object.keys(src.cats).length ? 0.5 : 1)));
      if (!key) return null;
      const c = cond != null ? cond : U.weightedPick([0, 1, 2, 3], i => src.cond[i]);
      const disc = U.rand(src.disc[0], src.disc[1]);
      const id = U.uid();
      return { id, src: src.id, key, cond: c, price: Math.max(1, Math.round(valueAt(key, c) * disc)), noise: noiseOf(id), sold: false };
    };
    SOURCES.forEach(src => { const n = U.randInt(src.n[0], src.n[1]); for (let i = 0; i < n; i++) { const l = mk(src); if (l) list.push(l); } });
    if (Math.random() < 0.45) { const l = mk(BARN); if (l) list.push(l); }
    s.listings = { day, list };
  }
  function ensureListings() { const s = S(), d = calOf().day; if (s.built && s.listings.day !== d) genListings(d); }
  function listings() { ensureListings(); return S().listings.list.filter(l => !l.sold).map(l => Object.assign({}, l)); }
  const dealRatio = l => l.price / Math.max(1, valueAt(l.key, l.cond) * boost());

  function buyListing(id) {
    const s = S(); if (!s.built) return false; ensureListings();
    const l = s.listings.list.find(x => x.id === id && !x.sold); if (!l) { G.toast('Sold already', 'bad'); return false; }
    if (s.inv.length >= invCap()) { G.toast('Storage full. Sell or display something first.', 'bad'); return false; }
    if (!G.spend(l.price)) return false;
    l.sold = true;
    s.inv.push({ id: U.uid(), key: l.key, cond: l.cond, paid: l.price, invested: l.price, disp: false, rest: null });
    s.stats.spent += l.price;
    const it = ITEMS[l.key];
    G.toast(`${it.emoji} Bought ${it.name} (${COND[l.cond]}) for 🪙 ${l.price}`, 'good');
    G.bus.emit('antiques:bought', { key: l.key, price: l.price });
    G.bus.emit('change'); G.save();
    return true;
  }

  // ---------- inventory / display ----------
  const find = id => S().inv.find(x => x.id === id);
  const displayed = () => S().inv.filter(x => x.disp && !x.rest);
  function setDisplay(id, on) {
    const s = S(), it = find(id); if (!it) return false;
    if (on) {
      if (it.rest) { G.toast('That piece is in the workshop', 'bad'); return false; }
      if (it.disp) return true;
      if (displayed().length >= slotCount()) { G.toast('Display is full. Remove something first.', 'bad'); return false; }
      it.disp = true;
    } else {
      if (!it.disp) return true;
      it.disp = false;
      s.offers = s.offers.filter(o => o.invId !== id);
    }
    emitStructural(); return true;
  }
  function removeItem(it) {
    const s = S(); const was = it.disp;
    s.inv = s.inv.filter(x => x !== it);
    s.offers = s.offers.filter(o => o.invId !== it.id);
    customers.forEach(c => { if (c.target === it.id && !c.decided) c.target = null; });
    return was;
  }
  function recordSale(it, price, label) {
    const s = S(), cal = calOf();
    const profit = price - it.invested;
    s.stats.revenue += price; s.stats.sales++; s.stats.profit += profit;
    if (s.daily.day !== cal.day) s.daily = { day: cal.day, coins: 0, sales: 0 };
    s.daily.coins += price; s.daily.sales++;
    G.addCoins(price, 'antiques');
    G.bus.emit('antiques:sale', { key: it.key, coins: price, profit, who: label });
    return profit;
  }
  function quickSell(id) {
    const s = S(); const it = find(id); if (!it || !s.built) return false;
    if (it.rest) { G.toast('That piece is in the workshop', 'bad'); return false; }
    const price = Math.max(1, Math.round(valueOf(it) * PICKER_RATE));
    const wasDisp = removeItem(it);
    s.stats.picker++; recordSale(it, price, 'picker');
    G.toast(`🚐 The picker paid 🪙 ${price} for your ${ITEMS[it.key].name}`, 'good');
    if (wasDisp) emitStructural(); else G.bus.emit('change');
    return true;
  }

  // ---------- workshop ----------
  function restore(id) {
    const s = S(), it = find(id); if (!it || !s.built) return false;
    if (!s.up.workshop) { G.toast('Build the restoration workshop first', 'bad'); return false; }
    if (it.rest) return false;
    if (it.cond >= 3) { G.toast('Already in mint condition', 'bad'); return false; }
    if (s.inv.filter(x => x.rest).length >= benches()) { G.toast('All workbenches are busy', 'bad'); return false; }
    const fee = restoreFee(it);
    if (!G.spend(fee)) return false;
    const now = U.now(), sec = restoreTime(it);
    it.rest = { startAt: now, endAt: now + sec * 1000 };
    it.invested += fee; s.stats.restoreSpent += fee;
    if (it.disp) { it.disp = false; s.offers = s.offers.filter(o => o.invId !== id); emitStructural(); } else G.bus.emit('change');
    G.toast(`🔧 Restoring ${ITEMS[it.key].name} (${fee} coins, ${Math.round(sec / 60 * 10) / 10} min)`, 'info');
    return true;
  }
  function finishRestores(now) {
    const s = S(); let done = false;
    s.inv.forEach(it => {
      if (it.rest && now >= it.rest.endAt) {
        it.rest = null; it.cond = Math.min(3, it.cond + 1); done = true;
        G.toast(`✨ ${ITEMS[it.key].name} restored to ${COND[it.cond]}!`, 'good');
        feedPush('🔧', `${ITEMS[it.key].name} is now ${COND[it.cond]}.`, 'coin');
      }
    });
    if (done) G.bus.emit('change');
  }

  // ---------- upgrades / build ----------
  function build(name) {
    const s = ensure();
    if (!s || s.built) return false;
    if ((G.state.level || 1) < UNLOCK_LEVEL) { G.toast(`Antique store unlocks at level ${UNLOCK_LEVEL}`, 'bad'); return false; }
    if (!G.spend(BUILD_COST)) return false;
    s.built = true; s.name = clean(name); s.rep = 2.5; s.listings = { day: 0, list: [] };
    customers = []; feed = []; ui.tab = 'floor';
    genListings(calOf().day);
    G.bus.emit('antiques:built');
    emitStructural();
    try {
      G.showModal({ emoji: '🏺', title: 'Grand opening!', text: `${nameOf(s)} is open on County Rd 9. Buy low at the sales, restore the good ones, and watch the collectors roll in.`, kind: 'good', confetti: true, buttons: [{ label: 'Let\'s go treasure hunting', cls: 'btn-gold' }] });
    } catch (e) { }
    return true;
  }
  function setName(n) { const c = clean(n); if (!c) return false; S().name = c; emitStructural(); return true; }
  function upgrade(key) {
    const s = S(), u = UPGRADES[key]; if (!u || !s.built) return false;
    if (s.up[key]) return false;
    const miss = (u.requires || []).filter(r => !s.up[r]);
    if (miss.length) { G.toast('Buy the ' + miss.map(m => UPGRADES[m].name).join(' & ') + ' first', 'bad'); return false; }
    if (!G.spend(u.cost)) return false;
    s.up[key] = true; s.stats.upgradeSpent += u.cost;
    G.toast(`${u.emoji} ${u.name} added!`, 'good');
    G.bus.emit('antiques:upgrade', { key }); emitStructural(); return true;
  }
  function setTier(i) { const s = S(); i = U.clamp(Math.floor(+i) || 0, 0, 2); if (s.tier === i) return true; s.tier = i; G.bus.emit('change'); return true; }

  // ---------- offers ----------
  function acceptOffer(id) {
    const s = S(); const o = s.offers.find(x => x.id === id); if (!o) return false;
    const it = find(o.invId); s.offers = s.offers.filter(x => x !== o);
    if (!it) return false;
    const wasDisp = removeItem(it);
    const profit = recordSale(it, o.amount, o.type);
    s.rep = U.clamp(s.rep + 0.04, 1, 5);
    const nm = ITEMS[it.key].name;
    feedPush('💰', `Sold ${nm} for ${o.amount} (${profit >= 0 ? '+' : ''}${profit} profit)`, 'coin');
    G.toast(`💰 Sold ${nm} for 🪙 ${o.amount}`, 'good');
    if (wasDisp) emitStructural(); else G.bus.emit('change');
    return true;
  }
  function declineOffer(id) {
    const s = S(); const o = s.offers.find(x => x.id === id); if (!o) return false;
    s.offers = s.offers.filter(x => x !== o); feedPush(o.emoji, 'Maybe next time then.', 'sad'); G.bus.emit('change'); return true;
  }
  // x = how much more than their offer you ask for (0.1, 0.25, 0.5)
  function counterChance(o, x) {
    const slack = o.max / Math.max(1, o.amount) - 1;
    let p = x <= slack * 0.6 ? 0.95 : 0.95 - (x - slack * 0.6) * 2.6;
    p *= 0.9 + 0.04 * S().rep;
    return U.clamp(p, 0.03, 0.97);
  }
  function counterOffer(id, x) {
    const s = S(); const o = s.offers.find(y => y.id === id); if (!o) return false;
    x = +x; if (!(x > 0)) return acceptOffer(id);
    const it = find(o.invId);
    s.offers = s.offers.filter(y => y !== o);
    if (!it) return false;
    if (Math.random() < counterChance(o, x)) {
      const amt = Math.round(o.amount * (1 + x));
      const wasDisp = removeItem(it);
      const profit = recordSale(it, amt, o.type);
      s.rep = U.clamp(s.rep + 0.05, 1, 5);
      feedPush('🤝', `Haggled ${ITEMS[it.key].name} up to ${amt} (${profit >= 0 ? '+' : ''}${profit})`, 'coin');
      G.toast(`🤝 Counter accepted: 🪙 ${amt}!`, 'good');
      if (wasDisp) emitStructural(); else G.bus.emit('change');
      return true;
    }
    s.rep = U.clamp(s.rep - 0.04, 1, 5);
    feedPush(o.emoji, 'Too rich for me. Forget it.', 'sad');
    G.toast('😬 The buyer walked off', 'bad');
    G.bus.emit('change'); return false;
  }

  // ---------- shoppers ----------
  function trafficRate(now, cal, withEvents) {
    const s = S(), u = s.up, dn = displayed().length;
    let r = (1 / 15) * (0.5 + 0.22 * s.rep);
    if (u.porch) r *= 1.25;
    if (u.secondFloor) r *= 1.15;
    r *= SEASON_TRAFFIC[cal.season] || 1;
    r *= 0.6 + 0.2 * Math.min(dn, 6);
    if (withEvents) {
      let ev = []; try { ev = (G.Events && G.Events.active) ? G.Events.active() : []; } catch (e) { }
      if (ev.some(e => e && e.key === 'appraisal_fair')) r *= 1.4;
      if (now < s.buzzUntil) r *= 1.6;
      if (now < s.slumpUntil) r *= 0.6;
    }
    return r;
  }
  function spawn(now) {
    const type = U.weightedPick(TYPES, t => t.w + (t.id === 'collector' && S().up.secondFloor ? 1 : 0));
    const c = { id: U.uid(), type, emoji: type.emoji, phase: 'arriving', start: now, dur: U.rand(4, 7) * 1000, mood: undefined, target: null, decided: false };
    customers.push(c); return c;
  }
  function affinity(type, it) {
    const d = ITEMS[it.key];
    let a = type.aff[d.category] != null ? type.aff[d.category] : (type.aff._ != null ? type.aff._ : 0.6);
    if (type.rar) a *= type.rar[d.rarity] || 1;
    if (type.cheap) a *= 1 / Math.sqrt(Math.max(1, valueOf(it)) / 60);
    return a;
  }
  function decide(c) {
    const s = S(), type = c.type;
    const pool = displayed();
    if (!pool.length) { c.mood = 'sad'; return; }
    const it = U.weightedPick(pool, x => affinity(type, x));
    if (!it) { c.mood = 'sad'; return; }
    c.target = it.id;
    const aff = affinity(type, it);
    const nm = ITEMS[it.key].name;
    if (Math.random() > U.clamp(0.4 + 0.45 * Math.min(aff, 1.6), 0.2, 0.95)) { c.mood = 'meh'; feedPush(c.emoji, U.pick(['Nothing here is calling to me.', 'Just browsing today.', 'Not quite my thing.']), 'meh'); return; }
    const willing = U.rand(type.max[0], type.max[1]) * (0.85 + 0.06 * s.rep) * U.clamp(0.85 + 0.15 * aff, 0.8, 1.15);
    const P = TIERS[s.tier].mult, val = valueOf(it);
    if (P <= willing * 0.9) {
      if (Math.random() < 0.88) {
        const price = askOf(it);
        const wasDisp = removeItem(it); const profit = recordSale(it, price, type.id);
        s.rep = U.clamp(s.rep + (s.tier === 0 ? 0.03 : 0.05), 1, 5);
        c.mood = 'happy'; c.coins = price;
        feedPush(c.emoji, `${U.pick(type.lines)} Bought ${nm} for ${price} (${profit >= 0 ? '+' : ''}${profit}).`, 'coin');
        if (wasDisp) emitStructural();
      } else { c.mood = 'meh'; feedPush(c.emoji, 'Let me think about it...', 'meh'); }
    } else if (P <= willing * 1.5) {
      if (Math.random() < 0.85 && s.offers.length < 4 && !s.offers.some(o => o.invId === it.id)) {
        const max = Math.round(val * willing), amt = Math.max(1, Math.round(val * willing * U.rand(0.82, 0.93)));
        if (amt >= askOf(it)) { c.mood = 'meh'; return; }
        const now = U.now();
        s.offers.push({ id: U.uid(), invId: it.id, type: type.id, emoji: c.emoji, who: type.name, amount: amt, max, startAt: now, endAt: now + OFFER_SEC * 1000 });
        c.mood = 'happy';
        feedPush(c.emoji, `${U.pick(type.lines)} Offering ${amt} for ${nm}.`, 'offer');
        try { G.toast(`💰 ${type.name} offers 🪙 ${amt} for ${nm}`, 'info'); } catch (e) { }
      } else { c.mood = 'meh'; }
    } else {
      c.mood = 'sad'; s.rep = U.clamp(s.rep - 0.01, 1, 5);
      feedPush(c.emoji, U.pick(['Whoa, that price tag!', 'Way beyond my budget.', 'I can get it cheaper in Spokane.']), 'sad');
    }
  }
  function advance(c, now) {
    let guard = 0;
    while (now - c.start >= c.dur && guard++ < 4) {
      const at = c.start + c.dur;
      if (c.phase === 'arriving') c.phase = 'browsing';
      else if (c.phase === 'browsing') { c.phase = 'leaving'; if (!c.decided) { c.decided = true; decide(c); } }
      else { c.phase = 'gone'; return; }
      c.start = at; c.dur = U.rand(3, 6) * 1000;
    }
  }
  function expireOffers(now) {
    const s = S(), n = s.offers.length;
    s.offers = s.offers.filter(o => {
      if (!find(o.invId) || !find(o.invId).disp) return false;
      if (now >= o.endAt) { feedPush(o.emoji, 'Gave up waiting and left.', 'sad'); return false; }
      return true;
    });
    return n !== s.offers.length;
  }
  function onTick(p) {
    const s = ensure(); if (!s || !s.built) { lastT = 0; return; }
    const now = (p && p.now) || U.now(), cal = (p && p.cal) || calOf();
    const dt = lastT ? Math.min(2, Math.max(0, (now - lastT) / 1000)) : 0.5;
    lastT = now;
    ensureListings();
    finishRestores(now);
    if (expireOffers(now)) G.bus.emit('change');
    customers.forEach(c => advance(c, now));
    customers = customers.filter(c => c.phase !== 'gone');
    const open = isDay(cal) || (s.up.neonSign && isEve(cal));
    if (open && displayed().length && customers.length < CAP) {
      let r = trafficRate(now, cal, true);
      if (!isDay(cal)) r *= 0.5;
      if (Math.random() < r * dt) spawn(now);
    }
  }

  // ---------- farm finds ----------
  function onHarvest() {
    const s = ensure(); if (!s || !s.built) return;
    if (Math.random() > 0.04) return;
    if (s.inv.length >= invCap()) return;
    const key = U.pick(KEYS.filter(k => ITEMS[k].find));
    const cond = Math.random() < 0.6 ? 0 : 1;
    s.inv.push({ id: U.uid(), key, cond, paid: 0, invested: 0, disp: false, rest: null });
    s.stats.finds++;
    G.toast(`${ITEMS[key].emoji} Dug up an ${ITEMS[key].name.toLowerCase()} while harvesting! Added to your antique collection.`, 'good');
    G.bus.emit('antiques:find', { key });
    G.bus.emit('change');
  }

  // ---------- events ----------
  function reg() {
    if (!G.Events || !G.Events.register) return;
    const built = () => { try { return isBuilt(); } catch (e) { return false; } };
    const ALL = ['spring', 'summer', 'fall', 'winter'];
    G.Events.register({
      key: 'appraisal_fair', name: 'Appraisal fair in Spokane', emoji: '🏛️', kind: 'good', seasons: ALL, minLevel: UNLOCK_LEVEL, weight: 0.8, durationSec: 150, requires: built,
      desc: 'Antique values and foot traffic are up for a couple of minutes.',
      onStart() { const s = ensure(); s.boostUntil = U.now() + 150000; s.rep = U.clamp(s.rep + 0.15, 1, 5); return {}; },
      text: () => 'A big appraisal fair in Spokane has everyone hunting for treasure. Antique values are up 20% and extra shoppers are heading your way.'
    });
    G.Events.register({
      key: 'tv_pickers', name: 'TV picker crew stops by', emoji: '📺', kind: 'good', seasons: ALL, minLevel: UNLOCK_LEVEL, weight: 0.7, durationSec: 0, requires: () => built() && S().inv.length > 0,
      desc: 'A TV picking crew wants your best piece.',
      text: () => 'A TV picker crew rolled up in a vintage van and wants to film a segment. They have their eye on your finest piece.',
      choices: [
        { label: 'Sell them the best piece', cost: 0, desc: 'They pay 1.8x value for your most valuable item.', apply: () => tvSale(1.8, 1.8) },
        { label: 'Haggle on camera', cost: 0, desc: 'Gamble: 50% they pay 2.6x, otherwise a lowball 1.2x.', apply: () => { const win = Math.random() < 0.5; return tvSale(win ? 2.6 : 1.2, 1); } },
        { label: 'Just a shout-out', cost: 0, desc: 'No sale. Free publicity brings crowds.', apply: () => { const s = ensure(); s.buzzUntil = U.now() + 120000; s.rep = U.clamp(s.rep + 0.2, 1, 5); return 'Your shop got a big on-camera shout-out. Shoppers are streaming in.'; } }
      ]
    });
    G.Events.register({
      key: 'repro_scare', name: 'Reproduction scare', emoji: '🔎', kind: 'bad', seasons: ALL, minLevel: UNLOCK_LEVEL, weight: 0.7, durationSec: 0, requires: built,
      desc: 'A reproduction slipped into the market.',
      text: () => 'A shopper discovered that a piece sold in the region is a modern reproduction. Word is spreading. Do you make it right?',
      choices: [
        { label: 'Refund the buyer', cost: c => Math.round(U.clamp(80 + 6 * c.level + (S().stats.sales || 0) * 4, 90, 300)), desc: 'Costs coins but your reputation for honesty grows.', apply: () => { const s = ensure(); s.rep = U.clamp(s.rep + 0.3, 1, 5); s.buzzUntil = U.now() + 60000; return 'You refunded the buyer on the spot. The shop earned a reputation for honesty.'; } },
        { label: 'Shrug it off', cost: 0, desc: 'Keep the coins. Reputation drops and traffic slumps.', apply: () => { const s = ensure(); s.rep = U.clamp(s.rep - 0.8, 1, 5); s.slumpUntil = U.now() + 150000; return 'Word got around that you would not stand behind your sales. Shoppers are steering clear.'; } }
      ]
    });
  }
  function tvSale(mult, seg) {
    const s = ensure(); const cand = s.inv.filter(x => !x.rest);
    if (!cand.length) return 'The crew left with nothing to film.';
    cand.sort((a, b) => valueOf(b) - valueOf(a));
    const it = cand[0], price = Math.round(valueOf(it) * mult);
    const wasDisp = removeItem(it); recordSale(it, price, 'tv');
    s.rep = U.clamp(s.rep + 0.15, 1, 5); s.buzzUntil = U.now() + 60000 * seg;
    if (wasDisp) emitStructural(); else G.bus.emit('change');
    return `The crew paid 🪙 ${price} for your ${ITEMS[it.key].name}. You will be on TV!`;
  }
