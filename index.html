.an-chip{display:inline-block;font-size:10px;font-weight:900;border-radius:8px;padding:1px 6px;margin-right:3px;color:#fff;vertical-align:middle}
.an-chip.c0{background:#a65a3a}.an-chip.c1{background:#a08a5a}.an-chip.c2{background:#4a9a3a}.an-chip.c3{background:#3b8fd0}
.an-chip.r-common{background:#9a8a70}.an-chip.r-uncommon{background:#4a9a3a}.an-chip.r-rare{background:#8e44ad}.an-chip.r-legendary{background:#d98c0c}
.an-chip.deal{background:var(--green)}.an-chip.over{background:var(--red)}.an-chip.fair{background:#9a8a70}
.an-src{display:flex;align-items:center;gap:8px;background:linear-gradient(#e9d6aa,#dcc088);border-radius:14px;padding:6px 10px;margin-top:4px}
.an-src .e{font-size:24px}.an-src b{font-size:14px;color:var(--ink);display:block;line-height:1.1}.an-src small{font-size:11px;font-weight:700;color:var(--ink2)}
.an-feed{background:#fffaf0;border:3px solid #e2c98d;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:5px}
.an-ln{display:flex;gap:7px;align-items:flex-start}.an-ln .e{font-size:20px;flex:none}
.an-ln .b{background:#fff;border:2px solid #f0dcaa;border-radius:4px 14px 14px 14px;padding:3px 9px;font-size:12.5px;font-weight:700;color:var(--ink)}
.an-ln.coin .b{background:#fff3c8;border-color:#f2b631;font-weight:900}.an-ln.sad .b{background:#ffe3dc;border-color:#f0b0a0}.an-ln.offer .b{background:#e4f1ff;border-color:#8ec3ee}
.an-cust{display:flex;gap:6px;min-height:54px}
.an-c{flex:1 1 0;min-width:0;background:#fff;border:2px solid #f0dcaa;border-radius:12px;padding:4px 2px;text-align:center}
.an-c .e{font-size:24px;display:block;line-height:1.2}.an-c small{display:block;font-size:10px;font-weight:900;color:var(--ink2);text-transform:capitalize}
.an-c.sad{background:#ffe3dc}.an-c.happy{background:#eaf8d9}
.an-bar{height:8px;border-radius:5px;background:rgba(90,60,20,.2);overflow:hidden}.an-bar i{display:block;height:100%;width:0;background:linear-gradient(#ffd45e,#f2a91c);border-radius:5px}
.an-build{text-align:center;background:linear-gradient(#fdf1d3,#f3d493);border:3px solid #8a5a2b;border-radius:20px;padding:16px;box-shadow:var(--card-sh);display:flex;flex-direction:column;gap:10px}
.an-build .big{font-size:56px}.an-build h3{margin:0;font-size:20px}.an-build p{margin:0;font-size:13px;color:var(--ink2);font-weight:700;line-height:1.4}
.an-steps{display:flex;gap:6px}.an-steps div{flex:1;background:#fffaf0;border:2px solid #ecd49a;border-radius:12px;padding:6px 3px;font-size:11px;font-weight:800;color:var(--ink)}.an-steps .e{display:block;font-size:24px}
.an-filter{display:flex;gap:5px;overflow-x:auto;padding:2px 0}
.an-ledger{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.an-ledger div{background:#fffaf0;border:2px solid #ecd49a;border-radius:12px;padding:5px 8px;font-size:12px;font-weight:800;color:var(--ink2)}.an-ledger b{display:block;font-size:15px;color:var(--ink)}
.an-pos{color:var(--green-d)!important}.an-neg{color:var(--red-d)!important}
`;
  }
  if (typeof document !== 'undefined') G.injectCSS('antiques', css());

  const btn = (act, label, cls, extra) => `<button class="btn ${cls || 'btn-gold'} sm" data-act="pact" data-pa="${act}" ${extra || ''}>${label}</button>`;
  const dis = why => `aria-disabled="true" data-why="${esc(why)}"`;
  const condChip = c => `<span class="an-chip c${c}">${COND_EMOJI[c]} ${COND[c]}</span>`;
  const rarChip = k => `<span class="an-chip r-${ITEMS[k].rarity}">${ITEMS[k].rarity}</span>`;

  function renderBuild() {
    const lvl = G.state.level || 1, lock = lvl < UNLOCK_LEVEL;
    const intro = `<div class="an-steps"><div><span class="e">🏷️</span>Buy low at sales</div><div><span class="e">🔧</span>Restore to shine</div><div><span class="e">💰</span>Sell high</div></div>`;
    if (lock) return `<div class="an-build"><div class="big">🏺</div><h3>Antique Store</h3>${intro}<p>Hunt estate sales and farm auctions, polish up the finds, and sell to collectors. Unlocks at level ${UNLOCK_LEVEL}.</p><div><span class="lockpill">🔒 Level ${UNLOCK_LEVEL}</span></div></div>`;
    const poor = G.state.coins < BUILD_COST;
    return `<div class="an-build"><div class="big">🏺</div><h3>Open an antique store</h3>${intro}
<p>Buy rusty treasures at estate sales and farm auctions, restore them in your workshop, then sell to collectors, tourists and ranchers. Haggle for big profits. Smart buyers roughly double their money.</p>
<input class="an-name-in" type="text" maxlength="28" value="${esc(nameOf(ensure()))}" aria-label="Store name">
${btn('build', `Build the store ${coins(BUILD_COST)}`, 'btn-green', poor ? dis('You need ' + BUILD_COST + ' coins') : '')}</div>`;
  }

  function statusInfo() {
    const cal = calOf(), s = S();
    if (isDay(cal)) return { cls: 'open', txt: 'Open' };
    if (s.up.neonSign && isEve(cal)) return { cls: 'eve', txt: 'Neon open' };
    return { cls: 'closed', txt: 'Closed' };
  }

  function valueLine(it, noise) {
    const [lo, hi] = estimate(it, noise);
    return `Worth ${lo}-${hi}`;
  }

  function renderHead(s) {
    const st = statusInfo(), cal = calOf();
    return `<div class="an-head"><button class="an-sign" data-act="pact" data-pa="editname" aria-label="Rename store">🏺 ${esc(nameOf(s))} ✏️</button>
${ui.editName ? `<div class="an-nameedit"><input class="an-name-in" type="text" maxlength="28" value="${esc(nameOf(s))}" aria-label="Store name">${btn('savename', 'Save', 'btn-green')}</div>` : ''}
<div class="an-stats"><div class="an-stat"><b class="an-star">⭐ ${s.rep.toFixed(1)}</b><small>${stars(s.rep)}</small></div>
<div class="an-stat"><b>${coins(s.daily.day === cal.day ? s.daily.coins : 0)}</b><small>Today</small></div>
<div class="an-stat"><b><span class="an-pill ${st.cls}">${st.txt}</span></b><small>Status</small></div></div></div>`;
  }

  function renderTabs(s) {
    const tabs = [['floor', '🏺', 'Floor'], ['buy', '🛒', 'Buy'], ['work', '🔧', 'Shop'], ['coll', '📦', 'Items'], ['up', '⬆️', 'Upgrades']];
    return `<div class="an-tabs">${tabs.map(([k, e, n]) => `<button class="an-tab ${ui.tab === k ? 'sel' : ''}" data-act="pact" data-pa="tab" data-k="${k}"><span class="e">${e}</span>${n}${k === 'floor' && s.offers.length ? `<i>${s.offers.length}</i>` : ''}</button>`).join('')}</div>`;
  }

  function renderOffer(o, s) {
    const it = find(o.invId); if (!it) return '';
    const d = ITEMS[it.key], val = valueOf(it), appr = s.up.appraiser;
    const slack = o.max / Math.max(1, o.amount) - 1;
    const hint = appr ? (slack < 0.1 ? 'Looks firm' : slack < 0.22 ? 'Some give' : 'Eager buyer') : '';
    const vs = o.amount >= val ? `${Math.round((o.amount / val - 1) * 100)}% over value` : `${Math.round((1 - o.amount / val) * 100)}% under value`;
    const profit = o.amount - it.invested;
    return `<div class="an-card offer"><div class="an-row"><span class="e">${o.emoji}</span><div class="t"><b>${esc(o.who)} offers ${coins(o.amount)}</b><small>${esc(d.emoji)} ${esc(d.name)} · ${vs} · ${profit >= 0 ? '+' : ''}${profit} profit${hint ? ' · ' + hint : ''}</small></div></div>
<div class="an-bar"><i ${tmAttr('bar', o.startAt, o.endAt)}></i></div>
<div class="an-btns">${btn('accept', 'Accept', 'btn-green', `data-id="${o.id}"`)}${btn('decline', 'Decline', 'btn-gray', `data-id="${o.id}"`)}</div>
<div class="an-btns">${[0.1, 0.25, 0.5].map(x => {
      const pr = appr ? ` · ${Math.round(counterChance(o, x) * 100)}%` : '';
      return btn('counter', `+${x * 100}%${pr}`, 'btn-gold', `data-id="${o.id}" data-x="${x}"`);
    }).join('')}</div></div>`;
  }

  function renderFloor(s) {
    const n = slotCount(), disp = displayed();
    const tiers = TIERS.map((t, k) => `<button class="an-tier ${s.tier === k ? 'sel' : ''}" data-act="pact" data-pa="tier" data-t="${k}">${t.emoji} ${t.name}<br>${t.mult}x value</button>`).join('');
    const cells = [];
    for (let i = 0; i < 6; i++) {
      if (i >= n) { cells.push(`<div class="an-slot empty lock"><span class="e">🔒</span><span class="n">Needs upgrade</span></div>`); continue; }
      const it = disp[i];
      if (!it) { cells.push(`<button class="an-slot empty" data-act="pact" data-pa="addslot" aria-label="Add an item to display"><span class="e">＋</span><span class="n">Add from collection</span></button>`); continue; }
      const d = ITEMS[it.key];
      cells.push(`<button class="an-slot" data-act="pact" data-pa="undisp" data-id="${it.id}" aria-label="Take ${esc(d.name)} off display"><span class="cd">${COND_EMOJI[it.cond]}</span><span class="e">${esc(d.emoji)}</span><span class="n">${esc(d.name)}</span><span class="p">${coins(askOf(it))}</span></button>`);
    }
    const custs = customers.slice(0, CAP);
    const custHtml = custs.length ? custs.map(c => `<div class="an-c ${c.mood || ''}"><span class="e">${c.emoji}</span><small>${c.phase === 'arriving' ? 'arriving' : c.phase === 'browsing' ? 'browsing' : (c.mood === 'sad' ? 'unhappy' : c.mood === 'happy' ? 'happy' : 'leaving')}</small></div>`).join('') : `<div class="empty-note" style="padding:10px">${disp.length ? (isDay(calOf()) ? 'Waiting for shoppers...' : 'Closed for the night.') : 'Put something on display to attract shoppers.'}</div>`;
    const feedHtml = feed.slice(0, 6).map(f => `<div class="an-ln ${f.kind}"><span class="e">${esc(f.emoji)}</span><div class="b">${esc(f.text)}</div></div>`).join('');
    return `<div class="sub" style="margin:0 2px">Price tier (sets what shoppers see)</div><div class="an-tiers">${tiers}</div>
<div class="an-slots">${cells.join('')}</div>
${s.offers.length ? `<div class="sub" style="margin:2px 2px 0">Offers (${s.offers.length})</div>${s.offers.map(o => renderOffer(o, s)).join('')}` : ''}
<div class="sub" style="margin:2px 2px 0">Shoppers</div><div class="an-cust">${custHtml}</div>
${feedHtml ? `<div class="an-feed">${feedHtml}</div>` : ''}`;
  }

  function renderBuy(s) {
    ensureListings();
    const all = s.listings.list;
    const full = s.inv.length >= invCap();
    let html = `<div class="empty-note" style="padding:8px;font-size:12px">Stock refreshes every morning. Storage ${s.inv.length}/${invCap()}. ${s.up.appraiser ? 'Your loupe flags the deals.' : 'Tip: buy the appraiser\'s loupe to spot bargains.'}</div>`;
    SOURCES.concat([BARN]).forEach(src => {
      const rows = all.filter(l => l.src === src.id);
      if (src.id === 'barn' && !rows.length) return;
      html += `<div class="an-src"><span class="e">${src.emoji}</span><div><b>${esc(src.name)}</b><small>${esc(src.blurb)}</small></div></div>`;
      const live = rows.filter(l => !l.sold);
      if (!live.length) { html += `<div class="empty-note" style="padding:8px;font-size:12px">Picked clean. Check back tomorrow.</div>`; return; }
      html += live.map(l => {
        const d = ITEMS[l.key], ratio = dealRatio(l), can = G.state.coins >= l.price && !full;
        const why = full ? 'Storage full' : 'You need ' + l.price + ' coins';
        const tag = s.up.appraiser ? (ratio <= 0.78 ? '<span class="an-chip deal">Deal!</span>' : ratio >= 1.12 ? '<span class="an-chip over">Overpriced</span>' : '<span class="an-chip fair">Fair</span>') : '';
        const fake = { key: l.key, cond: l.cond };
        return `<div class="an-card"><div class="an-row"><span class="e">${esc(d.emoji)}</span><div class="t"><b>${esc(d.name)}</b><small>${condChip(l.cond)}${rarChip(l.key)}${tag}<br>${valueLine(fake, l.noise)}</small></div><div style="text-align:right"><div class="an-price">${coins(l.price)}</div>${btn('buy', 'Buy', 'btn-green', `data-id="${l.id}" ${can ? '' : dis(why)}`)}</div></div></div>`;
      }).join('');
    });
    return html;
  }

  function renderWork(s) {
    if (!s.up.workshop) return `<div class="an-build" style="padding:14px"><div class="big" style="font-size:44px">🔧</div><h3>No workshop yet</h3><p>A workshop lets you restore pieces one condition step at a time: poor to fair to good to mint. Restored antiques can sell for several times what you paid.</p>${btn('tab', 'See upgrades', 'btn-gold', 'data-k="up"')}</div>`;
    const now = U.now(), active = s.inv.filter(x => x.rest), nb = benches();
    let html = `<div class="empty-note" style="padding:8px;font-size:12px">Workbenches in use: ${active.length}/${nb}. Each step costs coins and 1 to 4 minutes.</div>`;
    active.forEach(it => {
      const d = ITEMS[it.key];
      html += `<div class="an-card"><div class="an-row"><span class="e">${esc(d.emoji)}</span><div class="t"><b>${esc(d.name)}</b><small>${condChip(it.cond)} → ${condChip(it.cond + 1)} <span ${tmAttr('txt', it.rest.startAt, it.rest.endAt)}></span></small></div></div><div class="an-bar"><i ${tmAttr('bar', it.rest.startAt, it.rest.endAt)}></i></div></div>`;
    });
    const list = s.inv.filter(x => !x.rest && x.cond < 3).sort((a, b) => (valueAt(b.key, b.cond + 1) - valueAt(b.key, b.cond)) - (valueAt(a.key, a.cond + 1) - valueAt(a.key, a.cond)));
    if (!list.length && !active.length) html += `<div class="empty-note">Nothing to restore. Buy something rusty!</div>`;
    list.forEach(it => {
      const d = ITEMS[it.key], fee = restoreFee(it), gain = valueAt(it.key, it.cond + 1) - valueAt(it.key, it.cond);
      const busy = active.length >= nb, poor = G.state.coins < fee;
      html += `<div class="an-card"><div class="an-row"><span class="e">${esc(d.emoji)}</span><div class="t"><b>${esc(d.name)}</b><small>${condChip(it.cond)} → ${condChip(it.cond + 1)}<br>Adds about ${coins(gain)} · ${Math.round(restoreTime(it) / 60 * 10) / 10} min</small></div>${btn('restore', `Restore ${coins(fee)}`, 'btn-gold', `data-id="${it.id}" ${busy ? dis('All workbenches are busy') : poor ? dis('You need ' + fee + ' coins') : ''}`)}</div></div>`;
    });
    return html;
  }

  function renderColl(s) {
    if (!s.inv.length) return `<div class="empty-note">Your collection is empty. Visit the Buy tab for estate sale treasures!</div>`;
    const full = displayed().length >= slotCount();
    let html = `<div class="empty-note" style="padding:8px;font-size:12px">${s.inv.length}/${invCap()} stored · ${displayed().length}/${slotCount()} on display${ui.pickSlot ? '. Tap Display on a piece.' : ''}</div>`;
    const list = s.inv.slice().sort((a, b) => valueOf(b) - valueOf(a));
    html += list.map(it => {
      const d = ITEMS[it.key], v = valueOf(it), pr = Math.round(v * PICKER_RATE), armed = ui.armed === it.id;
      const net = v - it.invested;
      const act = it.rest ? `<span class="lockpill" style="min-width:0;flex:1">🔧 In workshop</span>`
        : it.disp ? btn('undisp', 'Remove display', 'btn-gray', `data-id="${it.id}"`)
          : btn('disp', 'Display', 'btn-green', `data-id="${it.id}" ${full ? dis('Display is full') : ''}`);
      return `<div class="an-card"><div class="an-row"><span class="e">${esc(d.emoji)}</span><div class="t"><b>${esc(d.name)}</b><small>${condChip(it.cond)}${rarChip(it.key)}${it.disp ? '<span class="an-chip c2">on display</span>' : ''}<br>${valueLine(it)} · cost ${it.paid ? it.invested : 'free find'}</small></div><div class="an-price ${net >= 0 ? 'an-pos' : 'an-neg'}" style="font-size:12px">${net >= 0 ? '+' : ''}${net}</div></div>
<div class="an-btns">${act}${it.rest ? '' : btn('picker', armed ? `Sure? ${coins(pr)}` : `Picker ${coins(pr)}`, armed ? 'btn-red' : 'btn-gray', `data-id="${it.id}"`)}</div></div>`;
    }).join('');
    return html;
  }

  function renderUp(s) {
    const st = s.stats, net = st.revenue - st.spent - st.restoreSpent;
    let html = `<div class="an-ledger"><div>Sales<b>${st.sales}</b></div><div>Revenue<b>${coins(st.revenue)}</b></div><div>Bought + restored<b>${coins(st.spent + st.restoreSpent)}</b></div><div>Trading profit<b class="${net >= 0 ? 'an-pos' : 'an-neg'}">${net >= 0 ? '+' : ''}${net.toLocaleString('en-US')}</b></div></div>`;
    html += UP_ORDER.map(k => {
      const u = UPGRADES[k], own = s.up[k], miss = (u.requires || []).filter(r => !s.up[r]);
      const poor = G.state.coins < u.cost;
      const b = own ? `<span class="lockpill" style="background:#cfe8b8;color:#2f6a1c;min-width:84px">Owned</span>` : btn('up', coins(u.cost), 'btn-gold', `data-k="${k}" ${miss.length ? dis('Buy the ' + miss.map(m => UPGRADES[m].name).join(' & ') + ' first') : poor ? dis('You need ' + u.cost + ' coins') : ''}`);
      return `<div class="an-card" style="${own ? 'background:#eaf8d9;border-color:#a6d68a' : ''}"><div class="an-row"><span class="e">${u.emoji}</span><div class="t"><b>${esc(u.name)}</b><small>${esc(u.desc)}${miss.length ? ' Needs: ' + miss.map(m => UPGRADES[m].name).join(', ') + '.' : ''}</small></div>${b}</div></div>`;
    }).join('');
    return html;
  }

  function onAction(a, el) {
    try {
      const s = ensure(), id = el.dataset.id;
      switch (a) {
        case 'build': { const inp = el.closest('.panel-body') && el.closest('.panel-body').querySelector('.an-name-in'); build(inp ? inp.value : ''); break; }
        case 'editname': ui.editName = !ui.editName; break;
        case 'savename': { const inp = el.closest('.panel-body').querySelector('.an-name-in'); if (inp) setName(inp.value); ui.editName = false; break; }
        case 'tab': ui.tab = el.dataset.k; ui.armed = null; ui.pickSlot = false; break;
        case 'tier': setTier(el.dataset.t); break;
        case 'addslot': ui.tab = 'coll'; ui.pickSlot = true; break;
        case 'disp': if (setDisplay(id, true) && ui.pickSlot) { ui.pickSlot = false; ui.tab = 'floor'; } break;
        case 'undisp': setDisplay(id, false); break;
        case 'buy': buyListing(id); break;
        case 'restore': restore(id); break;
        case 'picker': if (ui.armed === id) { ui.armed = null; quickSell(id); } else ui.armed = id; break;
        case 'accept': acceptOffer(id); break;
        case 'decline': declineOffer(id); break;
        case 'counter': counterOffer(id, +el.dataset.x); break;
        case 'up': upgrade(el.dataset.k); break;
      }
    } catch (e) { console.error('[antiques] action', e); }
  }

  G.panels.antiques = {
    live: true,
    title() { return 'Antique Store'; },
    sub() { const s = S(); return s.built ? esc(nameOf(s)) : ''; },
    render() {
      try {
        const s = ensure();
        if (!s.built) return renderBuild();
        let body = '';
        switch (ui.tab) {
          case 'buy': body = renderBuy(s); break;
          case 'work': body = renderWork(s); break;
          case 'coll': body = renderColl(s); break;
          case 'up': body = renderUp(s); break;
          default: body = renderFloor(s);
        }
        return `<div class="an-wrap">${renderHead(s)}${renderTabs(s)}${body}</div>`;
      } catch (e) { console.error('[antiques] render', e); return '<div class="empty-note">Antique store unavailable.</div>'; }
    },
    onAction
  };

  // ---------- public API ----------
  G.Antiques = {
    isBuilt, build,
    name: () => nameOf(S()), setName,
    level: storeLevel,
    upgrades: () => { const o = {}; Object.keys(S().up).forEach(k => { if (S().up[k]) o[k] = true; }); return o; },
    display: () => displayed().slice(0, slotCount()).map(x => ({ key: x.key, emoji: ITEMS[x.key].emoji, name: ITEMS[x.key].name })),
    customers: () => customers.filter(c => c.phase !== 'gone').slice(0, CAP).map(c => ({ id: c.id, emoji: c.emoji, phase: c.phase, t: U.clamp((U.now() - c.start) / c.dur, 0, 1), mood: c.mood })),
    offerCount: () => S().offers.length,
    // extras
    ensure, listings, buyListing, inventory: () => S().inv.map(x => Object.assign({}, x)), setDisplay, restore, quickSell,
    acceptOffer, declineOffer, counterOffer, counterChance, offers: () => S().offers.map(o => Object.assign({}, o)),
    upgrade, setTier, value: valueOf, valueAt, ask: askOf, restoreFee, slotCount, invCap, benches, feed: () => feed.slice(),
    stats: () => Object.assign({}, S().stats), reputation: () => S().rep, todaySales: () => (S().daily.day === calOf().day ? S().daily.coins : 0),
    trafficRate: () => trafficRate(U.now(), calOf(), true), farmFind: onHarvest, genListings,
    unlockLevel: UNLOCK_LEVEL, buildCost: BUILD_COST, upgradeDefs: UPGRADES, items: ITEMS, tiers: TIERS
  };

  // ---------- wiring ----------
  const safe = (n, f) => G.bus.on(n, p => { try { f(p); } catch (e) { console.error('[antiques]', n, e); } });
  safe('init', () => { ensure(); customers = []; feed = []; lastT = 0; });
  safe('state:reset', () => { customers = []; feed = []; lastT = 0; ui = { tab: 'floor', editName: false, armed: null, pickSlot: false, filter: 'all' }; ensure(); });
  safe('tick', onTick);
  safe('harvested', onHarvest);
  reg();
})();

</script>
<script>/* ---- art-terrain.js ---- */
/* art-terrain.js — 3D three-quarter terrain & nature art: ground, Palouse hills, paths, county road, pond, trees, lamps, hay,
   fence, road sign, reeds, rocks and bushes. Lit from the north-west; shade and cast shadows fall south-east. */
(function () {

      return out;
    }
  };

  // ------------------------------------------------------------------ structures.pasture
  A.structures.pasture = {
    ground(c, ctx, H) {
      use(H); const { P_ } = ctx, z = H.Z.pasture, T = H.T, X = z.x * T, Y = z.y * T, w = z.w * T, h = z.h * T, snow = !!P_.snow, r = H.mulberry(91);
      const gy1 = ctx.gate.y * T, gy2 = (ctx.gate.y + ctx.gate.h) * T;
      c.fillStyle = 'rgba(40,25,5,.12)'; H.rr(c, X + 8, Y + 10, w - 16, h - 16, 24); c.fill();
      c.fillStyle = P_.pasture; H.rr(c, X + 12, Y + 12, w - 24, h - 24, 22); c.fill();
      c.save(); H.rr(c, X + 12, Y + 12, w - 24, h - 24, 22); c.clip();
      for (let i = 0; i < 22; i++) blob(c, X + r() * w, Y + r() * h, 24 + r() * 44, 12 + r() * 20, P_.g1, .4);
      for (let i = 0; i < 16; i++) blob(c, X + r() * w, Y + r() * h, 20 + r() * 40, 10 + r() * 16, P_.tuft, .18);
      c.strokeStyle = snow ? '#b7c9d8' : P_.tuft; c.lineWidth = 1.4; c.lineCap = 'round'; c.beginPath();
      for (let i = 0; i < 380; i++) { const x = X + 20 + r() * (w - 40), y = Y + 20 + r() * (h - 40); c.moveTo(x, y); c.lineTo(x - 2, y - 5); c.moveTo(x, y); c.lineTo(x + .5, y - 6); c.moveTo(x, y); c.lineTo(x + 2.5, y - 4.5); } c.stroke();
      if (P_.flower) { const cols = ['#fff', '#ffe36a', '#ff9ec7', '#c9a8ff']; for (let i = 0; i < 70; i++) { c.fillStyle = cols[i % 4]; c.beginPath(); c.arc(X + 20 + r() * (w - 40), Y + 20 + r() * (h - 40), 1.6 + r() * .6, 0, TAU); c.fill(); } }
      // mud patches
      const mud = (mx, my, rx, ry) => {
        blob(c, mx, my, rx + 5, ry + 3, snow ? '#9a8668' : '#6d4a25', .3); blob(c, mx, my, rx, ry, snow ? '#8a7558' : '#6a4622', .6); blob(c, mx - 2, my - 1, rx * .62, ry * .55, snow ? '#a38c6c' : '#7f5830', .6);
        blob(c, mx - rx * .25, my - ry * .3, rx * .26, ry * .2, 'rgba(255,255,255,.28)', 1);
      };
      mud(X + 205, Y + 340, 42, 14); mud(X + 62, Y + 205, 28, 11); mud(X + 130, Y + 190, 34, 12); mud(X + 22, (gy1 + gy2) / 2, 28, 24); mud(X + 240, Y + 150, 20, 8);
      // hoof dimples round the mud
      c.fillStyle = 'rgba(60,35,10,.4)'; for (let i = 0; i < 40; i++) { const x = X + 40 + r() * (w - 80), y = Y + 60 + r() * (h - 110); c.beginPath(); c.ellipse(x - 1.4, y, 1.1, 1.6, 0, 0, TAU); c.ellipse(x + 1.4, y, 1.1, 1.6, 0, 0, TAU); c.fill(); }
      // worn trail from the gate
      blob(c, X + 70, (gy1 + gy2) / 2, 60, 14, '#8a6a3c', snow ? .25 : .35);
      c.strokeStyle = 'rgba(50,30,5,.15)'; c.lineWidth = 12; H.rr(c, X + 12, Y + 12, w - 24, h - 24, 22); c.stroke();
      c.strokeStyle = 'rgba(50,30,5,.12)'; c.lineWidth = 5; H.rr(c, X + 17, Y + 17, w - 34, h - 34, 18); c.stroke();
      if (snow) {
        for (let i = 0; i < 26; i++) blob(c, X + r() * w, Y + r() * h, 16 + r() * 36, 6 + r() * 12, '#ffffff', .62);
        for (let i = 0; i < 16; i++) blob(c, X + r() * w, Y + 3 + r() * h, 12 + r() * 22, 2 + r() * 3, '#b9cde0', .3);
      }
      c.restore();
      c.strokeStyle = snow ? '#b4c6d6' : P_.tuft; c.lineWidth = 1.5; c.beginPath();
      for (let i = 0; i < 130; i++) {
        const s = r(), t = r(); let x, y;
        if (s < .3) { x = X + 10 + t * (w - 20); y = Y + 8; } else if (s < .6) { x = X + 10 + t * (w - 20); y = Y + h - 6; } else if (s < .8) { x = X + 6; y = Y + 10 + t * (h - 20); } else { x = X + w - 6; y = Y + 10 + t * (h - 20); }
        c.moveTo(x, y); c.lineTo(x - 2, y - 5); c.moveTo(x, y); c.lineTo(x + 1, y - 6); c.moveTo(x, y); c.lineTo(x + 3, y - 4);
      }
      c.stroke();
      // fence shadows + prop shadows
      pastureRuns(ctx).forEach(o => shadowRun(c, o));
      const sp = pastureSpots(z, T);
      sp.bales.forEach(b => ground3(c, b.cx - b.r, b.y1 - b.L, b.r * 2, b.L, b.r * 1.7, .22));
      ground3(c, sp.trough.x, sp.trough.y, sp.trough.w, sp.trough.d, sp.trough.h + 2, .24);
      c.fillStyle = 'rgba(25,15,0,.2)'; c.beginPath(); c.ellipse(sp.tree.x + 26, sp.tree.y + 8, 40, 14, 0, 0, TAU); c.fill();
      H.plate(c, X + w / 2, Y + h + 2, 'CATTLE PASTURE', { size: 9 });
    },
    props(ctx, H) {
      use(H); const { P_ } = ctx, z = H.Z.pasture, T = H.T, out = [], sp = pastureSpots(z, T);
      pastureRuns(ctx, !!P_.snow).forEach(o => out.push(runProp(o)));
      sp.bales.forEach(b => out.push(prop(b.y1 + 1, b.cx - b.r - 4, b.y1 - lift(b.r * 2) - b.L - 6, b.cx + b.r + 4, b.y1 + 5, c => bale(c, P_, b.cx, b.y1, b.r, b.L))));
      const g = sp.trough; out.push(prop(g.y + g.d + 2, g.x - 4, g.y - lift(16), g.x + g.w + 4, g.y + g.d + 8, c => trough(c, P_, g.x, g.y, g.w, g.d, g.h, 'metal')));
      const t = sp.tree; out.push(prop(t.y + 2, t.x - 56, t.y - 110, t.x + 56, t.y + 8, c => H.tree(c, t.x, t.y, 1.25, 0, P_, 555)));
      return out;
    }
  };
  function pastureSpots(z, T) {
    const X = z.x * T, Y = z.y * T;
    return { bales: [{ cx: X + 52, y1: Y + 66, r: 11, L: 18 }, { cx: X + 88, y1: Y + 78, r: 11, L: 18 }, { cx: X + 52, y1: Y + 366, r: 11, L: 18 }], trough: { x: X + 214, y: Y + 316, w: 66, d: 16, h: 10 }, tree: { x: X + 262, y: Y + 100 } };
  }
  function pastureRuns(ctx, snow) {
    const z = K.Z.pasture, T = K.T, X = z.x * T, Y = z.y * T, w = z.w * T, h = z.h * T, g1 = ctx.gate.y * T, g2 = (ctx.gate.y + ctx.gate.h) * T;
    const x0 = X + 20, x1 = X + w - 20, y0 = Y + 20, y1 = Y + h - 20, mk = (kind, a, b, at, bigA, bigB) => ({ kind, a, b, at, bigA: !!bigA, bigB: !!bigB, snow });
    return [mk('h', x0, x1, y0), mk('h', x0, x1, y1)].concat(chunksV(x1, y0, y1, { snow }), chunksV(x0, y0, g1, { snow, bigB: true }), chunksV(x0, g2, y1, { snow, bigA: true }));
  }
  const lerp = (a, b, t) => a + (b - a) * t;

  // ------------------------------------------------------------------ terrain.plots (raised soil beds)
  const BED = { dx: 4, dy: 8, w: 72, d: 64, h: 9 };
  A.terrain.plots = function (c, P_, H) {
    use(H); const s = H.S(), T = H.T, snow = !!P_.snow, lt = H.lift(BED.h);
    for (let i = 0; i < s.plots.length; i++) { const q = H.plotRect(i); H.castShadow(c, q.x * T + BED.dx, q.y * T + BED.dy, BED.w, BED.d, BED.h, .24); }
    for (let i = 0; i < s.plots.length; i++) drawBed(c, P_, H, H.plotRect(i), i, snow, lt);
    if (s.plots.length < s.maxPlots) buySlot(c, P_, H, H.plotRect(s.plots.length));
    if (s.plots.length) H.plate(c, 8 * T, 8.45 * T, 'YOUR FIELDS', { size: 8.5 });
  };
  function drawBed(c, P_, H, q, i, snow, lt) {
    const T = H.T, x0 = q.x * T + BED.dx, y0 = q.y * T + BED.dy, w = BED.w, d = BED.d, r = H.mulberry(300 + i);
    // front face (earth wall) with rounded bottom corners
    c.save(); H.rr(c, x0, y0 - lt + 8, w, d + lt - 8, 7); c.clip();
    const fg = c.createLinearGradient(0, y0 + d - lt, 0, y0 + d); fg.addColorStop(0, P_.soil); fg.addColorStop(.45, P_.soilD); fg.addColorStop(1, '#2d180a');
    c.fillStyle = fg; c.fillRect(x0, y0 + d - lt - 2, w, lt + 4);
    c.fillStyle = 'rgba(0,0,0,.2)'; for (let k = 0; k < 14; k++) { const px = x0 + 4 + r() * (w - 8), py = y0 + d - lt * .7 + r() * lt * .6; c.beginPath(); c.ellipse(px, py, 1.2 + r() * 1.6, .8 + r(), 0, 0, TAU); c.fill(); }
    c.fillStyle = 'rgba(255,220,170,.22)'; for (let k = 0; k < 10; k++) { const px = x0 + 4 + r() * (w - 8), py = y0 + d - lt * .8 + r() * lt * .5; c.beginPath(); c.arc(px, py, .8 + r() * .9, 0, TAU); c.fill(); }
    c.strokeStyle = 'rgba(30,12,0,.35)'; c.lineWidth = .9; c.beginPath(); for (let k = 0; k < 8; k++) { const px = x0 + 6 + r() * (w - 12); c.moveTo(px, y0 + d - lt + 1); c.lineTo(px + r() * 3 - 1.5, y0 + d - lt * .4 + r() * 3); } c.stroke();
    c.fillStyle = 'rgba(255,225,180,.18)'; c.fillRect(x0, y0 + d - lt, 2.6, lt);    // lit left edge
    c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(x0 + w - 3, y0 + d - lt, 3, lt);     // shaded right edge
    c.restore();
    if (snow) { c.fillStyle = 'rgba(255,255,255,.95)'; c.beginPath(); c.moveTo(x0 + 1, y0 + d - lt - 1); for (let k = 0; k <= 12; k++) { const px = x0 + 1 + (w - 2) * k / 12; c.lineTo(px, y0 + d - lt + 2.4 + (k % 2 ? 2.4 : .4) + r() * 1.4); } c.lineTo(x0 + w - 1, y0 + d - lt - 1); c.closePath(); c.fill(); }
    // top face: lit lip, then soil
    const ty = y0 - lt;
    c.fillStyle = snow ? '#f4f8fb' : P_.soilL; H.rr(c, x0, ty, w, d, 8); c.fill();
    c.strokeStyle = 'rgba(40,20,0,.45)'; c.lineWidth = 1; H.rr(c, x0, ty, w, d, 8); c.stroke();
    const tg = c.createLinearGradient(0, ty, 0, ty + d); tg.addColorStop(0, P_.soilL); tg.addColorStop(1, P_.soil);
    c.fillStyle = tg; H.rr(c, x0 + 3, ty + 3, w - 6, d - 6, 6); c.fill();
    c.save(); H.rr(c, x0 + 3, ty + 3, w - 6, d - 6, 6); c.clip();
    c.fillStyle = 'rgba(0,0,0,.16)'; H.rr(c, x0 + 3, ty + 3, w - 6, 3, 2); c.fill();                       // back inner shade
    c.fillStyle = 'rgba(255,225,170,.12)'; c.fillRect(x0 + 3, ty + d - 8, w - 6, 5);
    for (let k = 0; k < 4; k++) {
      const yy = ty + 11 + 14 * k;
      c.fillStyle = 'rgba(30,12,0,.34)'; c.fillRect(x0 + 6, yy + 4, w - 12, 3.4);
      c.fillStyle = 'rgba(255,222,165,.26)'; c.fillRect(x0 + 6, yy + 1, w - 12, 2.4);
    }
    c.fillStyle = 'rgba(30,12,0,.3)'; for (let k = 0; k < 16; k++) { c.beginPath(); c.arc(x0 + 8 + r() * (w - 16), ty + 8 + r() * (d - 16), .7 + r() * 1.1, 0, TAU); c.fill(); }
    if (snow) {
      c.fillStyle = 'rgba(255,255,255,.92)'; c.fillRect(x0 + 3, ty + 3, w - 6, d - 6);
      for (let k = 0; k < 4; k++) { const yy = ty + 11 + 14 * k; c.fillStyle = 'rgba(150,175,200,.55)'; c.fillRect(x0 + 6, yy + 4, w - 12, 2.4); c.fillStyle = 'rgba(255,255,255,1)'; c.fillRect(x0 + 6, yy + 1, w - 12, 2); }
    }
    c.restore();
  }
  function buySlot(c, P_, H, q) {
    const T = H.T, x0 = q.x * T + BED.dx, y0 = q.y * T + BED.dy, w = BED.w, d = BED.d, cx = x0 + w / 2, cy = y0 + d / 2;
    c.fillStyle = 'rgba(255,240,180,.26)'; H.rr(c, x0, y0, w, d, 8); c.fill();
    c.setLineDash([7, 6]); c.lineWidth = 2.5; c.lineCap = 'round'; c.strokeStyle = '#fff4c0'; H.rr(c, x0, y0, w, d, 8); c.stroke(); c.setLineDash([]);
    // corner stakes
    [[x0 + 2, y0 + 2], [x0 + w - 2, y0 + 2], [x0 + 2, y0 + d - 2], [x0 + w - 2, y0 + d - 2]].forEach(p => {
      c.fillStyle = 'rgba(30,15,0,.25)'; c.beginPath(); c.ellipse(p[0] + 2, p[1] + 1, 3, 1.4, 0, 0, TAU); c.fill();
      H.box(c, p[0] - 1.5, p[1] - 1.5, 3, 3, 13, { top: '#ead09a', front: '#8a5a2b', stroke: 'rgba(45,22,5,.6)', lw: .6 });
      H.box(c, p[0] - 1.6, p[1] - 1.6, 3.2, 3.2, 3, { z0: 10.5, top: '#ff6a58', front: '#d9402f' });
    });
    H.bbAt(c, cx, cy, () => {
      c.save(); c.fillStyle = '#fff'; c.font = '900 30px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 4; c.fillText('+', cx, cy - 8); c.restore();
    });
    H.plate(c, cx, cy + 16, 'BUY LAND 🪙' + G.plotCost(), { size: 9, bg: '#ffe39a' });
  }

  // ------------------------------------------------------------------ actors.plot (dynamic, cheap)
  A.actors.plot = function (c, o, H) {
    const p = o.p, x = o.x, y = o.y, t = o.t, i = o.i, F = H.F;
    const bx = x + BED.dx, by = y + BED.dy, bw = BED.w, bd = BED.d, lt = H.lift(BED.h), ty = by - lt;
    if (p.status === 'empty') {
      c.strokeStyle = 'rgba(255,240,200,.4)'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); const cx = bx + bw / 2, cy = ty + bd / 2; c.moveTo(cx - 7, cy); c.lineTo(cx + 7, cy); c.moveTo(cx, cy - 5); c.lineTo(cx, cy + 5); c.stroke();
      return;
    }
    const prog = o.prog, ready = p.status === 'ready', wither = p.status === 'withered', ay = ty + bd / 2, ax = bx + bw / 2;
    if (ready) { c.fillStyle = 'rgba(255,230,120,' + (0.13 + 0.09 * Math.sin(t * 4 + i)) + ')'; H.rr(c, bx + 2, ty + 2, bw - 4, bd - 4, 7); c.fill(); }
    if (wither) { c.fillStyle = 'rgba(70,50,30,.45)'; H.rr(c, bx + 2, ty + 2, bw - 4, bd - 4, 7); c.fill(); }
    H.bbAt(c, ax, ay, () => {
      const Y = gy => ay + (gy - ay) * F;                  // ground-space y (top face) -> upright px
      const g = 0.25 + prog * 0.75;
      if (wither) {
        c.strokeStyle = '#6b5a3a'; c.lineWidth = 1.8; c.lineCap = 'round'; c.beginPath();
        for (let r = 0; r < 4; r++) for (let k = 0; k < 5; k++) { const tx = bx + 10 + k * 13 + (r % 2) * 5, tyy = Y(ty + 15 + r * 14); c.moveTo(tx, tyy); c.quadraticCurveTo(tx, tyy - 5, tx - 4, tyy - 6 + (k % 2)); }
        c.stroke();
        H.em(c, '🥀', ax, Y(ty + 36) - 4, 30, {});
        return;
      }
      c.strokeStyle = ready ? '#d6c042' : (o.P_.snow ? '#7fa07a' : '#4fb03e'); c.lineWidth = 2.1; c.lineCap = 'round'; c.beginPath();
      const hg = 3 + 8 * g;
      for (let r = 0; r < 4; r++) for (let k = 0; k < 5; k++) {
        const tx = bx + 10 + k * 13 + (r % 2) * 5, tyy = Y(ty + 15 + r * 14), sw = Math.sin(t * 2 + i + k + r) * 1.2;
        c.moveTo(tx, tyy); c.lineTo(tx - 2.5 + sw, tyy - hg); c.moveTo(tx, tyy); c.lineTo(tx + 3 + sw, tyy - hg * .85); c.moveTo(tx, tyy); c.lineTo(tx + sw * .5, tyy - hg * 1.12);
      }
      c.stroke();
      // the crop, standing on the soil
      const grown = prog >= 0.28, ch = grown ? (o.crop.emoji || '🌾') : '🌱';
      const sz = grown ? 24 + 22 * Math.min(1, (prog - 0.28) / 0.72) : 15 + prog * 32, bob = ready ? -Math.abs(Math.sin(t * 3 + i)) * 3 : 0;
      H.em(c, ch, ax, Y(ty + 44) - sz * .38 + bob, sz, { rot: Math.sin(t * 1.6 + i * 1.3) * 0.05 });
      // ring standing at the back-right corner
      const rx = bx + bw - 7, ry = Y(ty + 7) - 9, col = ready ? '#8be05a' : '#ffe27a';
      c.strokeStyle = 'rgba(60,35,10,.8)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(rx, ry + 8); c.lineTo(rx, Y(ty + 7)); c.stroke();
      c.fillStyle = 'rgba(30,15,0,.55)'; c.beginPath(); c.arc(rx, ry, 9, 0, TAU); c.fill();
      c.lineWidth = 3.6; c.strokeStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(rx, ry, 6.2, 0, TAU); c.stroke();
      c.strokeStyle = col; c.beginPath(); c.arc(rx, ry, 6.2, -Math.PI / 2, -Math.PI / 2 + TAU * prog); c.stroke();
      if (ready) {
        c.fillStyle = '#8be05a'; c.beginPath(); c.arc(rx, ry, 5.6, 0, TAU); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(rx - 2.6, ry); c.lineTo(rx - .6, ry + 2.4); c.lineTo(rx + 3, ry - 2.4); c.stroke();
        for (let k = 0; k < 3; k++) { const ph = (t * 1.4 + k * .37 + i * .13) % 1, sx = bx + 12 + H.hash(i + 'sx' + k) * 50, sy = Y(ty + 14 + H.hash(i + 'sy' + k) * 40) - 14 - ph * 14; H.star(c, sx, sy, 2.5 + 3.5 * Math.sin(ph * Math.PI), 1 - ph * .3); }
      }
    });
  };

  // ------------------------------------------------------------------ terrain.pivotTrack
  A.terrain.pivotTrack = function (c, P_, H) {
    if (!(G.hasExpansion && G.hasExpansion('center_pivot'))) return;
    use(H); const T = H.T, s = H.S(), cx = 8 * T, cy = 14.5 * T, R = 6.2 * T, snow = !!P_.snow;
    c.save();
    // keep the ring off the raised beds
    c.beginPath(); c.rect(0, 0, H.W * T, H.H * T);
    const n = Math.min(s.maxPlots - 1, s.plots.length);
    for (let i = 0; i <= n; i++) { const q = H.plotRect(i); c.rect(q.x * T + 1, q.y * T - 4, q.w * T - 2, q.h * T + 4); }
    c.clip('evenodd');
    c.strokeStyle = snow ? 'rgba(140,165,185,.45)' : 'rgba(70,45,15,.3)'; c.lineWidth = 9; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
    c.strokeStyle = snow ? 'rgba(255,255,255,.7)' : 'rgba(255,225,170,.28)'; c.lineWidth = 2; c.setLineDash([3, 9]); c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, R - 2.5, 0, TAU); c.stroke();
    c.strokeStyle = snow ? 'rgba(150,180,205,.6)' : 'rgba(190,230,255,.34)'; c.lineWidth = 1.6; c.setLineDash([2, 12]); c.beginPath(); c.arc(cx, cy, R + 2.5, 0, TAU); c.stroke();
    c.setLineDash([]); c.restore();
  };
})();

<script>/* ---- art-actors.js ---- */
/* Kellyville 3D art: ACTORS (player, tractor, npc, animal, cattle, duck, vehicle).
   All actors are drawn every frame, so complex vector parts are baked once into small offscreen canvases
   (keyed by kind/colour and the quantised device scale) and blitted. Emoji people get a baked outline + rim light. */
(function () {
  'use strict';
  const G = window.G; const A = G.WorldArt = G.WorldArt || {};
  A.structures = A.structures || {}; A.terrain = A.terrain || {}; A.actors = A.actors || {};

  const TAU = Math.PI * 2;
  const EMF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';

  // ------------------------------------------------------------------ cache of baked sprites
  const cache = new Map();
  function devScale() {
    const v = G.World && G.World._v; const s = v ? Math.max(0.5, v.zoom * v.dpr) : 2;
    return Math.pow(2, Math.round(Math.log2(s) * 8) / 8);       // quantised so pinch-zooming does not rebake every frame
  }
  // bake a sprite covering units [x0,x1]x[y0,y1] (origin = ground contact point). fn(g, s) draws in unit coordinates.
  function spr(key, x0, y0, x1, y1, fn) {
    const s = devScale(), k = key + '|' + s.toFixed(3);
    let e = cache.get(k); if (e) return e;

  A.actors.tractor = function (c, o, H) {
    const def = o.def || {}, key = def.key || '', col = def.color || '#2e8b3a';

    const x = o.x, gy = o.y + 14, t = o.t, mv = !!o.moving;

    const bw = sp.w;
    contact(c, x, gy, sp.len + 8, bw * .42, .26);
    for (const s of sp.shadow) { // [x0,x1,height,... ] footprints in unit x with heights -> skewed blocks to the SE
      const a = dir > 0 ? s[0] : -s[1], w = (s[1] - s[0]); // x range after flip
      const hh = s[2] + (s[3] || 0) * .3;
      castShadow2(c, x + (dir > 0 ? s[0] : -s[1]), gy - bw * .32, w, bw * .64, hh, H);
    }
    H.bbAt(c, x, gy, () => {
      const bounce = mv ? Math.sin(t * 28) * 0.7 : 0;
      c.save(); c.translate(x, gy + bounce); if (dir < 0) c.scale(-1, 1);
      c.drawImage(sp.back.cv, sp.back.x0, sp.back.y0, sp.back.w, sp.back.h);
      // near wheels (rotating)
      const rot = mv ? t * 11 : 0;
      for (const w of sp.wheels) {
        const e = tyreSpr(w.r, w.hub);
        c.save(); c.translate(w.x, w.y); c.rotate(rot * (10 / w.r)); c.drawImage(e.cv, e.x0, e.y0, e.w, e.h); c.restore();
      }
      if (sp.reel) { // combine reel
        const r = sp.reel; c.save(); c.translate(r.x, r.y); c.rotate(mv ? -t * 5 : 0);
        c.strokeStyle = '#7a5a12'; c.lineWidth = 1.4; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r.r, Math.sin(a) * r.r); c.stroke(); }
        c.fillStyle = '#f2d34a'; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.beginPath(); c.arc(Math.cos(a) * r.r, Math.sin(a) * r.r, 2.1, 0, TAU); c.fill(); }
        c.fillStyle = '#6b4a10'; c.beginPath(); c.arc(0, 0, 2, 0, TAU); c.fill(); c.restore();
      }
      if (sp.flame && mv) { const f = 4 + Math.abs(Math.sin(t * 40)) * 5; c.fillStyle = 'rgba(255,170,40,.85)'; c.beginPath(); c.moveTo(sp.flame.x, sp.flame.y - 1.4); c.lineTo(sp.flame.x - f, sp.flame.y); c.lineTo(sp.flame.x, sp.flame.y + 1.4); c.fill(); c.fillStyle = 'rgba(255,240,150,.9)'; c.beginPath(); c.moveTo(sp.flame.x, sp.flame.y - .7); c.lineTo(sp.flame.x - f * .5, sp.flame.y); c.lineTo(sp.flame.x, sp.flame.y + .7); c.fill(); }

      c.drawImage(sp.front.cv, sp.front.x0, sp.front.y0, sp.front.w, sp.front.h);
      if (sp.exhaust && mv) { // puffs rise behind the stack
        c.fillStyle = 'rgba(205,205,205,.55)';

  function vcol(o) { return PAINT[Math.floor(G.WorldArt.actors._hash(o.kind + '|' + (o.dir > 0 ? 'e' : 'w') + '|' + Math.round(o.y)) * PAINT.length) % PAINT.length]; }
  A.actors._hash = (s) => { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  function veh(kind, col) {
    const k = kind === '🚚' ? 'truck' : kind === '🚐' ? 'van' : kind === '🚗' ? 'car' : 'pickup';
    const sp = { kind: k };
    const R = k === 'car' ? 6.5 : 7.5;
    let L = k === 'truck' ? 74 : k === 'van' ? 58 : k === 'car' ? 54 : 62, ht = k === 'truck' ? 38 : k === 'van' ? 32 : k === 'car' ? 24 : 30;
    sp.len = L / 2; sp.ht = ht; sp.w = 24; sp.wheels = k === 'truck' ? [[-L / 2 + 17, R], [L / 2 - 12, R]] : [[-L / 2 + 13, R], [L / 2 - 12, R]]; sp.R = R;
    sp.light = { x: L / 2 - 1, y: -R - 4 };
    sp.back = spr('veB' + k + col, -L / 2 - 6, -ht - 14, L / 2 + 6, 6, g => {
      const hx = L / 2, lx = -L / 2;
      // far wheels
      sp.wheels.forEach(w => { g.drawImage(tyreSpr(R, '#aeb3ba', .55).cv, w[0] - R - 1, -R - 5 - R - 1, 2 * R + 2, 2 * R + 2); });
      const glassOpen = (x, y, w, h, r) => { rrp(g, x, y, w, h, r || 1.5); g.fillStyle = vg(g, y, y + h, '#cfeaf6', '#6fa6c4'); g.fill(); g.strokeStyle = OUT; g.lineWidth = .7; g.stroke(); };
      const bumper = () => { g.fillStyle = '#9ca2aa'; rrp(g, lx - 1.5, -R - 3, 4, 5, 1.5); g.fill(); rrp(g, hx - 2.5, -R - 3, 4, 5, 1.5); g.fill(); };
      if (k === 'pickup') {
        blk(g, lx + 1, -17, 24, 10, 0, col, { r: 1.2 });                                         // bed side
        g.fillStyle = shadeC(col, -.5); rrp(g, lx + 2, -22, 22, 5, 1); g.fill();                  // bed floor in shadow
        blk(g, lx + 1, -19, 24, 3, 4, col, { r: 1 });
        g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(lx + 4, -24.5, 18, 3.5);
        g.fillStyle = '#b08a4f'; rrp(g, lx + 6, -24.8, 9, 5, 1.2); g.fill();                        // hay bale in the bed
        g.strokeStyle = '#7d5f2c'; g.lineWidth = .6; g.beginPath(); g.moveTo(lx + 8, -24.8); g.lineTo(lx + 8, -19.8); g.moveTo(lx + 12, -24.8); g.lineTo(lx + 12, -19.8); g.stroke();
        blk(g, lx + 24, -17, hx - lx - 24, 10, 0, col, { r: 1.2 });                              // hood/body
        blk(g, -3, -24, 21, 8, 5, col, { r: 1.5 });                                               // cab
        glassOpen(-1, -29, 13, 8, 1.5); glassOpen(12.5, -29, 4.5, 7.5, 1);
        g.fillStyle = shadeC(col, -.1); rrp(g, 19, -19, hx - 19, 5, 1.5); g.fill();
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(lx + 2, -17.5, hx - lx - 4, 1);
      } else if (k === 'truck') {
        blk(g, lx + 1, -33, 46, 25, 7, '#e9e6de', { r: 1.5 });                                    // box
        g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(lx + 4, -20, 40, 1); g.fillStyle = col; g.fillRect(lx + 2, -14, 44, 3);
        blk(g, lx + 47, -24, hx - lx - 47, 16, 4, col, { r: 1.5 });                               // cab
        glassOpen(hx - 20, -22, 15, 9, 1.5); glass2(g, hx - 6, -21, 4);
        g.fillStyle = '#2a2d33'; g.fillRect(lx + 1, -9, hx - lx - 2, 3);
      } else if (k === 'van') {
        blk(g, lx + 1, -26, hx - lx - 2, 19, 6, col, { r: 3 });
        glassOpen(hx - 24, -23, 14, 9, 1.5); glassOpen(hx - 9, -22, 6, 8, 1.2); glassOpen(-6, -23, 10, 7, 1.2);
        g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(lx + 3, -12, hx - lx - 6, 1);
      } else {
        blk(g, lx + 1, -13, hx - lx - 2, 9, 0, col, { r: 2 });
        blk(g, -12, -22, 24, 9.5, 4, col, { r: 3 });
        glassOpen(-9.5, -21.5, 10, 7, 1.5); glassOpen(1.5, -21.5, 9, 7, 1.5);
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(lx + 4, -12.4, hx - lx - 8, 1);
      }
      bumper();
      g.fillStyle = '#fff2a8'; g.beginPath(); g.ellipse(hx - 1.5, -R - 5.8, 1.6, 2, 0, 0, TAU); g.fill(); g.strokeStyle = '#7a6a20'; g.lineWidth = .5; g.stroke();
      g.fillStyle = '#e03030'; g.fillRect(lx + 1, -R - 7, 1.4, 3);
      void ht;
    });
    sp.front = spr('veF' + k + col, -L / 2 - 6, -ht - 14, L / 2 + 6, 6, g => {
      sp.wheels.forEach(w => { // wheel arches over the tyre
        g.beginPath(); g.arc(w[0], -R, R + 2, Math.PI * 1.1, Math.PI * 1.9); g.arc(w[0], -R, R + .3, Math.PI * 1.9, Math.PI * 1.1, true); g.closePath(); g.fillStyle = shadeC(col, -.35); g.fill();
      });
    });
    return sp;
  }
  function glass2(g, x, y, w) { }
  A.actors.vehicle = function (c, o, H) {
    const col = vcol(o), E = veh(o.kind, col);
    const x = o.x, gy = o.y + 12, dir = o.dir > 0 ? 1 : -1;

    c.save(); c.translate(x, gy); if (dir < 0) c.scale(-1, 1);
    H.castShadow(c, -E.len, -6, E.len * 2 - 8, 12, E.ht * .55, .16);
    c.restore();
    H.bbAt(c, x, gy, () => {
      c.save(); c.translate(x, gy + Math.sin(o.t * 22 + x) * 0.3); if (dir < 0) c.scale(-1, 1);
      c.drawImage(E.back.cv, E.back.x0, E.back.y0, E.back.w, E.back.h);
      const rot = (x * dir) / E.R;
      for (const w of E.wheels) { const e = tyreSpr(E.R, '#aeb3ba'); c.save(); c.translate(w[0], -E.R); c.rotate(rot); c.drawImage(e.cv, e.x0, e.y0, e.w, e.h); c.restore(); }
      c.drawImage(E.front.cv, E.front.x0, E.front.y0, E.front.w, E.front.h);
      if (night()) { c.globalCompositeOperation = 'lighter'; const g2 = glow(); c.drawImage(g2.cv, E.light.x - 14, E.light.y - 14, 28, 28); c.globalCompositeOperation = 'source-over'; }
      c.restore();
    });
    if (night()) { c.fillStyle = 'rgba(255,235,160,.10)'; c.beginPath(); c.ellipse(x + dir * (E.len + 30), gy, 32, 9, 0, 0, TAU); c.fill(); }
  };
})();

<script>/* ---- art-antiques.js ---- */
/* Kellyville 3D art: the antique store (unbuilt lot with a sign; built false-front shop with porch, windows full of display items,
   upgrade variants, gravel lot, walkways, rusty pickup and a vintage gas pump). Sun in the north-west; shadows fall south-east.
   Hooks: G.WorldArt.structures.antiques = { ground(c, ctx, H), props(ctx, H) }. All randomness is deterministic. */
(function () {
  'use strict';
  const G = window.G; const A = G.WorldArt = G.WorldArt || {};
  A.structures = A.structures || {}; A.terrain = A.terrain || {}; A.actors = A.actors || {};

  const OUT = 'rgba(62,34,14,.88)';
  const SERIF = 'Georgia,"Times New Roman",serif';
  const SANS = 'system-ui,-apple-system,"Segoe UI",sans-serif';
  // ---------------------------------------------------------------- tiny helpers
  const hx = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
  const mix = (a, b, t) => { const x = hx(a), y = hx(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const lit = (a, t) => mix(a, '#ffffff', t), drk = (a, t) => mix(a, '#1a0e00', t);
  const lp = (a, b, t) => a + (b - a) * t;

  function ln(c, H, a, b, col, lw) {
    const p = H.P3(a[0], a[1], a[2]), q = H.P3(b[0], b[1], b[2]);
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.strokeStyle = col; c.lineWidth = lw || 1; c.lineCap = 'round'; c.stroke();
  }
  // rectangle on the vertical plane y (facing south), x0..x1 x z0..z1
  function wp(c, H, x0, x1, y, z0, z1, fill, stroke, lw) { H.poly(c, [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], fill, stroke, lw); }
  function gradV(c, H, y, z0, z1, top, bot) {
    const a = H.P3(0, y, z1)[1], b = H.P3(0, y, z0)[1], g = c.createLinearGradient(0, a, 0, b);
    g.addColorStop(0, top); g.addColorStop(1, bot); return g;
  }
  // upright text on a wall at (xc, zc); fn gets the 2d context in screen-true space
  function wtext(c, H, xc, y, zc, txt, o) {
    o = o || {};
    H.bbAt(c, xc, y, g => {
      const sy = y - zc * H.HZ;
      g.font = (o.w || 800) + ' ' + (o.s || 9) + 'px ' + (o.f || SANS); g.textAlign = 'center'; g.textBaseline = 'middle';
      if (o.ls != null && 'letterSpacing' in g) g.letterSpacing = o.ls + 'px';
      let s = o.s || 9;
      if (o.maxW) { while (g.measureText(txt).width > o.maxW && s > 5) { s -= .5; g.font = (o.w || 800) + ' ' + s + 'px ' + (o.f || SANS); } }
      if (o.shadow) { g.fillStyle = o.shadow; g.fillText(txt, xc + (o.sx == null ? 1 : o.sx), sy + (o.sy == null ? 1.4 : o.sy)); }
      if (o.stroke) { g.lineWidth = o.slw || 2; g.strokeStyle = o.stroke; g.lineJoin = 'round'; g.strokeText(txt, xc, sy); }
      g.fillStyle = o.fg || '#fff'; g.fillText(txt, xc, sy + (o.dy || 0.5));
      if ('letterSpacing' in g) g.letterSpacing = '0px';
    });
  }
  function snowStrip(c, H, x0, x1, y, z, depth, th) { // snow lying on a horizontal ledge
    H.poly(c, [[x0 - 1, y - (depth || 0) - 1, z + (th || 2)], [x1 + 1, y - (depth || 0) - 1, z + (th || 2)], [x1 + 1, y + 1, z + (th || 2)], [x0 - 1, y + 1, z + (th || 2)]], '#f8fbff', 'rgba(140,165,195,.8)', 1);
  }
  function rrFill(c, H, x, y, w, h, r, fill, stroke, lw) { H.rr(c, x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1.4; c.stroke(); } }

  // ---------------------------------------------------------------- geometry
  function geo(ctx, H) {
    const r = ctx.rect, up = ctx.upgrades || {}, lvl = ctx.level || 1, xm = r.x + r.w / 2, bw = 184;
    const sec = !!(up.secondFloor || lvl >= 3), big = !!up.porch;
    const yf = r.y + 98, d = 80;
    return {
      r, xm, bw, x0: xm - bw / 2, x1: xm + bw / 2, yf, d, yb: yf - d, sec, dz: sec ? 32 : 0, FT: 80, S: 86 + (sec ? 32 : 0),
      big, deckD: big ? 30 : 22, deckX0: xm - bw / 2 - (big ? 30 : 20), deckX1: xm + bw / 2 + (big ? 30 : 20),
      work: !!up.workshop, neon: !!up.neonSign, lvl, appraiser: !!up.appraiser
    };
  }
  const WOOD = '#a77a4a', WALL = '#7fa6b2', WALL_D = '#4f7886', TRIM = '#f7ecd0', RUST = '#a4472f';

  // ================================================================ GROUND (baked into terrain tiles)
  function gravelPatch(c, H, P_, x, y, w, h, rad, seed, a) {
    const snow = P_.snow;
    H.rr(c, x - 3, y - 3, w + 6, h + 6, rad + 3); c.fillStyle = snow ? 'rgba(210,222,235,.55)' : 'rgba(90,70,40,.18)'; c.fill();
    H.rr(c, x, y, w, h, rad); c.fillStyle = snow ? 'rgba(238,243,248,.92)' : 'rgba(190,170,138,' + (a || .92) + ')'; c.fill();
    const rn = H.mulberry(seed), n = Math.round(w * h / 90);
    for (let i = 0; i < n; i++) {
      const px = x + 6 + rn() * (w - 12), py = y + 6 + rn() * (h - 12), s = .8 + rn() * 1.5, k = rn();
      c.fillStyle = snow ? (k < .5 ? 'rgba(170,185,205,.55)' : 'rgba(255,255,255,.9)') : (k < .33 ? 'rgba(120,100,72,.55)' : k < .66 ? 'rgba(236,222,196,.85)' : 'rgba(150,134,108,.6)');
      c.beginPath(); c.ellipse(px, py, s * 1.3, s * .8, 0, 0, H.TAU); c.fill();
    }
  }
  function pathStroke(c, H, P_, pts, wd) {
    const snow = P_.snow;
    const run = (lw, col) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); };
    run(wd + 5, snow ? 'rgba(160,178,200,.65)' : 'rgba(80,58,30,.38)');
    run(wd + 1.5, snow ? '#d8e2ee' : '#a89574');
    run(wd - 3, snow ? '#f1f5fa' : '#d3bf98');
    // pebbles
    const rn = H.mulberry(Math.round(pts[0][0] * 7 + pts[0][1]));
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.round(L * wd / 70);
      for (let i = 0; i < n; i++) {
        const t = rn(), px = lp(a[0], b[0], t) + (rn() - .5) * (wd - 6), py = lp(a[1], b[1], t) + (rn() - .5) * (wd - 6);
        c.fillStyle = snow ? 'rgba(150,170,195,.5)' : (rn() < .5 ? 'rgba(112,92,62,.5)' : 'rgba(250,240,215,.8)');
        c.beginPath(); c.ellipse(px, py, 1.4, .9, 0, 0, H.TAU); c.fill();
      }
    }
  }

  function groundBuilt(c, ctx, H) {
    const g = geo(ctx, H), P_ = ctx.P_, r = g.r, snow = !!P_.snow, rn = H.mulberry(77);
    const { x0, x1, xm, yf, yb } = g;
    // wide gravel lot with a grassy fringe
    gravelPatch(c, H, P_, 612, r.y + 14, 388, 176, 26, 11, .82);
    gravelPatch(c, H, P_, 640, r.y + 26, 340, 168, 22, 12, .5);
    // walkways: from the road on both sides, then along the front to the door
    const fy = yf + 46;
    pathStroke(c, H, P_, [[632, r.y - 20], [632, fy - 14], [650, fy], [xm - 30, fy], [xm, yf + 36]], 26);
    pathStroke(c, H, P_, [[980, r.y - 20], [980, fy - 14], [962, fy], [xm + 30, fy], [xm, yf + 36]], 26);
    pathStroke(c, H, P_, [[xm, yf + g.deckD + 6], [xm, yf + 40]], 22);
    // stepping stones from the west walk toward the lean-to / building side
    // deck planks
    const dx0 = g.deckX0, dx1 = g.deckX1, dy0 = yf - 2, dy1 = yf + g.deckD;
    c.fillStyle = 'rgba(25,15,0,.3)'; c.fillRect(dx0 - 1, dy1 + 1, dx1 - dx0 + 2, 5);       // front lip shadow
    c.fillStyle = drk('#8a5f35', .1); c.fillRect(dx0, dy1 - 1, dx1 - dx0, 4);              // front fascia of the deck
    c.fillStyle = '#c59b66'; c.fillRect(dx0, dy0, dx1 - dx0, dy1 - dy0 - 1);
    for (let y = dy0 + 4; y < dy1 - 1; y += 4.5) { c.fillStyle = 'rgba(70,40,15,.28)'; c.fillRect(dx0, y, dx1 - dx0, 1); c.fillStyle = 'rgba(255,235,200,.18)'; c.fillRect(dx0, y + 1, dx1 - dx0, 1); }
    for (let y = dy0; y < dy1 - 4; y += 4.5) for (let x = dx0 + 8 + rn() * 30; x < dx1 - 4; x += 28 + rn() * 40) { c.fillStyle = 'rgba(70,40,15,.3)'; c.fillRect(x, y, 1, 4.5); }
    c.strokeStyle = OUT; c.lineWidth = 1.2; c.strokeRect(dx0, dy0, dx1 - dx0, dy1 - dy0 - 1);
    // steps down to the walk
    for (let i = 0; i < 2; i++) { c.fillStyle = i ? '#b08550' : '#c9a06b'; c.fillRect(xm - 20 + i * 2, dy1 + i * 5, 40 - i * 4, 5); c.strokeStyle = OUT; c.lineWidth = 1; c.strokeRect(xm - 20 + i * 2, dy1 + i * 5, 40 - i * 4, 5); }
    if (snow) {
      for (let i = 0; i < 14; i++) { const sx = dx0 + 4 + rn() * (dx1 - dx0 - 20), sy = dy0 + 6 + rn() * (dy1 - dy0 - 14); c.fillStyle = 'rgba(250,252,255,.9)'; c.beginPath(); c.ellipse(sx, sy, 7 + rn() * 9, 2 + rn() * 2, 0, 0, H.TAU); c.fill(); }
    }
    // cast shadows (sun in the north-west)
    const top = g.S + 40;
    H.castShadow(c, g.x0, g.yb, g.bw, g.d, top * .62, .2);
    H.castShadow(c, g.x0 + 6, yf - 4, g.bw - 12, 6, top * .5, .12);
    // portico shadow on the deck
    H.castShadow(c, xm - 50, yf + 12, 100, 2, 66, .15);
    if (g.work) H.castShadow(c, 660, yf - 52, 48, 44, 40, .22);
    // pickup + pump contact shadows
    H.castShadow(c, 930, yf - 62, 30, 56, 20, .22);
    H.castShadow(c, 940, yf + 20, 14, 8, 30, .22);
    // rocks, weeds and rusty bits in the lot
    for (let i = 0; i < 16; i++) {
      const px = 618 + rn() * 376, py = r.y + 20 + rn() * 160;
      if (px > x0 - 14 && px < x1 + 14 && py < yf + 36) continue;
      if (px > 622 && px < 646) continue; if (px > 968 && px < 992) continue;
      c.fillStyle = snow ? 'rgba(235,240,246,.95)' : 'rgba(120,108,92,.8)'; c.beginPath(); c.ellipse(px, py, 3 + rn() * 2, 2 + rn(), 0, 0, H.TAU); c.fill();

    }

    }
  }

  function groundUnbuilt(c, ctx, H) {
    const r = ctx.rect, P_ = ctx.P_, snow = !!P_.snow, xm = r.x + r.w / 2;
    gravelPatch(c, H, P_, r.x + 24, r.y + 40, r.w - 48, r.h - 36, 18, 21, .55);
    // staked-out footprint
    c.setLineDash([8, 6]); c.lineWidth = 2.2; c.strokeStyle = 'rgba(255,255,255,.92)'; H.rr(c, xm - 100, r.y + 30, 200, 82, 8); c.stroke(); c.setLineDash([]);
    c.strokeStyle = '#e24a3a'; c.lineWidth = 1.3; c.beginPath(); c.rect(xm - 96, r.y + 34, 192, 74); c.stroke();
    // worn path from the walk-up point
    pathStroke(c, H, P_, [[xm, r.y + 118], [xm, r.y + 150]], 22);
    H.castShadow(c, xm - 56, r.y + 96, 5, 5, 28, .2); H.castShadow(c, xm + 52, r.y + 96, 5, 5, 28, .2);
  }

  // ================================================================ small props (drawn inside bodies)
  function post(c, H, x, y, h, col) { H.box(c, x - 2.5, y - 2.5, 5, 5, h, { top: lit(col || WOOD, .3), front: col || WOOD, stroke: OUT, lw: 1 }); }

  function wagonWheel(c, H, x, y, R, rot, snow) { // leaning wheel, faces the camera
    H.bbAt(c, x, y, g => {
      g.save(); g.translate(x, y - R * .85); g.rotate(rot);
      g.fillStyle = 'rgba(30,15,0,.28)'; g.beginPath(); g.ellipse(2, R * .85, R * .8, 3, 0, 0, H.TAU); g.fill();
      g.beginPath(); g.arc(0, 0, R, 0, H.TAU); g.strokeStyle = OUT; g.lineWidth = 6.2; g.stroke();
      g.strokeStyle = '#8e6a3f'; g.lineWidth = 4.2; g.stroke();
      g.beginPath(); g.arc(0, 0, R - 2.4, 0, H.TAU); g.strokeStyle = '#50433a'; g.lineWidth = 1.2; g.stroke();
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(Math.cos(a) * 3, Math.sin(a) * 3); g.lineTo(Math.cos(a) * (R - 2), Math.sin(a) * (R - 2)); g.strokeStyle = OUT; g.lineWidth = 3; g.stroke(); g.strokeStyle = '#b98d55'; g.lineWidth = 1.7; g.stroke(); }
      g.beginPath(); g.arc(0, 0, 4, 0, H.TAU); g.fillStyle = '#7a5530'; g.fill(); g.strokeStyle = OUT; g.lineWidth = 1.3; g.stroke();
      g.beginPath(); g.arc(0, 0, 1.5, 0, H.TAU); g.fillStyle = '#2e2218'; g.fill();
      if (snow) { g.beginPath(); g.arc(0, 0, R + .5, Math.PI * 1.15, Math.PI * 1.85); g.strokeStyle = '#f8fbff'; g.lineWidth = 3; g.stroke(); }
      g.restore();

<script>/* ---- ui.js ---- */
/* ui.js — Kellyville UI: rendering, input, toasts, modals, atmosphere. */
(function () {

    mk('l-hail', 22, () => { const e = document.createElement('i'); e.style.left = rnd(0, 120) + '%'; e.style.animationDuration = rnd(.7, 1.1) + 's'; e.style.animationDelay = -rnd(0, 1) + 's'; return e; });
    mk('l-snow', 30, () => { const e = document.createElement('i'); const s = rnd(4, 9); e.style.width = e.style.height = s + 'px'; e.style.left = rnd(0, 100) + '%'; e.style.animationDuration = rnd(5, 10) + 's'; e.style.animationDelay = -rnd(0, 8) + 's'; return e; });
    mk('l-frost', 16, i => { const e = document.createElement('b'); e.textContent = i % 3 ? '✦' : '❄'; e.style.left = rnd(2, 94) + '%'; e.style.top = rnd(4, 90) + '%'; e.style.fontSize = rnd(12, 26) + 'px'; e.style.animationDelay = -rnd(0, 2) + 's'; e.style.animationDuration = rnd(1.4, 3) + 's'; return e; });
  }
  function updateFX() {

  // ---------- Farm ----------
  function plotHTML(p, i) {

  function penHTML(a, i) {

  // ---------- Orders ----------
  function ordersList() { try { return (G.Economy && G.Economy.orders && G.Economy.orders()) || []; } catch (e) { return []; } }
  function canFul(o) { try { if (G.Economy && G.Economy.canFulfill) return !!G.Economy.canFulfill(o.id); } catch (e) { } return G.hasItems(o.items); }
  const isSlotCool = o => !Object.keys(o.items || {}).length || (o.cooldownUntil && o.cooldownUntil > Date.now());
  function orderHTML(o) {

    return `<div class="order ${exp ? 'express' : ''} ${can ? 'can' : ''}">${exp ? `<span class="o-exp">⚡ <span ${tm('txt', 0, o.expiresAt)}></span></span>` : ''}

  // ---------- Shop ----------
  const TAGINFO = { irrigation: '💧 Protects vs drought & heat', windbreak: '🌲 Less wind & dust damage', frost_fans: '🌀 Frost protection', beehives: '🐝 Pollination boost', firebreak: '🚒 Wildfire protection', cold_storage: '🧊 Price-crash shield' };
  function catalog() {
    let c = null; try { c = G.Economy && G.Economy.shopCatalog && G.Economy.shopCatalog(); } catch (e) { }
    if (c) return c;
    const mk = cat => Object.keys(D()[cat] || {}).map(key => ({ key, def: D()[cat][key] })).sort((a, b) => (a.def.level || 1) - (b.def.level || 1));
    return { animals: mk('animals'), buildings: mk('buildings'), expansions: mk('expansions'), plot: { cost: G.plotCost(), available: S().plots.length < S().maxPlots } };
  }
  function shopCard(e, kind) {
    const s = S(), d = e.def || {}, lvl = d.level || 1, key = e.key;
    let owned = false, count = 0, maxed = false, locked = s.level < lvl, need = '';
    if (kind === 'animals') { count = s.animals.filter(a => a.type === key).length; maxed = count >= (d.max || 6); }
    else if (kind === 'buildings') owned = s.buildings.some(b => b.type === key);
    else { owned = G.hasExpansion(key); if (d.requires && !G.hasExpansion(d.requires)) { locked = locked || false; need = (dget('expansions', d.requires) || {}).name || d.requires; } }
    const tags = [];
    if (kind === 'animals') { tags.push(`<span class="tag">${esc(iEmoji(d.product))} ${esc(iName(d.product))} / ${fmtT(d.produceSec)}</span>`, `<span class="tag">Eats ${d.feedQty || 1}× ${esc(iEmoji(d.feed))}</span>`, `<span class="tag">${count}/${d.max || 6} owned</span>`); }
    if (kind === 'buildings') { const outs = (d.recipes || []).slice(0, 6).map(r => esc(iEmoji(r.output))).join(' '); tags.push(`<span class="tag">${(d.recipes || []).length} recipes</span>`); if (outs) tags.push(`<span class="tag">${outs}</span>`); }
    if (kind === 'upgrades') { if (d.barnCap) tags.push(`<span class="tag">🏚️ +${d.barnCap} barn space</span>`); if (d.maxPlots) tags.push(`<span class="tag">🟫 +${d.maxPlots} plot limit</span>`); if (d.tag && TAGINFO[d.tag]) tags.push(`<span class="tag">${esc(TAGINFO[d.tag])}</span>`); }
    let act;
    if (owned) act = '<span class="owned">✓ Owned</span>';
    else if (maxed) act = '<span class="owned">Max</span>';
    else if (s.level < lvl) act = `<span class="lockpill">🔒 Lv ${lvl}</span>`;
    else if (need) act = `<span class="lockpill" style="font-size:11px">Needs ${esc(need)}</span>`;
    else act = `<button class="btn btn-gold sm ${s.coins < d.cost ? 'poor' : ''}" data-act="buy" data-kind="${kind}" data-key="${esc(key)}">🪙 ${fmt(d.cost)}</button>`;
    const lock = (s.level < lvl) || (!!need && !owned);
    return `<div class="shop-card ${lock ? 'locked' : ''}"><div class="sc-e">${esc(d.emoji || '📦')}</div><div class="sc-m"><b>${esc(d.name || key)}</b><small>${esc(d.desc || '')}</small><div class="sc-tags">${tags.join('')}</div></div><div class="sc-act">${act}</div></div>`;
  }
  function renderShop() {
    $$('#shop-seg button').forEach(b => b.classList.toggle('on', b.dataset.v === UI.shopTab));

      h = [`<div class="shop-card"><div class="sc-e">🟫</div><div class="sc-m"><b>New field plot</b><small>More land means more crops. You own ${s.plots.length} of ${s.maxPlots} possible plots. Upgrades can raise the limit.</small><div class="sc-tags"><span class="tag">${s.plots.length}/${s.maxPlots} plots</span></div></div><div class="sc-act">${avail ? `<button class="btn btn-gold sm ${s.coins < cost ? 'poor' : ''}" data-act="buy" data-kind="land" data-key="plot">🪙 ${fmt(cost)}</button>` : '<span class="lockpill">Max land</span>'}</div></div>`];

  // ---------- Barn ----------
  function trendDir(key) {
    let t; try { t = G.Economy && G.Economy.trend && G.Economy.trend(key); } catch (e) { }
    let d = 0;
    if (typeof t === 'string') d = /up|rise|\+|▲|↑/i.test(t) ? 1 : /down|fall|-|▼|↓/i.test(t) ? -1 : 0;
    else if (typeof t === 'number') d = t >= .5 ? (t > 1.04 ? 1 : t < .96 ? -1 : 0) : (t > .03 ? 1 : t < -.03 ? -1 : 0);
    if (!d && G.mods) { const m = G.mods.price(key); d = m > 1.04 ? 1 : m < .96 ? -1 : 0; }
    return d;
  }
  function renderBarn() {
    const s = S(), cnt = G.barnCount(), cap = s.barnCap, pct = clamp(cnt / cap * 100, 0, 100);
    const f = $('#barn-fill'); if (f) { f.style.width = pct + '%'; f.className = pct >= 100 ? 'full' : pct >= 75 ? 'warn' : ''; }
    setText($('#barn-cap-txt'), `${cnt}/${cap} stored`);

    const items = Object.entries(s.barn).filter(([, q]) => q > 0).sort((a, b) => iName(a[0]).localeCompare(iName(b[0])));

      const d = trendDir(k), p = G.sellPrice(k);
      return `<div class="item"><div class="it-top"><div class="it-e">${esc(iEmoji(k))}<span class="it-q">${q}</span></div><div class="it-m"><b>${esc(iName(k))}</b><div class="it-p">🪙 ${p} <span class="${d > 0 ? 'tr-up' : d < 0 ? 'tr-down' : 'tr-flat'}">${d > 0 ? '▲' : d < 0 ? '▼' : '▬'}</span></div></div></div>
      <div class="it-btns"><button class="btn btn-gold sm" data-act="sell" data-key="${esc(k)}" data-n="1">Sell 1</button><button class="btn btn-green sm" data-act="sell" data-key="${esc(k)}" data-n="all">All +${fmt(p * q)}</button></div></div>`;
    });
    if (!h.length) h.push('<div class="empty-note">The barn is empty. Harvest some crops! 🌾</div>');
    patchChildren($('#barn-grid'), h);
  }

  }
  function queueRender() {
    if (UI.pending) return; UI.pending = true;
    requestAnimationFrame(() => { UI.pending = false; try { renderAll(); } catch (e) { console.error('[ui render]', e); } });
  }

  // ---------- timers ----------
  function updateTimers(now) {
    now = now || Date.now();
    $$('[data-tm]').forEach(el => {
      const t = el.dataset.tm, end = +el.dataset.end, start = +el.dataset.start || 0;
      if (t === 'bar') {
        const w = clamp(end > start ? (now - start) / (end - start) * 100 : 100, 0, 100).toFixed(1) + '%';
        if (el._w !== w) { el.style.width = w; el._w = w; }
      } else if (t === 'txt') {
        const left = (end - now) / 1000; let s;
        if (start && now < start) s = 'Queued'; else s = left <= 0 ? (el.dataset.done || 'Done') : fmtT(left);
        s = (el.dataset.pre || '') + s;
        if (el.textContent !== s) el.textContent = s;
      } else if (t === 'crop') {
        const prog = clamp((now - start) / Math.max(1, end - start), 0, 1), st = prog < .3 ? 0 : 1;
        const em = st ? el.dataset.emoji : '🌱';
        if (el.textContent !== em) el.textContent = em;
        const sc = (st ? .6 + .5 * ((prog - .3) / .7) : .75 + prog * .5).toFixed(2);
        if (el._s !== sc) { el.style.transform = `scale(${sc})`; el._s = sc; }
      }
    });
  }
  function tickChecks(now) {
    const bs = S().buildings.map(b => b.queue.filter(j => j.readyAt <= now).length).join('');

      if (!(ART().structures || {}).barn) glow(Z.barn.x * T + 3 * T - 6, legacyY((Z.barn.y + 5) * T, (Z.barn.y + 5) * T - 20), 50, 'rgba(255,200,100,.35)');
      if (standBuilt()) glow((Z.stand.x + 2.5) * T, (Z.stand.y + 1) * T, 70, 'rgba(255,200,110,.5)');
      glow(P.x * T, P.y * T - lift(10), 46, 'rgba(255,230,160,.28)');
      c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    }
  }
  function drawSnow(c, t, vw, vh) {
    c.fillStyle = 'rgba(255,255,255,.85)';
    snow.forEach(f => { const x = V.camX + ((f.x * vw + Math.sin(t * .8 + f.p) * 14 + t * 6 * f.s) % vw + vw) % vw, y = V.camY + ((f.y * vh + t * 24 * f.s) % vh); c.beginPath(); c.arc(x, y, 1.4 + f.s * 1.1, 0, TAU); c.fill(); });
  }

  // ---------------------------------------------------------------- sizing + loop
  function resize() {
    const app = el('app'), hud = el('hud'), tb = el('tabbar'); if (!app || !V.box) return;
    const ar = app.getBoundingClientRect(), top = hud ? Math.round(hud.getBoundingClientRect().bottom) - 14 : 100, bottom = tb ? tb.getBoundingClientRect().top + 6 : innerHeight - 70;
    const hudBottom = hud ? hud.getBoundingClientRect().bottom : 100;
    V.box.style.left = ar.left + 'px'; V.box.style.width = ar.width + 'px'; V.box.style.top = Math.round(hudBottom - 8) + 'px'; V.box.style.height = Math.max(120, Math.round(bottom - (hudBottom - 8))) + 'px';
    const nd = Math.min(clamp(window.devicePixelRatio || 1, 1, 3), V.dprCap || 3);
    if (nd !== V.dpr) { V.dpr = nd; V.zoom = Math.round(V.zoom * nd * CH / 4) * 4 / (nd * CH); }
    V.cssW = V.box.clientWidth; V.cssH = V.box.clientHeight;
    const w = Math.round(V.cssW * V.dpr), h = Math.round(V.cssH * V.dpr);
    if (V.cv.width !== w || V.cv.height !== h) { V.cv.width = w; V.cv.height = h; }
    V.ctx.imageSmoothingEnabled = true; V.ctx.imageSmoothingQuality = 'high';
    clampCam(true);
  }
  // Adaptive resolution: a 3x phone that can't hold ~45 fps drops the farm canvas to 2x (hard to tell apart on such dense
  // screens); after a long smooth stretch it tries full resolution again, and stays at 2x if that stutters too.
  const AQ = { ema: 1 / 60, slow: 0, fast: 0, tries: 0 };
  function adaptQuality(dt) {
    if (pinch || dt > 0.2) return;                       // ignore tab switches / pinch
    AQ.ema += (dt - AQ.ema) * 0.08;
    const dev = clamp(window.devicePixelRatio || 1, 1, 3);
    if (AQ.ema > 0.024 && V.dpr > 2) { AQ.slow += dt; if (AQ.slow > 1.5) { V.dprCap = 2; AQ.slow = 0; AQ.fast = 0; AQ.tries++; resize(); } } else AQ.slow = 0;
    if (V.dprCap && dev > V.dprCap && AQ.ema < 0.0175 && AQ.tries < 2) { AQ.fast += dt; if (AQ.fast > 12) { V.dprCap = 0; AQ.fast = 0; resize(); } } else AQ.fast = 0;
  }
  function frame(ts) {
    V.raf = 0; if (!V.run) return;
    const dt = Math.min(0.05, Math.max(0.001, (ts - V.last) / 1000 || 0.016)); V.last = ts; V.t += dt; V.dt = dt;
    try { update(dt); render(); } catch (e) { console.error('[world frame]', e); }
    adaptQuality(dt);
    V.raf = requestAnimationFrame(frame);
  }
  function setRunning(on) {
    if (on && !V.run) { V.run = true; V.last = performance.now(); resize(); checkLayout(); clampCam(true); V.raf = requestAnimationFrame(frame); }
    else if (!on && V.run) { V.run = false; if (V.raf) cancelAnimationFrame(V.raf); V.raf = 0; IN.jx = IN.jy = 0; IN.keys = {}; IN.joy = null; ptrs.clear(); pinch = null; showJoy(false); }
  }
  function syncVisible() {
    if (!V.ready) return;
    const on = safe(() => G.uikit.tab(), 'farm') === 'farm' && !S().flags['world.list'];
    V.box.hidden = !on;
    setRunning(on && !document.hidden);
  }

  // ---------------------------------------------------------------- helper kit handed to art modules (src/art-*.js)
  const Hx = {
    T, W, H, F, HZ, TAU, Z, PAL, POND, TABLE_XS, TABLE_YS, ROAD0, ROAD1, PEN_POS, PASTURE_GATE, DECOR_TREES, SPAWN, SUN,
    lift, P3, bbAt, poly, box, cyl, castShadow, light, em, emStatic, plate, rr, shade, shadow, tree, fence, fenceRect, gatePosts, star, bubble,
    hash, mulberry, clamp, lerp, ease, S, iEmoji, iName, vis,
    plotRect: i => plotRect(i), buildingSlot: i => buildingSlot(i), layout: () => L, standBuilt, restStage, tableCount, hasTractor, equipped, driving, avatarEm: () => avatarEm(),
    upright: () => BB > 0, antiquesOn: () => antiquesOn(), APIARY_SLOTS, apiaryHives: () => apiaryHives(), apiaryOn: () => apiaryOn(),
    legacy: { paintBarn, paintHouse, paintShed, paintStall, paintCoop, paintOrders, paintBuilding, paintLot, paintPen, paintPasture, paintRestaurant, paintGround, paintHills, paintPaths, paintRoad, paintPlots, paintPond, paintTreeLine, paintDecor, paintPivotTrack, drawTractor: (c, x, y, dir, def, t, moving, withDriver) => drawTractor(c, x, y, dir, def, t, moving, withDriver) }
  };
  G.WorldArtKit = Hx;

  // ---------------------------------------------------------------- public API
  G.World = {
    goTo: id => goToZone(id),
    zones: () => ZONE_ORDER.map(id => ({ id, label: Z[id].label, emoji: Z[id].emoji, x: Z[id].pt[0], y: Z[id].pt[1] })),
    player: () => ({ x: P.x, y: P.y, dir: P.dir, moving: P.moving, driving: driving(), walking: !!P.path }),
    enabled: () => V.ready,
    playerRect: () => { if (!V.ready || V.box.hidden) return null; const r = V.box.getBoundingClientRect(); return { left: r.left + (P.x * T - V.camX) * V.zoom - 10, top: r.top + (P.y * T - V.camY) * V.zoom * F - 30, width: 20, height: 20 }; },
    plotRect: i => { if (!V.ready || V.box.hidden) return null; const q = plotRect(i), r = V.box.getBoundingClientRect(); return { left: r.left + (q.x * T - V.camX) * V.zoom, top: r.top + (q.y * T - V.camY) * V.zoom * F, width: q.w * T * V.zoom, height: q.h * T * V.zoom * F }; },
    teleport: (x, y) => { P.x = x; P.y = y; P.path = null; clampCam(true); },   // test/debug helper
    setZoom,
    repaint: () => { cacheSig = ''; tiles.clear(); propCv.clear(); },   // art modules / tests: force a full redraw
    _v: V
  };

  // ---------------------------------------------------------------- init
  function init() {
    V.box = el('world'); V.cv = el('w-cv');
    if (!V.box || !V.cv || !V.cv.getContext) return;
    V.ctx = V.cv.getContext('2d', { alpha: false });
    if (!V.ctx) return;
    const z = S().flags['world.zoom']; V.zoom = clamp(+z || 0.9, 0.7, 1.5); V.dpr = clamp(window.devicePixelRatio || 1, 1, 3); V.zoom = Math.round(V.zoom * V.dpr * CH / 4) * 4 / (V.dpr * CH);
    bindInput();
    V.ready = true;
    const bus = (n, f) => G.bus.on(n, p => { try { f(p); } catch (e) { console.error('[world]', n, e); } });
    bus('tab', syncVisible);
    bus('harvested', p => {
      const q = plotRect(p.plotIdx), x = q.x + 1, y = q.y + 1;
      floatText(x, y - 0.4, `+${p.n} ${iEmoji(p.cropKey)}`, '#fff3b0');
      burst(x * T, y * T, ['#ffe27a', '#8be05a', '#fff'], 14);
    });
    bus('collected', p => {
      const o = lastAct || { x: P.x, y: P.y - 0.6 };
      floatText(o.x, o.y - 0.3, `+${p.n} ${iEmoji(p.key)}`, '#fff3b0'); burst(o.x * T, (o.y + 0.5) * T, ['#ffe27a', '#fff'], 8);
    });
    bus('planted', p => { const q = plotRect(p.plotIdx); burst((q.x + 1) * T, (q.y + 1) * T, ['#a9743a', '#7b4d26', '#8be05a'], 10); });
    bus('state:reset', () => { P.x = SPAWN[0]; P.y = SPAWN[1]; P.path = null; floats.length = 0; wander.clear(); npcPaths.clear(); cacheSig = ''; clampCam(true); });
    bus('drive:stop', () => { P.path = null; });
    bus('expansion', () => { cacheSig = ''; });
    bus('apiary:change', () => { cacheSig = ''; });
    bus('antiques:change', () => { cacheSig = ''; });
    bus('change', () => { hintT = 0; });
    document.addEventListener('visibilitychange', syncVisible);
    addEventListener('resize', () => { resize(); });
    if (window.ResizeObserver) { try { new ResizeObserver(() => { if (V.run) resize(); }).observe(el('hud')); } catch (e) { } }
    // re-run the tab logic so the Farm tab switches from the list grid to the world
    G.uikit.showTab(G.uikit.tab());
    resize(); clampCam(true);
    syncVisible();
  }
  G.bus.on('init', function () { try { init(); } catch (e) { console.error('[world init]', e); V.ready = false; } });
})();

</script>
