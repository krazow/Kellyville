    } else return false;
    bump(); return true;
  }
  function startReno() {
    const r = R_(); if (!r || r.stage !== 'permit' || r.permit.step !== 'approved') return false;
    if (!G.spend(BUILD_COST)) return false;
    const t = nowMs();
    r.stage = 'building'; r.permit.step = 'built'; r.permit.buildStart = t; r.permit.buildEnd = t + BUILD_MS;
    modal({ emoji: '🔨', title: 'Barn conversion underway',
      html: bubble('darlene', 'Inspection passed. Barely. The septic guy said "huh" twice, which is the best review he has ever given.') +
        bubble('you', 'Time to swap the lambing pens for a pass, a stove, and a very small chalkboard.'),
      buttons: [{ label: 'Grab a hammer', cls: 'btn-gold' }] });
    bump(); return true;
  }
  function grandOpening() {
    const r = R_(); if (!r) return;
    r.stage = 'open'; r.permit.step = 'built'; r.tab = tab = 'menu';
    modal({ emoji: '🎉', title: 'Grand Opening!', kind: 'good', confetti: true,
      html: bubble('darlene', 'By the power vested in me by Whitman County, I declare this barn... a restaurant. Please validate my parking.') +
        bubble('clip', 'I will be reviewing the lentil burger. Strictly for... compliance.'),
      buttons: [{ label: 'Open the barn doors', cls: 'btn-gold', onClick: () => { try { G.openPanel('restaurant'); } catch (e) { /* ignore */ } } }] });
    say('🍽️ The Lambing Barn is open for business!', 'good');
    bump();
  }

  // ---------- kitchen ----------
  function missing(d) { return Object.entries(d.inputs).filter(([k, q]) => !known(k) || G.qty(k) < q).map(([k]) => k); }
  function cookBlock(d) {
    const r = R_();
    if (!r || r.stage !== 'open') return 'The restaurant is not open yet';
    if ((G.state.level || 1) < d.level) return d.name + ' unlocks at level ' + d.level;
    if (r.queue.length >= stoves()) return 'All stoves are busy';
    const pend = r.queue.filter(j => j.id === d.id).length;
    if ((r.pass[d.id] || 0) + pend * PORTIONS >= passCap()) return 'The pass is full of ' + d.name;
    if (missing(d).length) return 'Need ingredients: ' + missing(d).map(k => itemInfo(k).name).join(', ');
    return '';
  }
  function cook(id) {
    const r = R_(), d = dishOf(id); if (!r || !d) return false;
    const why = cookBlock(d); if (why) { say(why, 'bad'); return false; }
    if (!G.removeItems(d.inputs)) return false;
    const t = nowMs(), sec = d.cookSec * (r.staff.cook ? 0.7 : 1);
    r.queue.push({ id, startAt: t, readyAt: t + sec * 1000 });
    bump(); return true;
  }
  function cancelCook(i) {
    const r = R_(); const j = r && r.queue[i]; if (!j) return false;
    const d = dishOf(j.id); r.queue.splice(i, 1);
    if (d) Object.entries(d.inputs).forEach(([k, q]) => { try { G.addItem(k, q); } catch (e) { /* ignore */ } });
    bump(); return true;
  }
  function collectCooked(t) {
    const r = R_(); if (!r || !r.queue.length) return;
    let changed = false;
    for (let i = r.queue.length - 1; i >= 0; i--) {
      const j = r.queue[i]; if (j.readyAt > t) continue;
      r.queue.splice(i, 1); const d = dishOf(j.id); if (!d) continue;
      r.pass[d.id] = Math.min(passCap(), (r.pass[d.id] || 0) + PORTIONS);
      try { G.addXP(d.xp); } catch (e) { /* ignore */ }
      say(d.emoji + ' ' + d.name + ' is ready on the pass (×' + PORTIONS + ')', 'good');
      changed = true;
    }
    if (changed) bump();
  }

  // ---------- menu ----------
  function toggleMenu(id) {
    const r = R_(), d = dishOf(id); if (!r || !d) return false;
    const i = r.menu.indexOf(id);
    if (i >= 0) {
      if (r.service) { say('Menu is locked while service is running', 'bad'); return false; }
      r.menu.splice(i, 1); bump(); return true;
    }
    if (r.service) { say('Menu is locked while service is running', 'bad'); return false; }
    if ((G.state.level || 1) < d.level) { say(d.name + ' unlocks at level ' + d.level, 'bad'); return false; }
    if (r.farmOnly && farmCount(d) < 1) { say('Farm rule: every dish needs one of your own products', 'bad'); return false; }
    if (r.menu.length >= menuCap()) { say('Menu is full (' + menuCap() + '). Upgrade the chalkboard for more.', 'bad'); return false; }
    r.menu.push(id); bump(); return true;
  }

  // ---------- upgrades & staff ----------
  function buyUpgrade(k) {
    const r = R_(), u = UPGRADES[k]; if (!r || !u || r.stage !== 'open') return false;
    const n = r.up[k];
    if (n >= u.max) { say('Already maxed out', 'bad'); return false; }
    if ((G.state.level || 1) < u.level) { say(u.name + ' unlocks at level ' + u.level, 'bad'); return false; }
    if (!G.spend(u.cost(n))) return false;
    r.up[k] = n + 1; say(u.emoji + ' ' + u.name + ' installed!', 'good'); bump(); return true;
  }
  function toggleStaff(k) {
    const r = R_(); if (!r || !STAFF[k] || r.stage !== 'open') return false;
    if (r.service) { say('Staff changes after service', 'bad'); return false; }
    r.staff[k] = !r.staff[k]; say(STAFF[k].emoji + ' ' + STAFF[k].name + (r.staff[k] ? ' hired' : ' let go'), 'info'); bump(); return true;
  }
  const wageTotal = () => { const r = R_(); return r ? Object.keys(STAFF).reduce((s, k) => s + (r.staff[k] ? WAGES[k] : 0), 0) : 0; };

  // ---------- service ----------
  const GUESTS = ['🧑', '👩', '👨', '🧓', '👵', '👴', '🧔', '👱‍♀️', '👩‍🦰', '🧑‍🦱', '👩‍🦳', '🤠'];
  const mult = () => {
    const r = R_();
    let m = (0.7 + 0.18 * r.rating) * (1 + 0.25 * (r.staff.host ? 1 : 0)) * (1 + 0.12 * r.up.parking) * (1 + 0.1 * r.up.lights);
    if (featureActive()) m *= 1.4;
    if (r.noiseUntil > nowMs()) m *= 0.85;
    return m;
  };
  const gap = () => 9500 / Math.max(0.3, mult()) * rnd(0.6, 1.4);
  function startService() {
    const r = R_();
    if (!r || r.stage !== 'open') return false;
    if (r.service) return false;
    const t = nowMs();
    if (r.cooldownUntil > t) { say('The kitchen is resting for ' + fmtT((r.cooldownUntil - t) / 1000), 'bad'); return false; }
    if (!r.menu.length) { say('Put a dish on tonight\'s menu first', 'bad'); return false; }
    if (!r.menu.some(id => (r.pass[id] || 0) > 0)) { say('Prep some dishes onto the pass first', 'bad'); return false; }
    r.service = { startAt: t, endAt: t + SERVICE_MS, nextArrival: t + 1500, guests: [], nextId: 1, covers: 0, revenue: 0, tips: 0, unhappy: 0, away: 0, orders: {}, ratingStart: r.rating };
    say('🔔 Dinner service is open!', 'good'); bump(); return true;
  }
  function pickDish(r) {
    const stocked = r.menu.filter(id => (r.pass[id] || 0) > 0);
    if (stocked.length && Math.random() < 0.75) return U.pick ? U.pick(stocked) : stocked[0];
    return r.menu[Math.floor(Math.random() * r.menu.length)];
  }
  function occupied(sv) {
    const o = {}; sv.guests.forEach(g => { if (g.phase !== 'leaving' && g.table != null) o[g.table] = true; }); return o;
  }
  function spawn(r, sv, at) {
    const occ = occupied(sv), n = tablesCount(); let table = -1;
    const free = []; for (let i = 0; i < n; i++) if (!occ[i]) free.push(i);
    if (!free.length) { sv.away++; return; }
    table = free[Math.floor(Math.random() * free.length)];
    sv.guests.push({ id: sv.nextId++, emoji: GUESTS[Math.floor(Math.random() * GUESTS.length)], phase: 'arriving', pStart: at, pEnd: at + 3000, table, dish: null, serve: false, mood: 'meh' });
  }
  function advance(r, sv, g) {
    const srv = r.staff.server;
    if (g.phase === 'arriving') {
      g.phase = 'seated'; g.pStart = g.pEnd; g.pEnd = g.pStart + rnd(4000, 7000) * (srv ? 0.6 : 1);
      g.dish = pickDish(r);
      if (g.dish && (r.pass[g.dish] || 0) > 0) { r.pass[g.dish]--; if (r.pass[g.dish] <= 0) delete r.pass[g.dish]; g.serve = true; }
    } else if (g.phase === 'seated') {
      g.pStart = g.pEnd;
      if (g.serve) { g.phase = 'eating'; g.pEnd = g.pStart + rnd(10000, 16000) * (srv ? 0.85 : 1); g.mood = 'happy'; }
      else {
        g.phase = 'leaving'; g.pEnd = g.pStart + 2500; g.mood = 'sad'; sv.unhappy++; g.sad = true;
        const dn = dishOf(g.dish);
        addRating(-0.07); say('😞 A guest left: no ' + (dn ? dn.name : 'dinner') + ' on the pass!', 'bad');
      }
    } else if (g.phase === 'eating') {
      g.phase = 'leaving'; g.pStart = g.pEnd; g.pEnd = g.pStart + 2500;
      const d = dishOf(g.dish); if (d) {
        const price = dishPrice(d);
        const tip = Math.round(price * rnd(0.05, 0.2) * (srv ? 1.5 : 1) * (1 + 0.1 * r.up.lights) * (0.8 + 0.1 * r.rating));
        const total = price + tip;
        try { G.addCoins(total, 'restaurant'); } catch (e) { /* ignore */ }
        try { G.addXP(Math.max(1, Math.round(price / 60))); } catch (e) { /* ignore */ }
        sv.covers++; sv.revenue += price; sv.tips += tip; sv.orders[d.id] = (sv.orders[d.id] || 0) + 1;
        r.stats.covers++; r.stats.revenue += price; r.stats.tips += tip;
        addRating(r.farmOnly ? 0.015 : 0.01); g.paid = total;
        try { G.bus.emit('restaurant:served', { dish: d.id, coins: price, tip, total }); } catch (e) { /* ignore */ }
      }
    } else if (g.phase === 'leaving') { g.done = true; }
  }
  function step(t) {
    const r = R_(); if (!r) return;
    t = t == null ? nowMs() : t;
    try {
      if (r.stage === 'permit' && r.permit.step === 'inspection' && t >= r.permit.inspectEnd) {
        r.permit.step = 'approved'; say('⚖️ Darlene: "You passed. The septic guy is crying. Happy tears."', 'good'); bump();
      }
      if (r.stage === 'building' && t >= r.permit.buildEnd) grandOpening();
      if (r.stage !== 'open') return;
      if (r.queue.length) collectCooked(t);
      const sv = r.service; if (!sv) return;
      let guard = 0;
      while (sv.nextArrival <= t && sv.nextArrival < sv.endAt - 12000 && guard++ < 40) { spawn(r, sv, sv.nextArrival); sv.nextArrival += gap(); }
      sv.guests.forEach(g => { let n = 0; while (!g.done && g.pEnd <= t && n++ < 6) advance(r, sv, g); });
      sv.guests = sv.guests.filter(g => !g.done);
      if (t >= sv.endAt && (!sv.guests.length || t > sv.endAt + 60000)) finishService(t);
    } catch (e) { console.error('[restaurant] step', e); }
  }
  const QUOTES = {
    great: [
      ['The {dish} alone is worth the drive from Spokane. I wept into my napkin.', 'Spokane food critic'],
      ['A barn that cooks like a cathedral. Order everything, then apologize to your diet.', 'Spokane food critic'],
      ['Best meal I have had in Whitman County, and I have eaten at every church potluck.', 'Earl from Rosalia'],
      ['The {dish} was so good I forgot to complain about the parking.', 'Marlene, neighbor with a clipboard']
    ],
    ok: [
      ['Honest food from honest dirt. The {dish} showed promise; the service showed up.', 'Spokane food critic'],
      ['Solid. I would eat here again, perhaps after a nap.', 'Bev from Colfax'],
      ['Charming barn, decent {dish}. Bring a sweater; the lambs left a draft.', 'Dale from Pullman']
    ],
    bad: [
      ['They ran out of things. In a restaurant. I am still processing it.', 'Spokane food critic'],
      ['The barn smells great but my stomach is still waiting.', 'Earl from Rosalia'],
      ['Two stars for effort, one for the goat that greeted us.', 'Bev from Colfax']
    ]
  };
  function finishService(t) {
    const r = R_(), sv = r && r.service; if (!sv) return null;
    const wages = Math.min(wageTotal(), (G.state.coins || 0));
    if (wages > 0) { try { G.addCoins(-wages, 'wages'); } catch (e) { /* ignore */ } }
    if (sv.covers >= 8 && sv.unhappy === 0) addRating(0.05);
    const top = Object.keys(sv.orders).sort((a, b) => sv.orders[b] - sv.orders[a])[0];
    const dn = (top && dishOf(top)) ? dishOf(top).name : 'lentil burger';
    const sat = sv.covers / Math.max(1, sv.covers + sv.unhappy);
    const tone = (sv.covers === 0 || sat < 0.6) ? 'bad' : (sat > 0.9 && r.rating >= 3.6) ? 'great' : 'ok';
    const pool = QUOTES[tone], q = pool[Math.floor(Math.random() * pool.length)];
    const sum = { covers: sv.covers, revenue: sv.revenue, tips: sv.tips, wages, net: sv.revenue + sv.tips - wages, unhappy: sv.unhappy, away: sv.away,
      ratingBefore: sv.ratingStart, ratingAfter: r.rating, ratingChange: r.rating - sv.ratingStart, quote: q[0].replace('{dish}', dn), who: q[1], tone, at: t };
    r.lastSummary = sum; r.service = null; r.cooldownUntil = t + COOLDOWN_MS; r.stats.services++;
    try { G.bus.emit('restaurant:review', { rating: r.rating, change: sum.ratingChange, quote: sum.quote, who: sum.who, summary: sum }); } catch (e) { /* ignore */ }
    showSummary(sum); bump();
    return sum;
  }
  function showSummary(sum) {
    sum = sum || (R_() && R_().lastSummary); if (!sum) return;
    const ch = sum.ratingChange, arrow = ch > 0.004 ? '▲' : ch < -0.004 ? '▼' : '•';
    const html = `<div class="rs-sum"><div><b>🍽️ ${fmt(sum.covers)}</b><small>Covers</small></div><div><b>🪙 ${fmt(sum.revenue)}</b><small>Revenue</small></div><div><b>💵 ${fmt(sum.tips)}</b><small>Tips</small></div><div><b>🧾 −${fmt(sum.wages)}</b><small>Wages</small></div></div>
      <div class="rs-net ${sum.net >= 0 ? 'up' : 'dn'}">Net tonight <b>${sum.net >= 0 ? '+' : '−'}🪙 ${fmt(Math.abs(sum.net))}</b></div>
      <div class="rs-ratechg ${ch >= 0 ? 'up' : 'dn'}">${stars(sum.ratingAfter)} <b>${sum.ratingAfter.toFixed(1)}</b> <span>${arrow} ${Math.abs(ch).toFixed(2)}</span></div>
      ${sum.unhappy ? `<div class="rs-fine">😞 ${sum.unhappy} guest${sum.unhappy === 1 ? '' : 's'} left hungry</div>` : ''}
      <blockquote class="rs-quote">“${esc(sum.quote)}”<cite>— ${esc(sum.who)}</cite></blockquote>`;
    modal({ emoji: sum.tone === 'bad' ? '😬' : sum.tone === 'great' ? '🌟' : '🍽️', title: 'Dinner service complete', html, buttons: [{ label: 'Wipe down the tables', cls: 'btn-gold' }] });
  }

  function customers() {
    const r = R_(), sv = r && r.service; if (!sv) return [];
    const t = nowMs();
    return sv.guests.map(g => ({ id: 'rg' + g.id, emoji: g.emoji, phase: g.phase, t: clamp((t - g.pStart) / Math.max(1, g.pEnd - g.pStart), 0, 1), table: g.table, mood: g.mood, dish: g.dish }));
  }

  // ---------- panel ----------
  let tab = 'service';
  const stars = v => {
    const f = Math.round(clamp(v, 0, 5) * 2) / 2; let s = '';
    for (let i = 1; i <= 5; i++) s += `<i class="${f >= i ? 'on' : f >= i - 0.5 ? 'half' : ''}">★</i>`;
    return `<span class="rs-stars">${s}</span>`;
  };
  function chips(req) {
    return Object.entries(req).map(([k, q]) => {
      const it = itemInfo(k), have = G.qty(k);
      return `<span class="need ${known(k) && have >= q ? 'ok' : 'no'}">${esc(it.emoji)} ${known(k) ? `<b>${have}</b>/${q}` : esc(it.name) + ' ×' + q}</span>`;
    }).join('');
  }
  const btn = (act, label, cls, attrs, why) => `<button class="btn ${cls || 'btn-gold'} ${why ? 'off' : ''}" data-act="pact" data-pa="${act}" ${attrs || ''} ${why ? `aria-disabled="true" data-why="${esc(why)}"` : ''}>${label}</button>`;

  function renderQuest(r) {
    const p = r.permit, t = nowMs();
    const lvlOk = unlocked();
    const idx = r.stage === 'none' ? 0 : r.stage === 'building' ? 3 : p.step === 'hearing' ? 1 : p.step === 'inspection' ? 2 : 3;
    const steps = [
      { e: '📝', t: 'Apply for a conditional-use permit', s: 'Whitman County Planning & Zoning · fee 🪙 ' + PERMIT_FEE },
      { e: '🏛️', t: 'Survive the public hearing', s: p.choice === 'gravel' ? 'You promised a gravel lot.' : p.choice === 'farm' ? 'You pledged: only food grown on this farm.' : 'The neighbors have concerns about traffic.' },
      { e: '🧪', t: 'Septic & fire inspection', s: 'Takes about 3 minutes. The septic guy brought a long stick.' },
      { e: '🔨', t: 'Convert the old lambing barn', s: 'Cost 🪙 ' + BUILD_COST + ' · about 4 minutes of hammering.' },
      { e: '🎉', t: 'Grand opening', s: 'Ribbon, scissors, and one nervous commissioner.' }
    ];
    let quote = '', action = '';
    if (r.stage === 'none') {
      quote = bubble('darlene', 'You want to open a restaurant in a lambing barn? Fill out Form 27-B. In triplicate. The lambs may sign as witnesses.');
      action = lvlOk ? btn('apply', '📝 Apply for permit · 🪙 ' + PERMIT_FEE, 'btn-gold', '', G.state.coins < PERMIT_FEE ? 'You need 🪙 ' + PERMIT_FEE + ' for the fee' : '')
        : `<span class="lockpill">🔒 Level ${UNLOCK_LEVEL}</span>`;
    } else if (r.stage === 'building') {
      quote = bubble('you', 'Lambs out, stove in. The chalkboard says "Today: Whatever Is Good".');
      action = `<div class="mini rs-bar"><i ${tmA('bar', p.buildStart, p.buildEnd)}></i></div><small class="rs-time" ${tmA('txt', 0, p.buildEnd, ' data-pre="🔨 Grand opening in "')}></small>`;
    } else if (p.step === 'hearing') {
      const wait = p.delayUntil > t;
      quote = wait ? bubble('darlene', 'We are adjourned. Take a walk. Maybe a deep breath.') : bubble('clip', 'I would like it noted that I brought a chart. The chart has a LOT of arrows.');
      action = wait ? `<div class="mini rs-bar"><i ${tmA('bar', p.delayUntil - HEARING_DELAY_MS, p.delayUntil)}></i></div><small class="rs-time" ${tmA('txt', 0, p.delayUntil, ' data-pre="⏳ Hearing resumes in "')}></small>`
        : btn('hearing', '🏛️ Attend public hearing', 'btn-gold');
    } else if (p.step === 'inspection') {
      quote = bubble('darlene', 'The inspector is crawling under your barn with a flashlight. Please do not ask what he is looking for.');
      action = `<div class="mini rs-bar"><i ${tmA('bar', p.inspectStart, p.inspectEnd)}></i></div><small class="rs-time" ${tmA('txt', 0, p.inspectEnd, ' data-pre="🧪 Inspection done in "')}></small>`;
    } else {
      quote = bubble('darlene', 'Inspection passed. The septic guy said "huh" twice. That is a rave. Go convert your barn.');
      action = btn('reno', '🔨 Convert the lambing barn · 🪙 ' + BUILD_COST, 'btn-green', '', G.state.coins < BUILD_COST ? 'You need 🪙 ' + BUILD_COST : '');
    }
    const list = steps.map((s, i) => {
      const st = i < idx ? 'done' : i === idx ? 'cur' : 'todo';
      return `<div class="rs-step ${st}"><span class="rs-sd">${st === 'done' ? '✅' : s.e}</span><div><b>${esc(s.t)}</b>${st === 'cur' ? `<small>${esc(s.s)}</small>` : ''}</div></div>`;
    }).join('');
    return `<div class="rs-hero"><div class="rs-hero-e">🏛️</div><div><h4>Whitman County Planning &amp; Zoning</h4><small>Permit #27-B · farm-to-table barn restaurant</small></div></div>
      ${quote}<div class="rs-act">${action}</div><div class="sub">The paperwork trail</div><div class="rs-quest">${list}</div>`;
  }

  function stockStrip(r) {
    const ids = r.menu; if (!ids.length) return '<div class="empty-note">No dishes on tonight\'s menu yet. Open the <b>Menu</b> tab.</div>';
    return `<div class="rs-stock">${ids.map(id => { const d = dishOf(id), n = r.pass[id] || 0; return `<span class="rs-sk ${n ? '' : 'out'}">${esc(d.emoji)} <b>${n}</b></span>`; }).join('')}</div>`;
  }
  function renderService(r) {
    const t = nowMs(), sv = r.service;
    let head;
    if (sv) {
      const closing = t >= sv.endAt;
      head = `<div class="rs-status live"><div class="rs-st-t"><b>${closing ? '🌙 Last orders in!' : '🔔 Dinner service'}</b><small ${closing ? '' : tmA('txt', 0, sv.endAt, ' data-pre="Closes in "')}>${closing ? 'Wrapping up the last tables' : ''}</small></div>
        <div class="mini rs-bar"><i ${tmA('bar', sv.startAt, sv.endAt)}></i></div></div>`;
    } else if (r.cooldownUntil > t) {
      head = `<div class="rs-status"><div class="rs-st-t"><b>😮‍💨 Kitchen resting</b><small ${tmA('txt', 0, r.cooldownUntil, ' data-pre="Ready to open in "')}></small></div>
        <div class="mini rs-bar"><i ${tmA('bar', r.cooldownUntil - COOLDOWN_MS, r.cooldownUntil)}></i></div></div>`;
    } else head = '<div class="rs-status"><div class="rs-st-t"><b>🍽️ Ready for dinner</b><small>About 2½ minutes of service</small></div></div>';
    let openWhy = '';
    if (!r.menu.length) openWhy = 'Put a dish on tonight\'s menu first';
    else if (!r.menu.some(id => (r.pass[id] || 0) > 0)) openWhy = 'Prep some dishes onto the pass first';
    else if (r.cooldownUntil > t) openWhy = 'The kitchen is still resting';
    const openBtn = sv ? '' : btn('open', '🔔 Open for dinner service', 'btn-green', 'style="width:100%"', openWhy);
    const n = tablesCount();
    const byTable = {}; (sv ? sv.guests : []).forEach(g => { if (g.table != null) byTable[g.table] = g; });
    let grid = '';
    for (let i = 0; i < n; i++) {
      const g = byTable[i];
      if (!g) { grid += `<div class="rs-tbl"><div class="rs-seat">🪑</div><small>Table ${i + 1}</small></div>`; continue; }
      const d = dishOf(g.dish);
      const lab = g.phase === 'arriving' ? 'Walking in' : g.phase === 'seated' ? (g.serve || !g.dish ? 'Ordering' : 'Ordering') : g.phase === 'eating' ? 'Eating' : g.sad ? 'Left hungry' : 'Paying';
      grid += `<div class="rs-tbl ${g.phase} ${g.sad ? 'sad' : ''}"><div class="rs-guest">${g.sad ? '😞' : esc(g.emoji)}</div>${d && g.phase !== 'arriving' ? `<span class="rs-dish ${g.serve ? '' : 'no'}">${esc(d.emoji)}</span>` : ''}<small>${esc(lab)}</small></div>`;
    }
    const tonight = sv ? sv : { covers: 0, revenue: 0, tips: 0, unhappy: 0 };
    const earn = `<div class="rs-earn"><div><b>🍽️ ${fmt(tonight.covers)}</b><small>Covers</small></div><div><b>🪙 ${fmt(tonight.revenue)}</b><small>Revenue</small></div><div><b>💵 ${fmt(tonight.tips)}</b><small>Tips</small></div><div><b>😞 ${fmt(tonight.unhappy)}</b><small>Unhappy</small></div></div>`;
    const lastBtn = r.lastSummary && !sv ? btn('review', '📰 Last night\'s review', 'btn-gray sm', 'style="width:100%;margin-top:8px"') : '';
    return head + openBtn + `<div class="sub">Tonight's pass</div>` + stockStrip(r) + `<div class="sub">Tables</div><div class="rs-tables">${grid}</div><div class="sub">${sv ? 'Earnings tonight' : 'Earnings'}</div>${earn}${lastBtn}`;
  }

  function renderKitchen(r) {
    const t = nowMs(), n = stoves();
    let st = '';
    for (let i = 0; i < n; i++) {
      const j = r.queue[i], d = j && dishOf(j.id);
      st += j && d ? `<div class="rs-stove on"><span class="rs-se">${esc(d.emoji)}</span><div class="mini rs-bar"><i ${tmA('bar', j.startAt, j.readyAt)}></i></div><small ${tmA('txt', 0, j.readyAt)}></small><button class="rs-x" data-act="pact" data-pa="cancel" data-i="${i}" aria-label="Cancel and refund">✕</button></div>`
        : `<div class="rs-stove"><span class="rs-se">🔥</span><small>Free stove</small></div>`;
    }
    const passItems = Object.keys(r.pass).map(id => { const d = dishOf(id); return d ? `<span class="rs-sk">${esc(d.emoji)} ${esc(d.name)} <b>${r.pass[id]}</b></span>` : ''; }).join('');
    const rows = dishList().map(d => {
      const locked = (G.state.level || 1) < d.level, why = locked ? '' : cookBlock(d), miss = missing(d);
      const right = locked ? `<span class="lockpill">🔒 Lv ${d.level}</span>` : btn('cook', 'Cook', 'btn-green sm', `data-id="${esc(d.id)}"`, why);
      return `<div class="rs-row ${locked ? 'locked' : ''}"><span class="rs-re">${esc(d.emoji)}</span><div class="rs-rm"><b>${esc(d.name)}</b><div class="needs">${chips(d.inputs)}</div><small>⏱ ${fmtT(d.cookSec * (r.staff.cook ? 0.7 : 1))} · ×${PORTIONS} portions${!locked && miss.length && miss.some(k => !known(k)) ? ' · needs the ranch' : ''}</small></div>${right}</div>`;
    }).join('');
    return `<div class="sub">Stoves ${r.queue.length}/${n}</div><div class="rs-stoves">${st}</div>
      <div class="sub">The pass <small>(max ${passCap()} per dish)</small></div>${passItems ? `<div class="rs-stock wrap">${passItems}</div>` : '<div class="empty-note">The pass is empty. Cook something below!</div>'}
      <div class="sub">Cook a dish</div>${rows}`;
  }

  function renderMenu(r) {
    const locked = !!r.service;
    const rows = dishList().map(d => {
      const on = r.menu.indexOf(d.id) >= 0, lv = (G.state.level || 1) < d.level;
      const parts = priceParts(d), price = dishPrice(d), miss = missing(d);
      const right = lv ? `<span class="lockpill">🔒 Lv ${d.level}</span>` : btn('menu', on ? '✓ On' : 'Add', on ? 'btn-green sm' : 'btn-gray sm', `data-id="${esc(d.id)}"`, locked ? 'Menu is locked while service is running' : '');
      return `<div class="rs-row ${lv ? 'locked' : ''} ${on ? 'on' : ''}"><span class="rs-re">${esc(d.emoji)}</span><div class="rs-rm"><b>${esc(d.name)}</b><div class="rs-pr">🪙 <b>${price}</b>${parts.map(p => `<em>${p[0]} +${Math.round(p[1] * 100)}%</em>`).join('')}</div>
        <div class="needs">${!lv && miss.length ? `<span class="need no">Need ingredients</span>` : ''}${chips(d.inputs)}</div><small>In pass: <b>${r.pass[d.id] || 0}</b></small></div>${right}</div>`;
    }).join('');
    return `<div class="rs-menuhead"><b>Tonight's menu</b><span>${r.menu.length}/${menuCap()}</span></div>${r.farmOnly ? '<div class="rs-rule">🌾 Farm rule: every dish uses your own produce, and sells for +10%.</div>' : ''}${rows}`;
  }

  function renderStaff(r) {
    const staff = Object.keys(STAFF).map(k => {
      const s = STAFF[k], on = r.staff[k];
      return `<div class="rs-row ${on ? 'on' : ''}"><span class="rs-re">${s.emoji}</span><div class="rs-rm"><b>${esc(s.name)}</b><small>${esc(s.desc)}</small><small>Wage 🪙 ${WAGES[k]} per service</small></div>${btn('hire', on ? 'Hired' : 'Hire', on ? 'btn-green sm' : 'btn-gold sm', `data-k="${k}"`, r.service ? 'Staff changes after service' : '')}</div>`;
    }).join('');
    const ups = Object.keys(UPGRADES).map(k => {
      const u = UPGRADES[k], n = r.up[k], maxed = n >= u.max, lv = (G.state.level || 1) < u.level, cost = u.cost(n);
      let right;
      if (maxed) right = '<span class="lockpill">✓ Done</span>';
      else if (lv) right = `<span class="lockpill">🔒 Lv ${u.level}</span>`;
      else right = btn('up', '🪙 ' + fmt(cost), 'btn-gold sm', `data-k="${k}"`, G.state.coins < cost ? 'You need 🪙 ' + fmt(cost) : '');
      return `<div class="rs-row"><span class="rs-re">${u.emoji}</span><div class="rs-rm"><b>${esc(u.name)}${u.max > 1 ? ` <em>${n}/${u.max}</em>` : ''}</b><small>${esc(u.desc(n))}</small></div>${right}</div>`;
    }).join('');
    return `<div class="sub">Staff <small>(wages: 🪙 ${wageTotal()} per service)</small></div>${staff}<div class="sub">Upgrades</div>${ups}`;
  }

  function renderOpen(r) {
    const tabs = [['service', '🔔', 'Service'], ['kitchen', '🍳', 'Kitchen'], ['menu', '📋', 'Menu'], ['staff', '⭐', 'Staff']];
    const seg = `<div class="rs-seg" role="tablist">${tabs.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-act="pact" data-pa="tab" data-tab="${x[0]}" role="tab">${x[1]}<span>${x[2]}</span></button>`).join('')}</div>`;
    const top = `<div class="rs-top"><div class="rs-top-r">${stars(r.rating)}<b>${r.rating.toFixed(1)}</b></div><small>${fmt(r.stats.covers)} guests served${r.up.parking||r.up.lights||r.up.grill||r.up.winelist ? ' · ' : ''}${r.up.parking ? '🅿️' : ''}${r.up.lights ? '✨' : ''}${r.up.grill ? '🔥' : ''}${r.up.winelist ? '🍷' : ''}${featureActive() ? ' 📰 Featured!' : ''}</small></div>`;
    const body = tab === 'kitchen' ? renderKitchen(r) : tab === 'menu' ? renderMenu(r) : tab === 'staff' ? renderStaff(r) : renderService(r);
    return top + seg + body;
  }

  G.panels = G.panels || {};
  G.panels.restaurant = {
    live: true,
    title() { const r = R_(); return r && r.stage === 'open' ? '🍽️ The Lambing Barn' : '🍽️ Barn Restaurant'; },
    sub() { const r = R_(); if (!r) return ''; return r.stage === 'open' ? 'Farm-to-table · Whitman County' : r.stage === 'building' ? 'Barn conversion in progress' : r.stage === 'permit' ? 'Permit paperwork' : 'Coming soon'; },
    render() {
      const r = R_(); if (!r) return '<div class="empty-note">Restaurant unavailable</div>';
      step();
      if (r.stage === 'open') return renderOpen(r);
      return renderQuest(r);
    },
    onAction(action, el) {
      try {
        const ds = (el && el.dataset) || {};
        switch (action) {
          case 'tab': tab = ds.tab || 'service'; { const r = R_(); if (r) r.tab = tab; } break;
          case 'apply': applyPermit(); break;
          case 'hearing': openHearing(); break;
          case 'reno': startReno(); break;
          case 'cook': cook(ds.id); break;
          case 'cancel': cancelCook(+ds.i); break;
          case 'menu': toggleMenu(ds.id); break;
          case 'open': startService(); break;
          case 'review': showSummary(); break;
          case 'hire': toggleStaff(ds.k); break;
          case 'up': buyUpgrade(ds.k); break;
          default: break;
        }
      } catch (e) { console.error('[restaurant] action', e); }
    }
  };

  }

.rs-row.on{border-color:#5fb53c;background:#f1fbe6}.rs-row.locked{opacity:.65}
.rs-re{font-size:30px;width:40px;text-align:center;flex:none}.rs-rm{flex:1;min-width:0}.rs-rm>b{display:block;font-size:14px;line-height:1.15}
.rs-rm small{display:block;font-size:11px;color:var(--ink2,#7a5a38);font-weight:800;margin-top:2px}.rs-rm em{font-style:normal;font-size:11px;color:var(--ink2,#7a5a38)}
.rs-row .btn{flex:none;min-width:70px}.rs-pr{font-size:13px;margin-top:2px}.rs-pr em{background:#fff1c9;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:900;color:#8a5a06}
.rs-menuhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:2px 2px 8px}.rs-menuhead span{background:#fff1c9;border-radius:12px;padding:2px 10px;font-weight:900}
.rs-rule{background:#e3f3cf;border:2px solid #8fcb62;border-radius:14px;padding:6px 10px;font-size:12px;margin-bottom:8px}
.rs-net{margin:8px 0;padding:8px;border-radius:14px;font-size:15px}.rs-net.up{background:#d6f2b8;color:#2e5a14}.rs-net.dn{background:#ffd5cc;color:#a42d23}
.rs-ratechg{font-size:18px;margin:4px 0}.rs-ratechg span{font-size:14px}.rs-ratechg.up span{color:#3e8223}.rs-ratechg.dn span{color:#a42d23}
.rs-fine{font-size:12px;color:#a42d23;margin:2px 0}
.rs-quote{margin:10px 0 4px;padding:10px 12px;background:#fff;border-left:5px solid #f2b631;border-radius:12px;font-size:14px;font-weight:800;text-align:left;line-height:1.35}
.mcard .rs-say,.mcard .rs-sum>div,.mcard .rs-net,.mcard .rs-quote,.mcard .rs-ratechg,.mcard .rs-fine{text-shadow:none!important;color:var(--ink,#4a2f14)}
.mcard .rs-say p{color:var(--ink,#4a2f14)!important}.mcard .rs-ratechg{background:#fff;border-radius:12px;padding:4px}
.rs-quote cite{display:block;margin-top:4px;font-size:12px;font-style:normal;color:var(--ink2,#7a5a38)}
`);

  // ---------- lifecycle ----------
  G.bus.on('init', () => { try { ensure(); tab = R_().tab || 'service'; } catch (e) { console.error('[restaurant] init', e); } });
  G.bus.on('state:reset', () => { try { tab = 'service'; ensure(); } catch (e) { console.error('[restaurant] reset', e); } });
  G.bus.on('levelup', p => { try { if (p && p.level === UNLOCK_LEVEL && stage() === 'none') say('🍽️ The county planning board has a form with your name on it. A barn restaurant awaits!', 'good'); } catch (e) { /* ignore */ } });
  G.bus.on('tick', p => {
    try {
      const r = G.state && G.state.restaurant;
      if (r && r.stage === 'none') return;     // cheap exit when nothing is going on
      if (!r) return;
      step(p && p.now ? p.now : nowMs());
    } catch (e) { console.error('[restaurant] tick', e); }
  });

  G.Restaurant = {
    stage, isServing, customers, tables: tablesCount, ensure,
    rating: () => R_().rating, stars: () => R_().rating,
    // actions (also used by tests)
    apply: applyPermit, hearing: openHearing, resolveHearing, reno: startReno, cook, cancelCook, toggleMenu, startService, step,
    buyUpgrade, toggleStaff, addRating, showSummary, dishPrice, dishes: dishList,
    summary: () => R_().lastSummary, cooldownLeft: () => Math.max(0, R_().cooldownUntil - nowMs()),
    constants: { UNLOCK_LEVEL, PERMIT_FEE, GRAVEL_COST, BUILD_COST, INSPECT_MS, BUILD_MS, SERVICE_MS, COOLDOWN_MS, HEARING_DELAY_MS, PORTIONS }
  };
  ensure();
})();

</script>
<script>/* ---- ui.js ---- */
/* ui.js — Kellyville UI: rendering, input, toasts, modals, atmosphere. */
(function () {
  'use strict';
  const G = window.G;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Math.round(n || 0).toLocaleString('en-US');
  const fmtT = sec => String((G.util && G.util.fmtTime ? G.util.fmtTime(sec) : Math.ceil(sec) + 's')).trim();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const D = () => G.DATA || {};
  const S = () => G.state;
  const dget = (cat, k) => (D()[cat] || {})[k];
  const iEmoji = k => (G.itemInfo ? G.itemInfo(k).emoji : '📦') || '📦';
  const iName = k => (G.itemInfo ? G.itemInfo(k).name : k) || k;
  const AVATARS = ['🧑‍🌾', '👩‍🌾', '👨‍🌾', '🤠', '👵', '👴', '🧒', '🐕'];

  const UI = (G.ui = { tab: 'farm', shopTab: 'animals', sheet: null, modals: [], cur: null, seedAll: false, tapRect: null, tapAt: 0, pending: false, sig: {}, flySeq: 0, tfx: null });

  // ---------- toast (installed at load so early toasts are caught) ----------
  G.toast = function (msg, kind) {
    try {
      const box = $('#toasts');
      if (!box) { console.log('[toast]', kind || '', msg); return; }
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || 'info');
      t.textContent = msg;
      box.appendChild(t);
      while (box.children.length > 4) box.firstChild.remove();
      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2500);
    } catch (e) { console.error(e); }
  };

  // ---------- small helpers ----------
  function patchChildren(box, htmls) {
    if (!box) return;
    const kids = box.children;
    htmls.forEach((h, i) => {
      const cur = kids[i];
      if (cur && cur._h === h) return;
      const t = document.createElement('template'); t.innerHTML = h.trim();
      const n = t.content.firstElementChild; if (!n) return; n._h = h;
      if (cur) box.replaceChild(n, cur); else box.appendChild(n);
    });
    while (box.children.length > htmls.length) box.lastElementChild.remove();
  }
  function setHTML(el, html) { if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }
  function setText(el, t) { if (el && el.textContent !== t) el.textContent = t; }
  function avatar() { return (S().flags && S().flags['ui.avatar']) || AVATARS[0]; }
  function pname() { return G.playerName ? G.playerName() : 'Farmer'; }
  const tm = (type, start, end, extra) => `data-tm="${type}" data-start="${Math.round(start || 0)}" data-end="${Math.round(end || 0)}"${extra || ''}`;
  function needChips(req) {
    return Object.entries(req || {}).map(([k, q]) => {
      const have = G.qty(k);
      return `<span class="need ${have >= q ? 'ok' : 'no'}">${esc(iEmoji(k))} <b>${have}</b>/${q}</span>`;
    }).join('');
  }
  function evDef(key) {
    try { if (G.Events && G.Events.def) { const d = G.Events.def(key); if (d) return d; } } catch (e) { }
    const defs = G.Events && G.Events.definitions;
    if (Array.isArray(defs)) return defs.find(d => d.key === key) || null;
    return null;
  }
  function activeEvents() {
    try { if (G.Events && G.Events.active) return G.Events.active() || []; } catch (e) { }
    return (S().activeEvents || []);
  }

  // ---------- flying text ----------
  function fly(html, from, toEl, opt) {
    opt = opt || {};
    const layer = $('#float-layer');
    if (!layer || !from || !layer.appendChild) return;
    const el = document.createElement('div');
    el.className = 'fly ' + (opt.cls || '');
    el.innerHTML = html; layer.appendChild(el);
    const sx = from.left + from.width / 2, sy = from.top + from.height / 2;
    el.style.left = sx + 'px'; el.style.top = sy + 'px';
    const tr = toEl ? toEl.getBoundingClientRect() : null;
    const dx = tr ? tr.left + tr.width / 2 - sx : 0, dy = tr ? tr.top + tr.height / 2 - sy : -90;
    if (!el.animate) { setTimeout(() => el.remove(), 900); return; }
    const a = el.animate([
      { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0, offset: 0 },
      { transform: 'translate(-50%,-110%) scale(1.15)', opacity: 1, offset: .2 },
      { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.5)`, opacity: .2, offset: 1 }
    ], { duration: opt.dur || 950, delay: opt.delay || 0, easing: 'cubic-bezier(.35,.1,.3,1)', fill: 'both' });
    a.onfinish = () => { el.remove(); if (toEl && opt.bump !== false) bump(toEl); };
  }
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function tapOrigin() {
    if (UI.tapRect && Date.now() - UI.tapAt < 2000) return UI.tapRect;
    if (UI.tab === 'farm' && G.World && G.World.playerRect) { const r = G.World.playerRect(); if (r) return r; }
    return { left: innerWidth / 2 - 10, top: innerHeight * 0.55, width: 20, height: 20 };
  }
  function confetti() {
    const box = $('#confetti'); if (!box || !box.animate) return;
    const cols = ['#ff5a4d', '#ffc83d', '#5fd04a', '#4aa3e0', '#c06cf0', '#fff'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('i'); c.className = 'cf';
      const x = Math.random() * innerWidth;
      c.style.left = x + 'px'; c.style.background = cols[i % cols.length];
      c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (8 + Math.random() * 10) + 'px';
      box.appendChild(c);
      const dur = 1800 + Math.random() * 1800, drift = (Math.random() - .5) * 220;
      const a = c.animate([
        { transform: 'translate(0,-20px) rotate(0)', opacity: 1 },
        { transform: `translate(${drift}px,${innerHeight + 40}px) rotate(${Math.random() * 900 - 450}deg)`, opacity: .9 }
      ], { duration: dur, delay: Math.random() * 500, easing: 'cubic-bezier(.3,.6,.5,1)', fill: 'both' });
      a.onfinish = () => c.remove();
    }
  }

  // ---------- sky / season ----------
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
  const DAYSKY = {
    spring: { top: [110, 190, 240], bot: [215, 240, 255] }, summer: { top: [58, 150, 235], bot: [190, 230, 255] },
    fall: { top: [130, 168, 205], bot: [255, 222, 168] }, winter: { top: [150, 175, 200], bot: [232, 240, 246] }
  };
  function skyAt(season, p) {
    const day = DAYSKY[season] || DAYSKY.spring;
    const K = {
      night: { top: [22, 30, 74], bot: [64, 54, 118], sh: [8, 12, 44, .48], st: 1 },
      dawn: { top: [124, 120, 196], bot: [255, 178, 128], sh: [255, 140, 80, .14], st: .3 },
      day: { top: day.top, bot: day.bot, sh: [255, 255, 255, 0], st: 0 },
      dusk: { top: [92, 82, 164], bot: [255, 138, 88], sh: [255, 110, 60, .18], st: .3 }
    };
    const F = [[0, 'night'], [.08, 'night'], [.18, 'dawn'], [.3, 'day'], [.62, 'day'], [.74, 'dusk'], [.86, 'night'], [1, 'night']];
    let i = 0; while (i < F.length - 2 && p > F[i + 1][0]) i++;
    const a = F[i], b = F[i + 1], t = clamp((p - a[0]) / (b[0] - a[0]), 0, 1), A = K[a[1]], B = K[b[1]];
    return { top: mix(A.top, B.top, t), bot: mix(A.bot, B.bot, t), sh: mix(A.sh, B.sh, t), st: lerp(A.st, B.st, t) };
  }
  const rgb = c => `rgb(${c.slice(0, 3).map(Math.round).join(',')})`;
  function updateSky(cal) {
    cal = cal || G.calendar();
    const app = $('#app'), sc = $('#scene'); if (!app || !sc) return;
    if (app.dataset.season !== cal.season) app.dataset.season = cal.season;
    const s = skyAt(cal.season, (cal.dayProgress + .22) % 1);
    sc.style.setProperty('--sky-top', rgb(s.top)); sc.style.setProperty('--sky-bot', rgb(s.bot));
    sc.style.setProperty('--shade', `rgba(${s.sh.slice(0, 3).map(Math.round).join(',')},${s.sh[3].toFixed(3)})`);
    sc.style.setProperty('--stars', s.st.toFixed(2));
    const p = (cal.dayProgress + .22) % 1, orb = $('#orb'); if (!orb) return;
    let t = -1, ch = '☀️';
    if (p >= .1 && p <= .74) { t = (p - .1) / .64; ch = '☀️'; }
    else { const q = p < .5 ? p + 1 : p; if (q >= .74 && q <= 1.12) { t = (q - .74) / .38; ch = '🌙'; } }
    if (t < 0) { orb.style.opacity = 0; return; }
    const W = Math.min(innerWidth, 480);
    orb.style.opacity = 1; setText(orb, ch);
    orb.style.transform = `translate(${(-W / 2 + 24 + t * (W - 60)).toFixed(0)}px,${(-Math.sin(Math.PI * t) * 100).toFixed(0)}px)`;
  }
  function updateSeasonChip(cal) {
    cal = cal || G.calendar();
    const si = (G.SEASON_INFO || {})[cal.season] || { name: cal.season, emoji: '' };
    setText($('#hud-season'), `${si.emoji} ${si.name} · Day ${cal.dayOfSeason}` + (cal.year > 1 ? ` · Yr ${cal.year}` : ''));
  }

  // ---------- weather / event atmosphere ----------
  const FX_RULES = [['dust', /dust|wind|chinook/], ['smoke', /smoke|fire/], ['hail', /hail/], ['rain', /rain/], ['frost', /frost|freeze/], ['heat', /heat|drought/], ['snow', /snow/]];
  function fxFor(key, def) {
    const out = [], k = (key || '').toLowerCase();
    FX_RULES.forEach(([n, re]) => { if (re.test(k)) out.push(n); });
    if (!out.length && def && def.kind === 'good') out.push('sun');
    return out;
  }
  function buildFxParticles() {
    const mk = (cls, n, fn) => { const l = $('.' + cls); if (!l || l.children.length) return; for (let i = 0; i < n; i++) { const e = fn(i); l.appendChild(e); } };
    const rnd = (a, b) => a + Math.random() * (b - a);
    mk('l-rain', 34, () => { const e = document.createElement('i'); e.style.left = rnd(0, 110) + '%'; e.style.animationDuration = rnd(.55, .9) + 's'; e.style.animationDelay = -rnd(0, 1) + 's'; return e; });
    mk('l-hail', 22, () => { const e = document.createElement('i'); e.style.left = rnd(0, 120) + '%'; e.style.animationDuration = rnd(.7, 1.1) + 's'; e.style.animationDelay = -rnd(0, 1) + 's'; return e; });
    mk('l-snow', 30, () => { const e = document.createElement('i'); const s = rnd(4, 9); e.style.width = e.style.height = s + 'px'; e.style.left = rnd(0, 100) + '%'; e.style.animationDuration = rnd(5, 10) + 's'; e.style.animationDelay = -rnd(0, 8) + 's'; return e; });
    mk('l-frost', 16, i => { const e = document.createElement('b'); e.textContent = i % 3 ? '✦' : '❄'; e.style.left = rnd(2, 94) + '%'; e.style.top = rnd(4, 90) + '%'; e.style.fontSize = rnd(12, 26) + 'px'; e.style.animationDelay = -rnd(0, 2) + 's'; e.style.animationDuration = rnd(1.4, 3) + 's'; return e; });
  }
  function updateFX() {
    const fx = $('#fx'); if (!fx) return;
    // Show only ONE atmosphere at a time (the newest) so the farm stays readable.
    let pick = null;
    if (UI.tfx) { if (Date.now() < UI.tfx.until && UI.tfx.list.length) pick = UI.tfx.list[0]; else if (Date.now() >= UI.tfx.until) UI.tfx = null; }
    if (!pick) {
      const recs = activeEvents().filter(r => !r.pending).slice().sort((a, b) => (b.startAt || 0) - (a.startAt || 0));
      for (const rec of recs) { const def = evDef(rec.key); const l = fxFor(rec.key + ' ' + ((def && def.key) || ''), def); if (l.length) { pick = l[0]; break; } }
    }
    const cls = 'fx' + (pick ? ' ' + pick : '');
    if (fx.className !== cls) fx.className = cls;
  }

  // ---------- HUD ----------
  function renderHUD() {
    const s = S(); if (!s) return;
    setText($('#hud-coins'), fmt(s.coins));
    setText($('#hud-lvl-num'), String(s.level));
    const need = G.xpForLevel(s.level), pct = clamp(s.xp / need * 100, 0, 100);
    const ring = $('#hud-ring'); if (ring) ring.style.setProperty('--p', pct.toFixed(1));
    const xb = $('#hud-xpbar'); if (xb) xb.style.width = pct.toFixed(1) + '%';
    setText($('#hud-xp'), `${fmt(s.xp)}/${fmt(need)} XP`);
    const cnt = G.barnCount(), cap = s.barnCap;
    setText($('#hud-barn'), `${cnt}/${cap}`);
    const bp = $('#hud-barn-pill'); if (bp) { bp.classList.toggle('warn', cnt / cap >= .75 && cnt < cap); bp.classList.toggle('full', cnt >= cap); }
    setText($('#hud-av'), avatar());
    const nm = pname(), farm = s.farmName;
    setText($('#hud-who-txt'), s.playerName ? nm + (farm ? ' · ' + farm : '') : (farm || 'Kellyville'));
    updateSeasonChip();
    const hud = $('#hud'); if (hud) document.documentElement.style.setProperty('--hud-h', hud.offsetHeight + 'px');
  }
  function renderStrip() {
    const strip = $('#event-strip'); if (!strip) return;
    const now = Date.now();
    const recs = activeEvents().filter(r => !r.pending && r.endAt > now);
    strip.hidden = !recs.length;
    const html = recs.map(r => {
      const def = evDef(r.key) || {};
      return `<button class="echip ${esc(def.kind || 'neutral')}" data-act="echip" data-id="${esc(r.id)}"><i>${esc(def.emoji || '❗')}</i><span><b>${esc(def.name || r.key)}</b><small ${tm('txt', 0, r.endAt)}></small></span></button>`;
    }).join('');
    if (strip._h !== html) { strip.innerHTML = html; strip._h = html; }
  }

  // ---------- Farm ----------
  function plotHTML(p, i) {
    const c = dget('crops', p.crop);
    if (p.status === 'empty') return `<div class="plot empty" data-act="plot" data-i="${i}" data-plot="${i}"><span class="plus">＋</span><small>Plant</small></div>`;
    if (p.status === 'withered') return `<div class="plot withered" data-act="plot" data-i="${i}" data-plot="${i}"><span class="pe">🥀</span><small>Tap to clear</small></div>`;
    const em = c ? c.emoji : '🌾';
    if (p.status === 'ready') {
      let n = 1; try { n = Math.max(1, Math.round(c.yield * p.yieldMult * (G.mods ? G.mods.yield(p.crop) : 1))); } catch (e) { }
      return `<div class="plot ready" data-act="plot" data-i="${i}" data-plot="${i}"><span class="yb">×${n}</span><span class="pe">${esc(em)}</span><small>Ready!</small></div>`;
    }
    return `<div class="plot growing" data-act="plot" data-i="${i}" data-plot="${i}"><span class="pe" ${tm('crop', p.plantedAt, p.readyAt, ` data-emoji="${esc(em)}"`)}>🌱</span><div class="pbar"><i ${tm('bar', p.plantedAt, p.readyAt)}></i></div><small ${tm('txt', 0, p.readyAt)}></small></div>`;
  }
  function renderPlots() {
    const s = S(), h = s.plots.map(plotHTML);
    if (s.plots.length < s.maxPlots) h.push(`<div class="plot buy" data-act="buyplot"><span class="plus">＋</span><small>Buy land<br>🪙 ${fmt(G.plotCost())}</small></div>`);
    patchChildren($('#plots'), h);
    const g = s.plots.filter(p => p.status === 'growing').length, r = s.plots.filter(p => p.status === 'ready').length;
    setText($('#field-info'), `${s.plots.length} plots · ${g} growing${r ? ' · ' + r + ' ready' : ''}`);
  }
  function penHTML(a, i) {
    const d = dget('animals', a.type) || { name: a.type, emoji: '🐾' };
    const head = `<span class="em">${esc(d.emoji)}</span><b>${esc(d.name)}</b>`;
    if (a.status === 'ready') return `<div class="pen ready" data-act="collect" data-i="${i}">${head}<span class="st">${esc(iEmoji(d.product))} Collect</span></div>`;
    if (a.status === 'producing') {
      const start = a.fedAt || (a.readyAt - (d.produceSec || 60) * 1000);
      return `<div class="pen producing" data-act="pen-info" data-i="${i}">${head}<div class="mini"><i ${tm('bar', start, a.readyAt)}></i></div><span class="st" ${tm('txt', 0, a.readyAt)}></span></div>`;
    }
    const need = d.feedQty || 1, have = G.qty(d.feed);
    return `<div class="pen hungry" data-act="feed" data-i="${i}">${head}<span class="st ${have >= need ? '' : 'lack'}">Feed ${need}× ${esc(iEmoji(d.feed))}</span></div>`;
  }
  function bldHTML(b, i) {
    const d = dget('buildings', b.type) || { name: b.type, emoji: '🏭' }, now = Date.now();
    const ready = b.queue.filter(j => j.readyAt <= now).length;
    const cur = b.queue.find(j => j.readyAt > now);
    let pips = '';
    for (let k = 0; k < b.maxQueue; k++) pips += `<i class="${k < ready ? 'done' : k < b.queue.length ? 'on' : ''}"></i>`;
    let line = '<small>Idle · tap to cook</small>';
    if (cur) line = `<div class="mini" style="width:100%"><i ${tm('bar', cur.startAt, cur.readyAt)}></i></div><small ${tm('txt', cur.startAt, cur.readyAt)}></small>`;
    else if (ready) line = '<small>Ready to collect!</small>';
    return `<div class="bld ${ready ? 'has-ready' : ''}" data-act="bld" data-i="${i}">${ready ? `<span class="rb" data-act="bcollect" data-i="${i}">✓ ${ready}</span>` : ''}<span class="em">${esc(d.emoji)}</span><div class="bi"><b>${esc(d.name)}</b><div class="pips">${pips}</div>${line}</div></div>`;
  }
  function renderFarm() {
    const s = S();
    renderPlots();
    const pens = s.animals.map(penHTML);
    if (!pens.length) pens.push('<div class="empty-note">No animals yet. Visit the Shop 🏪 for chickens, cows and more!</div>');
    patchChildren($('#pens'), pens);
    setText($('#pen-info'), s.animals.length ? `${s.animals.filter(a => a.status === 'ready').length} ready · ${s.animals.length} animals` : '');
    const bl = s.buildings.map(bldHTML);
    if (!bl.length) bl.push('<div class="empty-note">No buildings yet. Build a mill or bakery in the Shop 🏪</div>');

  // ---------- Shop ----------
  const TAGINFO = { irrigation: '💧 Protects vs drought & heat', windbreak: '🌲 Less wind & dust damage', frost_fans: '🌀 Frost protection', beehives: '🐝 Pollination boost', firebreak: '🚒 Wildfire protection', cold_storage: '🧊 Price-crash shield' };

  function shopCard(e, kind) {

    if (kind === 'buildings') { const outs = (d.recipes || []).slice(0, 6).map(r => esc(iEmoji(r.output))).join(' '); tags.push(`<span class="tag">${(d.recipes || []).length} recipes</span>`); if (outs) tags.push(`<span class="tag">${outs}</span>`); }

  // ---------- Barn ----------
  function trendDir(key) {

  // ---------- view switching / render ----------

  // ---------- timers ----------
  function updateTimers(now) {
    now = now || Date.now();
    $$('[data-tm]').forEach(el => {
      const t = el.dataset.tm, end = +el.dataset.end, start = +el.dataset.start || 0;
      if (t === 'bar') {
        const w = clamp(end > start ? (now - start) / (end - start) * 100 : 100, 0, 100).toFixed(1) + '%';
        if (el._w !== w) { el.style.width = w; el._w = w; }
      } else if (t === 'txt') {
        const left = (end - now) / 1000; let s;
        if (start && now < start) s = 'Queued'; else s = left <= 0 ? (el.dataset.done || 'Done') : fmtT(left);
        s = (el.dataset.pre || '') + s;
        if (el.textContent !== s) el.textContent = s;
      } else if (t === 'crop') {
        const prog = clamp((now - start) / Math.max(1, end - start), 0, 1), st = prog < .3 ? 0 : 1;
        const em = st ? el.dataset.emoji : '🌱';
        if (el.textContent !== em) el.textContent = em;
        const sc = (st ? .6 + .5 * ((prog - .3) / .7) : .75 + prog * .5).toFixed(2);
        if (el._s !== sc) { el.style.transform = `scale(${sc})`; el._s = sc; }
      }
    });
  }
  function tickChecks(now) {
    const bs = S().buildings.map(b => b.queue.filter(j => j.readyAt <= now).length).join('');

    if (bs !== UI.sig.b) { UI.sig.b = bs; changed = true; }
    if (UI.tab === 'orders' || true) { const os = ordersSig(); if (os !== UI.sig.o) { UI.sig.o = os; changed = true; } }
    const ev = activeEvents().filter(r => !r.pending && r.endAt > now).map(r => r.id).join();
    if (ev !== UI.sig.e) { UI.sig.e = ev; changed = true; }
    if (UI.tfx && now > UI.tfx.until) { UI.tfx = null; changed = true; }
    if (changed) queueRender();
  }

    root.hidden = false;
    root.innerHTML = `<div class="modal-bg"><div class="mwrap">${spec.html}</div></div>`;
    try { spec.onShow && spec.onShow(root); } catch (e) { console.error(e); }
    updateTimers();
  }
  function dismissEventModal(id) {
    UI.modals = UI.modals.filter(m => m.eventId !== id);
    if (UI.cur && UI.cur.eventId === id) nextModal();
  }
  function modsOf(rec) { try { const m = G.Events.describeMods(rec); return Array.isArray(m) ? m : m ? [String(m)] : []; } catch (e) { return []; } }
  function eventModal(p) {
    const def = p.def || {}, rec = p.event || {}, kind = def.kind === 'bad' ? 'bad' : def.kind === 'good' ? 'good' : 'neutral';
    const choices = p.choices && p.choices.length ? p.choices : null;
    const text = p.text || (typeof def.text === 'string' ? def.text : '') || def.desc || '';
    const mods = rec.pending ? [] : modsOf(rec);
    const kl = kind === 'bad' ? 'Trouble on the Palouse' : kind === 'good' ? 'Lucky break!' : 'News from the farm';
    let btns;
    if (choices) {
      btns = choices.map((c, i) => {
        const cost = c.cost || 0, aff = S().coins >= cost;
        return `<button class="choice ${aff ? '' : 'poor'}" data-act="m-choice" data-i="${i}"><b>${esc(c.emoji ? c.emoji + ' ' : '')}${esc(c.label || c.text || c.name || 'Option ' + (i + 1))}</b>${c.desc ? `<small>${esc(c.desc)}</small>` : ''}<span class="cost">${cost ? '🪙 ' + fmt(cost) : 'Free'}</span></button>`;
      }).join('');
    } else btns = `<button class="btn ok-btn" data-act="m-close">OK</button>`;
    return {
      eventId: rec.id, hasChoices: !!choices,
      html: `<div class="mcard ev ${kind}"><span class="ev-kind">${kl}</span><div class="ev-emoji">${esc(def.emoji || '❗')}</div><h2>${esc(def.name || def.key || 'Event')}</h2><p>${esc(text)}</p>
        ${mods.length ? `<ul class="ev-mods">${mods.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}
        ${choices && rec.endAt ? `<div class="ev-timer" ${tm('txt', 0, rec.endAt, ' data-pre="⏳ Decide in "')}></div>` : ''}${btns}</div>`,
      onChoice(i) {
        let ok = true;
        try { ok = G.Events && G.Events.choose ? G.Events.choose(rec.id, i) : true; } catch (e) { console.error(e); ok = false; }
        if (ok === false) { G.toast((choices[i] && choices[i].cost && S().coins < choices[i].cost) ? 'Not enough coins for that option' : "Can't do that right now", 'bad'); return; }
        dismissEventModal(rec.id);
      },
      onShow() { if (kind === 'bad') { const a = $('#app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); setTimeout(() => a.classList.remove('shake'), 600); } }
    };
  }
  function unlocksFor(level) {
    const out = [];
    [['crops', 'crop'], ['animals', 'animal'], ['buildings', 'building'], ['expansions', 'upgrade']].forEach(([cat, kind]) => {
      Object.values(D()[cat] || {}).forEach(d => { if ((d.level || 1) === level) out.push((d.emoji || '') + ' ' + d.name); });
    });
    Object.values(D().buildings || {}).forEach(b => (b.recipes || []).forEach(r => { if ((r.level || 1) === level && level > 1) out.push(iEmoji(r.output) + ' ' + r.name); }));
    return out;
  }
  function levelModal(level) {
    const un = unlocksFor(level);
    return {
      html: `<div class="mcard lvl-card"><div class="lvl-big">🌟</div><div class="ev-kind" style="background:rgba(120,70,0,.18)">Level up!</div><div class="num">Level ${level}</div><h2 style="font-size:20px">Nice work, ${esc(pname())}!</h2>
        ${un.length ? `<p style="margin-bottom:4px">New unlocks</p><div class="unlocks">${un.map(u => `<span>${esc(u)}</span>`).join('')}</div>` : '<p>Keep farming to unlock more!</p>'}
        <p style="font-size:12px;color:var(--ink2);margin:6px 0 0">Level-up bonus coins added!</p><button class="btn btn-gold" data-act="m-close">Awesome!</button></div>`,
      onShow: confetti
    };
  }
  function welcomeModal() {
    const named = !!S().playerName;
    return {
      html: `<div class="mcard"><div class="wel-av">${esc(avatar())}</div><h2>Welcome to Kellyville!</h2><p style="margin-bottom:6px">Farm life in Eastern Washington, from golden Palouse wheat to Wenatchee apples.</p>
        <label class="name-lbl" for="name-in">What's your name, farmer?</label><input id="name-in" class="name-in" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="Your name" value="${esc(S().playerName || '')}">
        <ul class="tips"><li><i>🚶</i><span>Walk your farm! Drag anywhere to steer (a joystick appears under your thumb) or tap a spot to walk there.</span></li><li><i>🌱</i><span>Walk up to a plot, animal or building and tap the big action button to plant, harvest, feed or open it.</span></li><li><i>📋</i><span>Fill truck orders at the mailbox for coins and XP, and sell extras from the Barn.</span></li><li><i>⛈️</i><span>Dust, frost, fire and lucky breaks can strike. Buy upgrades in the Shop to protect your farm.</span></li></ul>
        <button class="btn btn-green ${named ? '' : 'off'}" id="wel-go" data-act="welcome-go" ${named ? '' : 'aria-disabled="true"'}>🚜 Start farming</button></div>`,
      onShow(root) {
        const inp = $('#name-in', root), go = $('#wel-go', root); if (!inp) return;
        const sync = () => { const ok = inp.value.trim().length > 0; go.classList.toggle('off', !ok); if (ok) go.removeAttribute('aria-disabled'); else go.setAttribute('aria-disabled', 'true'); };
        inp.addEventListener('input', sync);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); welcomeGo(); } });
        setTimeout(() => { try { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) { } }, 350);
      }
    };
  }
  function welcomeGo() {
    const inp = $('#name-in'); if (!inp) return;
    if (!G.setPlayerName || !G.setPlayerName(inp.value)) { G.toast('Please enter your name', 'bad'); return; }
    S().flags['ui.welcomed'] = true;
    inp.blur();
    nextModal(); G.toast(`Welcome to Kellyville, ${pname()}!`, 'good'); G.save && G.save();
  }
  function confirmReset() {
    pushModal({
      html: `<div class="mcard"><div class="wel-av">⚠️</div><h2>Reset farm?</h2><p>All progress, coins and animals will be erased. This cannot be undone.</p><button class="btn btn-red" data-act="m-yes">Yes, reset everything</button><button class="btn btn-gray" data-act="m-close">Keep farming</button></div>`,
      onYes() { nextModal(); try { G.reset(); } catch (e) { console.error(e); } }
    });
  }

  // ---------- actions ----------
  function plantMany(key) {
    const c = dget('crops', key); if (!c) return;
    S().flags['ui.lastCrop'] = key; let n = 0;
    S().plots.forEach((p, i) => { if (p.status === 'empty' && G.plant(i, key)) n++; });
    if (n) G.toast(`Planted ${n}× ${c.name}`, 'good');
    closeSheet();
  }
  const ACT = {
    tab(el) { showTab(el.dataset.tab); },
    plot(el) {
      const i = +el.dataset.i, p = S().plots[i]; if (!p) return;
      if (p.status === 'empty') openSheet({ kind: 'seed', plot: i });
      else if (p.status === 'ready') G.harvest(i);
      else if (p.status === 'withered') { G.clearWithered(i); G.toast('Cleared the withered crop', 'info'); }
      else { const c = dget('crops', p.crop) || {}; G.toast(`${c.emoji || '🌱'} ${c.name || 'Crop'}: ${fmtT((p.readyAt - Date.now()) / 1000)} left`, 'info'); }
    },
    buyplot() { if (G.buyPlot()) G.toast('New plot of land!', 'good'); },
    harvestall() {
      const idx = []; S().plots.forEach((p, i) => { if (p.status === 'ready') idx.push(i); });

      for (const i of idx) { if (!G.harvest(i)) break; n++; }
      if (n) setTimeout(() => { UI.flySeq = 0; }, 800);
    },
    seed(el) {
      const key = el.dataset.key, c = dget('crops', key); if (!c) return;

      if (UI.seedAll) { plantMany(key); return; }

    },
    seedall() { UI.seedAll = !UI.seedAll; renderSheet(); },
    plantall(el) { const k = S().flags['ui.lastCrop']; if (!k || el.getAttribute('aria-disabled')) return; plantMany(k); },
    'sheet-close'() { closeSheet(); },
    pact(el, e) {
      const sp = UI.sheet; if (!sp || sp.kind !== 'panel') return;
      const P = G.panels && G.panels[sp.key]; if (!P || !P.onAction) return;
      if (el.getAttribute('aria-disabled') === 'true' && !el.dataset.always) { if (el.dataset.why) G.toast(el.dataset.why, 'bad'); return; }
      P.onAction(el.dataset.pa, el, sp.arg, e); queueRender();
    },
    'sheet-bg'(el, e) { if (e.target === el) closeSheet(); },
    feed(el) { G.feedAnimal(+el.dataset.i); },
    collect(el) { G.collectAnimal(+el.dataset.i); },
    'pen-info'(el) { const a = S().animals[+el.dataset.i]; if (a) { const d = dget('animals', a.type) || {}; G.toast(`${d.emoji || ''} ${d.name || 'Animal'}: ${fmtT((a.readyAt - Date.now()) / 1000)} until ${iName(d.product)}`, 'info'); } },
    bld(el) { openSheet({ kind: 'bld', i: +el.dataset.i }); },
    bcollect(el, e) { if (e && e.stopPropagation) e.stopPropagation(); G.collectBuilding(+el.dataset.i); },
    recipe(el) { if (el.getAttribute('aria-disabled')) { const b = S().buildings[+el.dataset.i]; G.toast(b && b.queue.length >= b.maxQueue ? 'Queue full' : 'Missing ingredients', 'bad'); return; } G.startRecipe(+el.dataset.i, el.dataset.id); },
    odo(el) {
      if (el.getAttribute('aria-disabled')) { G.toast('You are missing some items', 'bad'); return; }
      try { if (G.Economy && G.Economy.fulfill) G.Economy.fulfill(el.dataset.id); } catch (e) { console.error(e); }
    },
    odel(el) { try { if (G.Economy && G.Economy.discard) { G.Economy.discard(el.dataset.id); G.toast('Order discarded', 'info'); } } catch (e) { console.error(e); } },
    shoptab(el) { UI.shopTab = el.dataset.v; renderShop(); },
    buy(el) {
      const k = el.dataset.key, kind = el.dataset.kind; let ok = false, nm = '';
      if (kind === 'animals') { ok = G.buyAnimal(k); nm = (dget('animals', k) || {}).name; }
      else if (kind === 'buildings') { ok = G.buyBuilding(k); nm = (dget('buildings', k) || {}).name; }
      else if (kind === 'upgrades') { ok = G.buyExpansion(k); nm = (dget('expansions', k) || {}).name; }
      else { ok = G.buyPlot(); nm = 'a new plot'; }
      if (ok) G.toast(`Bought ${nm}!`, 'good');
    },
    sell(el) {
      const k = el.dataset.key, n = el.dataset.n === 'all' ? G.qty(k) : +el.dataset.n;
      G.sell(k, n);
    },
    echip(el) { openSheet({ kind: 'event', id: el.dataset.id }); },
    avatar(el) { S().flags['ui.avatar'] = el.dataset.v; fillProfile(false); queueRender(); G.save && G.save(); },
    saveprofile() {
      const n = $('#pf-name').value, f = $('#pf-farm').value;
      if (!G.setPlayerName(n)) { G.toast('Please enter a name', 'bad'); return; }

      G.toast('Profile saved!', 'good'); fillProfile(true);
    },
    reset() { confirmReset(); },
    'm-close'() { nextModal(); },
    'm-choice'(el) { if (UI.cur && UI.cur.onChoice) UI.cur.onChoice(+el.dataset.i); },
    'm-yes'() { if (UI.cur && UI.cur.onYes) UI.cur.onYes(); },
    'welcome-go'(el) { if (el.getAttribute('aria-disabled')) { G.toast('Type your name first', 'info'); return; } welcomeGo(); }
  };
  function dispatch(el, e) {
    const a = el.dataset.act, fn = ACT[a]; if (!fn) return;
    UI.tapRect = el.getBoundingClientRect(); UI.tapAt = Date.now();
    try { fn(el, e); } catch (err) { console.error('[ui action]', a, err); }
  }
  // pointer-based tap detection (scrolling cancels the pointer, so scrolls never trigger taps)
  let down = null;
  const sigOf = el => el.dataset.act + JSON.stringify(el.dataset);
  function bindInput() {
    document.addEventListener('pointerdown', e => {
      const el = e.target.closest && e.target.closest('[data-act]');
      down = el ? { sig: sigOf(el), x: e.clientX, y: e.clientY } : null;
    }, { passive: true });
    document.addEventListener('pointerup', e => {
      const d = down; down = null; if (!d) return;
      const el = e.target.closest && e.target.closest('[data-act]');
      if (!el || sigOf(el) !== d.sig || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
      dispatch(el, e);
      UI.lastPtr = Date.now();
    });
    document.addEventListener('pointercancel', () => { down = null; });
    // keyboard-initiated clicks only (detail 0); pointer taps are handled above
    document.addEventListener('click', e => {
      if (e.detail !== 0) return;
      const el = e.target.closest && e.target.closest('[data-act]'); if (el) dispatch(el, e);
    });

    document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.plot,.pen,.bld,.tab')) e.preventDefault(); });
  }

  // ---------- bus wiring ----------
  function wire() {
    const on = (n, f) => G.bus.on(n, p => { try { f(p); } catch (e) { console.error('[ui]', n, e); } });
    on('change', queueRender);
    on('tick', p => {
      const now = (p && p.now) || Date.now(); updateTimers(now); updateSky(p && p.cal); updateSeasonChip(p && p.cal); tickChecks(now);
      const sp = UI.sheet; if (sp && sp.kind === 'panel') { const P = G.panels && G.panels[sp.key]; if (P && P.live) renderSheet(); }

    });
    on('collected', p => { fly(`+${p.n} ${esc(iEmoji(p.key))}`, tapOrigin(), $('#hud-barn-pill')); });
    on('coins', p => {
      const pill = $('#hud-coins-pill'); if (!p) return;
      if (p.delta > 0) fly(`+${fmt(p.delta)} 🪙`, tapOrigin(), pill, { cls: 'coin', dur: 1000 }); else if (pill) bump(pill);
    });
    on('order:done', p => {
      const o = (p && (p.order || p)) || {};
      G.toast('Order delivered!' + (o.coins ? ` +${fmt(o.coins)} 🪙` : ''), 'good');
    });
    on('levelup', p => pushModal(levelModal((p && p.level) || S().level)));
    on('event:start', p => {
      if (!p || !p.def) return;
      pushModal(eventModal(p));
      UI.tfx = { list: fxFor(p.def.key || '', p.def), until: Date.now() + 9000 };
      updateFX(); queueRender();
    });
    on('event:end', p => { if (p && p.event) dismissEventModal(p.event.id); updateFX(); queueRender(); });
    on('event:choice', p => { if (p && p.event) { dismissEventModal(p.event.id); } queueRender(); });
    on('player:rename', queueRender);
  }

  // ---------- public UI kit for other modules ----------
  G.openPanel = function (key, arg) { if (!G.panels || !G.panels[key]) { console.warn('no panel', key); return; } openSheet({ kind: 'panel', key, arg }); };
  G.closePanel = closeSheet;
  G.refreshPanel = () => { const b = $('#sheet-body'); if (b) b._h = null; renderSheet(); };
  G.panelOpen = () => (UI.sheet && UI.sheet.kind === 'panel') ? UI.sheet.key : null;
  // Generic modal: G.showModal({ emoji, title, text, html?, kind:'good'|'bad'|'neutral', buttons:[{label, cls:'btn-gold'|'btn-green'|'btn-gray'|'btn-red', onClick}] , confetti?:bool })
  G.showModal = function (o) {
    o = o || {}; const btns = (o.buttons && o.buttons.length ? o.buttons : [{ label: 'OK', cls: 'btn-gold' }]);
    const spec = {
      html: `<div class="mcard ${o.kind ? 'ev ' + esc(o.kind) : ''}">${o.emoji ? `<div class="wel-av">${esc(o.emoji)}</div>` : ''}${o.title ? `<h2>${esc(o.title)}</h2>` : ''}${o.text ? `<p>${esc(o.text)}</p>` : ''}${o.html || ''}${btns.map((b, i) => `<button class="btn ${esc(b.cls || 'btn-gold')}" data-act="m-choice" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`,
      onChoice(i) { nextModal(); try { btns[i] && btns[i].onClick && btns[i].onClick(); } catch (e) { console.error(e); } queueRender(); },
      onShow: o.confetti ? confetti : null
    };
    pushModal(spec);
  };
  G.uikit = { worldOn, openSeed: i => openSheet({ kind: 'seed', plot: i }), openBuilding: i => openSheet({ kind: 'bld', i }), openEvent: id => openSheet({ kind: 'event', id }), closeSheet, sheetOpen: () => !!UI.sheet, esc, fmt, fmtT, needChips, iEmoji, iName, tm, fly, confetti, bump, tapOrigin, queueRender, showTab: t => showTab(t), tab: () => UI.tab };

  // ---------- init ----------
  G.bus.on('init', function () {
    try {
      bindInput(); wire(); buildFxParticles();
      $$('.view').forEach(v => { v.hidden = v.dataset.view !== 'farm'; });
      updateSky(); renderAll();
      const s = S();
      if (!s.flags['ui.welcomed'] || !s.playerName) pushModal(welcomeModal());
      else setTimeout(() => G.toast(`Welcome back, ${pname()}!`, 'good'), 400);
      addEventListener('resize', () => { renderHUD(); updateSky(); });
    } catch (e) { console.error('[ui init]', e); }
  });
})();

</script>
<script>/* ---- world.js ---- */
/* world.js — Kellyville walkable farm world. A top-down 2D canvas the player walks around.
   Owns: G.World. Reads core state + the optional v2 modules (Machines, Ranch, Stand, Restaurant) behind guards.
   Everything is drawn with vector shapes + emoji sprites; static terrain is cached to an offscreen canvas. */
(function () {
  'use strict';
  const G = window.G; if (!G) return;
  const T = 40, W = 40, H = 30, TAU = Math.PI * 2;
  const S = () => G.state;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t * t * (3 - 2 * t);
  const safe = (fn, d) => { try { const v = fn(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
  const hash = str => { let h = 2166136261; str = String(str); for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
  const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const el = id => document.getElementById(id);
  const iEmoji = k => safe(() => G.itemInfo(k).emoji, '📦') || '📦';
  const iName = k => safe(() => G.itemInfo(k).name, k) || k;

  // ---------------------------------------------------------------- layout constants (tile units)
  const Z = {
    barn: { x: 2, y: 2, w: 6, h: 5, pt: [5, 7.6], emoji: '🏚️', label: 'Barn' },
    shed: { x: 9, y: 3, w: 5, h: 4, pt: [11.5, 7.6], emoji: '🚜', label: 'Tractor shed' },
    house: { x: 15, y: 2, w: 6, h: 5, pt: [17.5, 7.7], emoji: '🏠', label: 'Farmhouse' },
    restaurant: { x: 30, y: 2, w: 8, h: 5, pt: [34, 7.5], emoji: '🍽️', label: 'Restaurant' },
    orders: { x: 11, y: 23, w: 2, h: 1, pt: [12, 24.8], emoji: '📋', label: 'Orders' },
    stand: { x: 4, y: 23, w: 5, h: 2, pt: [6.5, 25.55], emoji: '🧺', label: 'Farm stand' },
    shop: { x: 32, y: 23, w: 5, h: 2, pt: [34.5, 25.55], emoji: '🏪', label: 'Co-op store' },
    pasture: { x: 30, y: 12, w: 8, h: 10, pt: [29.4, 17], emoji: '🐄', label: 'Pasture' },
    fields: { x: 2, y: 9, w: 12, h: 12, pt: [7, 8.6], emoji: '🌾', label: 'Fields', nosolid: true },
    pens: { x: 15, y: 9, w: 12, h: 9, pt: [21, 13.5], emoji: '🐔', label: 'Animal pens', nosolid: true },
    buildings: { x: 15, y: 19, w: 12, h: 5, pt: [20.5, 21], emoji: '🏭', label: 'Buildings', nosolid: true }
  };
  const ZONE_ORDER = ['house', 'fields', 'pens', 'buildings', 'barn', 'orders', 'shop', 'shed', 'pasture', 'stand', 'restaurant'];
  const PEN_POS = [[15, 9, 'b'], [22, 9, 'b'], [15, 14, 't'], [22, 14, 't']]; // x, y, gate side (6x4 footprint)
  const PASTURE_GATE = { x: 30, y: 16, h: 2 };
  const POND = { cx: 24.5, cy: 4.4, rx: 2.9, ry: 1.8 };
  const TABLE_XS = [31.4, 33.2, 35.0, 36.8], TABLE_YS = [8.7, 10.6];
  const SPAWN = [17.5, 8.5];
  const ROAD0 = 26, ROAD1 = 28;
