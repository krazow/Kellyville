<div id="app" data-season="spring" data-tab="farm">

  <!-- ===== Scenery: sky, Palouse hills, barn & grain elevator ===== -->
  <div id="scene" aria-hidden="true">
    <div class="sky-pad"></div>
    <div id="stars"></div>
    <div id="orb">☀️</div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <svg id="hills" viewBox="0 0 480 240" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
      <!-- far ridge -->
      <path class="h1" d="M0 122 C60 92 120 102 182 116 S300 96 362 108 S440 100 480 106 V240 H0Z"/>
      <!-- wind turbines -->
      <g stroke="#f4f4f0" stroke-width="1.3" stroke-linecap="round" opacity=".9">
        <path d="M262 106 V84 M262 84 L262 74 M262 84 L269.5 88 M262 84 L255 88.5"/>
        <path d="M418 104 V86 M418 86 L418 78 M418 86 L424 89.5 M418 86 L412.5 89.5"/>
      </g>
      <!-- grain elevator -->
      <g transform="translate(92,56)">
        <rect x="0" y="27" width="10" height="40" fill="#e9e1d0"/><ellipse cx="5" cy="27" rx="5" ry="2" fill="#f8f3e6"/><rect x="6.5" y="27" width="3.5" height="40" fill="#c6bba3" opacity=".65"/>
        <rect x="11" y="27" width="10" height="40" fill="#ece5d5"/><ellipse cx="16" cy="27" rx="5" ry="2" fill="#f8f3e6"/><rect x="17.5" y="27" width="3.5" height="40" fill="#c6bba3" opacity=".65"/>
        <rect x="22" y="27" width="10" height="40" fill="#e9e1d0"/><ellipse cx="27" cy="27" rx="5" ry="2" fill="#f8f3e6"/><rect x="28.5" y="27" width="3.5" height="40" fill="#c6bba3" opacity=".65"/>
        <rect x="33" y="27" width="10" height="40" fill="#ece5d5"/><ellipse cx="38" cy="27" rx="5" ry="2" fill="#f8f3e6"/><rect x="39.5" y="27" width="3.5" height="40" fill="#c6bba3" opacity=".65"/>
        <rect x="9" y="6" width="17" height="23" fill="#f0e9da"/>
        <path d="M7 6 L17.5 -1 L28 6Z" fill="#8e8470"/>
        <rect x="14" y="12" width="7" height="6" fill="#8e8470" opacity=".75"/>
        <path d="M26 12 L60 31" stroke="#8b8270" stroke-width="2"/>
        <rect x="48" y="50" width="24" height="17" fill="#d9d0bc"/><path d="M46 50 L60 43 L74 50Z" fill="#8e8470"/>
      </g>
      <!-- mid hill: wheat gold -->
      <path class="h2" d="M0 142 C70 112 140 122 212 138 S330 118 402 126 S462 122 480 124 V240 H0Z"/>
      <path d="M0 150 C74 124 140 134 214 148 S336 130 404 138 S462 134 480 136" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.6"/>
      <path d="M0 160 C74 136 142 146 216 160 S338 142 406 150 S464 146 480 148" fill="none" stroke="rgba(120,70,20,.16)" stroke-width="1.6"/>
      <!-- red barn + silo -->
      <g transform="translate(330,88)">
        <path d="M0 40 V16 L9 5 H47 L56 16 V40Z" fill="#b83a2d"/>
        <path d="M-3 17 L8 3 H48 L59 17 L56 17 L47 6 H9 L0 17Z" fill="#6f251c"/>
        <rect x="19" y="21" width="18" height="19" fill="#8f2c22"/>
        <path d="M19 21 L37 40 M37 21 L19 40" stroke="#f3e7cf" stroke-width="1.6"/>
        <rect x="19" y="21" width="18" height="19" fill="none" stroke="#f3e7cf" stroke-width="1.6"/>
        <rect x="24" y="9" width="8" height="6" fill="#f3e7cf"/>
        <rect x="58" y="14" width="9" height="26" fill="#cfd6d9"/><path d="M58 14 a4.5 4 0 0 1 9 0Z" fill="#98a4ab"/>
      </g>
      <!-- near hill: sage -->
      <path class="h3" d="M0 172 C80 152 152 162 232 176 S382 160 480 152 V240 H0Z"/>
      <path d="M0 184 C84 166 156 176 236 190 S384 174 480 166" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.6"/>
      <path d="M0 196 C90 180 160 190 240 202 S390 188 480 180" fill="none" stroke="rgba(60,40,10,.13)" stroke-width="1.6"/>
      <!-- fence -->
      <g stroke="#6b4a26" stroke-width="1.6" opacity=".55" stroke-linecap="round">
        <path d="M14 196 V184 M40 193 V181 M66 191 V179 M92 191 V179 M118 193 V181"/>
        <path d="M12 187 H120 M12 192 H120"/>
      </g>
      <!-- foreground -->
      <path class="h4" d="M0 214 C100 198 200 212 300 206 S440 198 480 204 V240 H0Z"/>
    </svg>
    <div id="ground"></div>
    <div id="shade"></div>
  </div>

  <!-- ===== HUD ===== -->
  <header id="hud">
    <div class="hud-top">
      <div class="who" id="hud-who"><span class="who-av" id="hud-av">🧑‍🌾</span><span class="who-txt" id="hud-who-txt">Farmer</span></div>
      <div class="chip season" id="hud-season">🌱 Spring · Day 1</div>
    </div>
    <div class="hud-row">
      <div class="lvl" id="hud-level" aria-label="Level">
        <div class="ring" id="hud-ring"><span id="hud-lvl-num">1</span></div>
        <em>LV</em>
      </div>
      <div class="hud-col">
        <div class="hud-pills">
          <div class="pill coins" id="hud-coins-pill"><span class="ico">🪙</span><b id="hud-coins">0</b></div>
          <div class="pill barn" id="hud-barn-pill"><span class="ico">🏚️</span><b id="hud-barn">0/0</b></div>
        </div>
        <div class="xpbar"><i id="hud-xpbar"></i><span id="hud-xp">0/20 XP</span></div>
      </div>
    </div>
    <div id="event-strip" class="strip" hidden></div>
  </header>

  <!-- ===== Views ===== -->
  <main id="views">
    <section class="view" id="view-farm" data-view="farm">
      <div class="skyline-gap"><div class="logo"><span>Kellyville</span><small>Eastern Washington</small></div></div>
      <div class="sec"><h2>🌾 Fields</h2><span class="sec-info" id="field-info"></span></div>
      <div class="plots" id="plots"></div>
      <div class="sec"><h2>🐔 Animal pens</h2><span class="sec-info" id="pen-info"></span></div>
      <div class="pens" id="pens"></div>
      <div class="sec"><h2>🏭 Buildings</h2><span class="sec-info" id="bld-info"></span></div>
      <div class="blds" id="blds"></div>
    </section>

    <section class="view" id="view-orders" data-view="orders" hidden>
      <div class="sec"><h2>📋 Truck Orders</h2><span class="sec-info" id="orders-info"></span></div>
      <div class="orders" id="orders-grid"></div>
    </section>

    <section class="view" id="view-shop" data-view="shop" hidden>
      <div class="sec"><h2>🏪 Farm Shop</h2><span class="sec-info" id="shop-info"></span></div>
      <div class="seg" id="shop-seg">
        <button data-act="shoptab" data-v="animals">🐄 Animals</button>
        <button data-act="shoptab" data-v="buildings">🏭 Buildings</button>
        <button data-act="shoptab" data-v="upgrades">⚙️ Upgrades</button>
        <button data-act="shoptab" data-v="land">🟫 Land</button>
      </div>
      <div class="shop-list" id="shop-list"></div>
    </section>

    <section class="view" id="view-barn" data-view="barn" hidden>
      <div class="sec"><h2>🏚️ The Barn</h2><span class="sec-info" id="barn-info"></span></div>
      <div class="capbar"><div class="capfill"><i id="barn-fill"></i></div><span id="barn-cap-txt"></span></div>
      <div class="barn-grid" id="barn-grid"></div>
    </section>

    <section class="view" id="view-almanac" data-view="almanac" hidden>
      <div class="sec"><h2>📰 Palouse Almanac</h2><span class="sec-info" id="alm-info"></span></div>
      <div class="profile" id="alm-profile">
        <div class="pf-head"><span class="pf-av" id="pf-av">🧑‍🌾</span><b>Your profile</b></div>
        <div class="avatars" id="pf-avatars">
          <button data-act="avatar" data-v="🧑‍🌾">🧑‍🌾</button><button data-act="avatar" data-v="👩‍🌾">👩‍🌾</button>
          <button data-act="avatar" data-v="👨‍🌾">👨‍🌾</button><button data-act="avatar" data-v="🤠">🤠</button>
          <button data-act="avatar" data-v="👵">👵</button><button data-act="avatar" data-v="👴">👴</button>
          <button data-act="avatar" data-v="🧒">🧒</button><button data-act="avatar" data-v="🐕">🐕</button>
        </div>
        <label>Farmer name<input id="pf-name" maxlength="20" autocomplete="off" placeholder="Your name"></label>
        <label>Farm name<input id="pf-farm" maxlength="28" autocomplete="off" placeholder="Farm name"></label>
        <button class="btn btn-green" data-act="saveprofile">Save</button>
      </div>
      <div class="stats" id="alm-stats"></div>
      <div class="sec"><h2>⚡ Event log</h2></div>
      <div class="loglist" id="alm-log"></div>
      <div class="sec"><h2>🗺️ Region guide</h2></div>
      <div class="regions" id="alm-regions"></div>
      <div class="reset-wrap"><button class="btn btn-red" data-act="reset">🗑️ Reset farm</button></div>
    </section>
  </main>

  <!-- ===== Floating bits ===== -->
  <div class="dock fab-dock"><button id="fab-harvest" class="fab" data-act="harvestall" hidden>🧺 Harvest all <b id="fab-n"></b></button></div>

  <nav id="tabbar" class="dock">
    <button class="tab on" data-act="tab" data-tab="farm"><i>🌾</i><span>Farm</span></button>
    <button class="tab" data-act="tab" data-tab="orders"><i>📋</i><span>Orders</span><em class="badge" id="badge-orders" hidden></em></button>
    <button class="tab" data-act="tab" data-tab="shop"><i>🏪</i><span>Shop</span></button>
    <button class="tab" data-act="tab" data-tab="barn"><i>🏚️</i><span>Barn</span><em class="badge warn" id="badge-barn" hidden>!</em></button>
    <button class="tab" data-act="tab" data-tab="almanac"><i>📰</i><span>Almanac</span></button>
  </nav>

  <div id="toasts"></div>

  <div id="sheet-wrap" data-act="sheet-bg" hidden>
    <div id="sheet" role="dialog"><div class="grab"></div><div id="sheet-body"></div></div>
  </div>

  <div id="modal-root" hidden></div>
  <div id="float-layer"></div>
  <div id="confetti"></div>
</div>

<!-- weather / event atmosphere overlay -->
<div id="fx" class="fx" aria-hidden="true">
  <i class="l l-dust"></i><i class="l l-smoke"></i><i class="l l-heat"></i><i class="l l-frost"></i>
  <i class="l l-rain"></i><i class="l l-hail"></i><i class="l l-snow"></i><i class="l l-sun"></i>
</div>
